<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deckbuilder Pokedex</title>
    <!-- Tailwind CSS Play CDN + Static Fallback -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (Production UMD) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Press+Start+2P&family=VT323&display=swap');

        :root {
            --theme-bg: #061021;
            --theme-bg-secondary: #0c1f3d;
            --theme-panel-solid: #10264a;
            --theme-panel: rgba(16, 38, 74, 0.96);
            --theme-subpanel: #08152b;
            --theme-border: #e11d48;
            --theme-border-secondary: #00b4d8;
            --theme-accent: #e11d48;
            --theme-accent-hover: #be123c;
            --theme-glow: rgba(225, 29, 72, 0.5);
            --theme-text-accent: #38bdf8;
            --theme-gradient: radial-gradient(circle at 10% 15%, rgba(225, 29, 72, 0.32), transparent 48%),
                              radial-gradient(circle at 90% 85%, rgba(0, 180, 216, 0.34), transparent 52%);
            --gen-radius: 10px;
            --gen-card-clip: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            --gen-font-display: 'Orbitron', 'Inter', sans-serif;
            --gen-font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            --gen-card-shadow: 0 6px 18px rgba(0, 0, 0, 0.55), inset 0 0 12px rgba(56, 189, 248, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        .pixel-sprite {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .hidden { display: none !important; }
        button {
            background: transparent;
            color: inherit;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        input, textarea, select {
            font-family: inherit;
            color: #f8fafc;
            background-color: var(--theme-subpanel);
        }
        img {
            max-width: 100%;
            display: block;
        }

        .bg-slate-950, .bg-slate-950\/90 { background-color: rgba(4, 9, 20, 0.95) !important; }
        .bg-slate-900, .bg-slate-900\/95, .bg-slate-900\/90, .bg-slate-900\/80, .bg-slate-900\/70, .bg-slate-900\/60 { background-color: var(--theme-subpanel) !important; }
        .bg-slate-800, .bg-slate-800\/95, .bg-slate-800\/90, .bg-slate-800\/80, .bg-slate-800\/70, .bg-slate-800\/50 { background-color: var(--theme-panel-solid) !important; }
        .bg-slate-700, .bg-slate-700\/80 { background-color: var(--theme-bg-secondary) !important; }
        .border-slate-800, .border-slate-700, .border-slate-700\/80, .border-slate-700\/70, .border-slate-700\/50, .border-slate-600 { border-color: var(--theme-border) !important; }
        .text-slate-200 { color: #e2e8f0 !important; }
        .text-slate-300 { color: #cbd5e1 !important; }
        .text-slate-400 { color: #94a3b8 !important; }
        .text-slate-500 { color: #64748b !important; }

        .card-aspect-ratio {
            position: relative;
            width: 100%;
            aspect-ratio: 63 / 88;
        }
        @supports not (aspect-ratio: 63 / 88) {
            .card-aspect-ratio {
                padding-top: 139.68%;
                height: 0;
            }
            .card-aspect-ratio > img, .card-aspect-ratio > div {
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--gen-font-body);
            background-color: var(--theme-bg);
            background-image: var(--theme-gradient);
            background-attachment: fixed;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            transition: background-color 0.3s ease, background-image 0.3s ease;
        }

        /* GEN 1: Kanto Red Pokédex + Classic Game Boy Dot-Matrix LCD */
        body.gen-1 {
            --gen-radius: 0px;
            --gen-card-clip: none;
            --gen-font-display: 'Press Start 2P', monospace;
            --gen-border-style: double;
            --gen-border-width: 4px;
            --gen-card-shadow: 5px 5px 0px #000000;
            background-image:
                radial-gradient(rgba(155, 188, 15, 0.14) 1.5px, transparent 0),
                linear-gradient(180deg, rgba(185, 28, 28, 0.28) 0%, rgba(15, 56, 15, 0.92) 100%);
            background-size: 10px 10px, 100% 100%;
        }
        body.gen-1 .theme-header {
            background: linear-gradient(180deg, #b91c1c 0%, #7f1d1d 100%) !important;
            border-bottom: 5px double #f8fafc !important;
            box-shadow: 0 6px 0 #000000 !important;
        }
        body.gen-1 .oras-subpanel, body.gen-1 .theme-card {
            box-shadow: 5px 5px 0px #000000 !important;
        }

        /* GEN 2: Johto Pokégear Gold & Silver GBC OS */
        body.gen-2 {
            --gen-radius: 4px;
            --gen-card-clip: none;
            --gen-font-display: 'Press Start 2P', monospace;
            --gen-border-style: ridge;
            --gen-border-width: 3px;
            --gen-card-shadow: 0 0 0 2px #0f172a, 4px 4px 0px rgba(250, 204, 21, 0.45);
            background-image:
                repeating-linear-gradient(0deg, rgba(250, 204, 21, 0.05) 0px, rgba(250, 204, 21, 0.05) 2px, transparent 2px, transparent 6px),
                radial-gradient(circle at 20% 20%, rgba(234, 179, 8, 0.25), transparent 55%),
                radial-gradient(circle at 80% 80%, rgba(148, 163, 184, 0.25), transparent 55%);
        }
        body.gen-2 .theme-header {
            background: linear-gradient(180deg, #172554 0%, #0f172a 100%) !important;
            border-bottom: 4px ridge #facc15 !important;
        }

        /* GEN 3: Hoenn GBA PokéNav / Emerald Battle Frontier */
        body.gen-3 {
            --gen-radius: 6px;
            --gen-card-clip: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 3px;
            --gen-card-shadow: 0 6px 0 rgba(4, 47, 46, 0.9), inset 0 0 0 2px rgba(250, 204, 21, 0.25);
            background-image:
                repeating-linear-gradient(180deg, rgba(16, 185, 129, 0.07) 0px, rgba(16, 185, 129, 0.07) 2px, transparent 2px, transparent 5px),
                var(--theme-gradient);
        }
        body.gen-3 .theme-header {
            background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #042f2e 100%) !important;
            border-bottom: 4px solid #f59e0b !important;
        }

        /* GEN 4: Sinnoh DS Pokétch Dual-Screen LCD Watch */
        body.gen-4 {
            --gen-radius: 10px;
            --gen-card-clip: none;
            --gen-font-display: 'VT323', 'Orbitron', monospace;
            --gen-border-style: outset;
            --gen-border-width: 3px;
            --gen-card-shadow: inset 0 0 0 2px rgba(134, 239, 172, 0.25), 0 6px 14px rgba(0,0,0,0.65);
            background-image:
                linear-gradient(90deg, rgba(134, 239, 172, 0.07) 1px, transparent 1px),
                linear-gradient(rgba(134, 239, 172, 0.07) 1px, transparent 1px),
                var(--theme-gradient);
            background-size: 16px 16px, 16px 16px, 100% 100%;
        }
        body.gen-4 .theme-header {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%) !important;
            border-bottom: 4px outset #86efac !important;
        }

        /* GEN 5: Unova C-Gear High-Contrast Black & White Geometric OS */
        body.gen-5 {
            --gen-radius: 2px;
            --gen-card-clip: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            --gen-card-shadow: 4px 4px 0px var(--theme-text-accent);
            background-image:
                repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 14px, transparent 14px, transparent 28px),
                linear-gradient(135deg, #09090b 0%, #18181b 50%, #09090b 100%);
        }
        body.gen-5 .theme-header {
            background: linear-gradient(90deg, #09090b 0%, #27272a 50%, #09090b 100%) !important;
            border-bottom: 3px solid #f4f4f5 !important;
        }

        /* DEFAULT GEN 6: Omega Ruby / Alpha Sapphire PokéNav Plus & DexNav */
        body.gen-6 {
            --gen-radius: 10px;
            --gen-card-clip: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            --gen-card-shadow: 0 8px 22px rgba(0, 0, 0, 0.65), inset 0 0 15px rgba(56, 189, 248, 0.18);
            background-image:
                repeating-linear-gradient(0deg, rgba(56, 189, 248, 0.05) 0px, rgba(56, 189, 248, 0.05) 1px, transparent 1px, transparent 4px),
                linear-gradient(90deg, rgba(225, 29, 72, 0.06) 1px, transparent 1px),
                linear-gradient(rgba(0, 180, 216, 0.06) 1px, transparent 1px),
                var(--theme-gradient);
            background-size: 100% 4px, 36px 36px, 36px 36px, 100% 100%;
        }
        body.gen-6 .theme-header {
            background: linear-gradient(90deg, #2a0815 0%, #0d1f3d 50%, #06283d 100%) !important;
            border-bottom: 3px solid var(--theme-border) !important;
            box-shadow: 0 6px 28px rgba(225, 29, 72, 0.3), 0 2px 14px rgba(56, 189, 248, 0.35) !important;
        }

        /* GEN 7: Alola Rotom Dex (Rotom Orange + Turquoise Bubble Screen) */
        body.gen-7 {
            --gen-radius: 22px;
            --gen-card-clip: none;
            --gen-font-display: 'Orbitron', 'Inter', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 3px;
            --gen-card-shadow: 0 8px 20px rgba(8, 145, 178, 0.35), inset 0 0 14px rgba(56, 189, 248, 0.25);
            background-image:
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.28), transparent 60%),
                repeating-radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.03) 0, rgba(56, 189, 248, 0.03) 8px, transparent 8px, transparent 16px),
                var(--theme-gradient);
        }
        body.gen-7 .theme-header {
            background: linear-gradient(180deg, #ea580c 0%, #c2410c 72%, #083344 100%) !important;
            border-bottom: 4px solid #38bdf8 !important;
        }

        /* GEN 8: Galar Sword & Shield Stadium Broadcast (Skewed Magenta & Cyan Slashes) */
        body.gen-8 {
            --gen-radius: 4px;
            --gen-card-clip: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            --gen-card-shadow: -4px 4px 0px #00f5d4, 4px -4px 0px #ff007f;
            background-image:
                linear-gradient(125deg, rgba(255, 0, 127, 0.18) 0%, transparent 40%, rgba(0, 245, 212, 0.18) 100%),
                repeating-linear-gradient(-35deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 12px, transparent 12px, transparent 24px),
                var(--theme-gradient);
        }
        body.gen-8 .theme-header {
            background: linear-gradient(115deg, #0077b6 0%, #1e1b4b 48%, #be185d 100%) !important;
            border-bottom: 4px solid #00f5d4 !important;
        }

        /* GEN 9: Paldea Scarlet & Violet Terastal Crystal OS */
        body.gen-9 {
            --gen-radius: 16px;
            --gen-card-clip: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            --gen-card-shadow: 0 8px 25px rgba(168, 85, 247, 0.35), inset 0 0 12px rgba(250, 204, 21, 0.22);
            background-image:
                conic-gradient(from 45deg at 50% 0%, rgba(239, 68, 68, 0.18), rgba(250, 204, 21, 0.15), rgba(56, 189, 248, 0.15), rgba(168, 85, 247, 0.22), rgba(239, 68, 68, 0.18)),
                var(--theme-gradient);
        }
        body.gen-9 .theme-header {
            background: linear-gradient(90deg, #7f1d1d 0%, #3b0764 50%, #4c1d95 100%) !important;
            border-bottom: 3px solid #facc15 !important;
        }

        .gen-title-font {
            font-family: var(--gen-font-display);
            letter-spacing: 0.03em;
        }
        body.gen-1 .gen-title-font, body.gen-2 .gen-title-font {
            font-size: 0.85rem;
            line-height: 1.4;
        }
        body.gen-4 .gen-title-font {
            font-size: 1.4rem;
            letter-spacing: 0.06em;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(9, 19, 38, 0.8); border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--theme-border); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--theme-accent); }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.22s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.28s ease-out forwards; }

        .theme-header {
            background-color: var(--theme-panel-solid);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
            border-bottom: var(--gen-border-width) var(--gen-border-style) var(--theme-border);
            box-shadow: 0 6px 24px -4px rgba(0, 0, 0, 0.6), 0 2px 10px var(--theme-glow);
            position: relative;
            transition: all 0.3s ease;
        }

        .theme-card {
            background-color: var(--theme-panel-solid);
            background-image: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0.3) 100%);
            border: var(--gen-border-width) var(--gen-border-style) var(--theme-border);
            border-radius: var(--gen-radius);
            clip-path: var(--gen-card-clip);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.25s ease;
            box-shadow: var(--gen-card-shadow);
        }
        .theme-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 28px -4px var(--theme-glow);
            border-color: var(--theme-text-accent);
            z-index: 10;
        }
        .theme-btn-primary {
            background: linear-gradient(135deg, var(--theme-accent) 0%, var(--theme-accent-hover) 100%);
            color: #ffffff !important;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: var(--gen-radius);
            clip-path: var(--gen-card-clip);
            box-shadow: 0 4px 14px -2px var(--theme-glow);
            transition: all 0.2s ease;
        }
        .theme-btn-primary:hover {
            filter: brightness(1.12);
            transform: translateY(-1px);
        }
        .theme-pill-active {
            background: linear-gradient(135deg, var(--theme-accent) 0%, var(--theme-accent-hover) 100%) !important;
            border-color: var(--theme-text-accent) !important;
            color: #ffffff !important;
            box-shadow: 0 0 12px var(--theme-glow);
        }

        .oras-deck-drawer {
            background-color: var(--theme-panel-solid) !important;
            background-image: linear-gradient(180deg, var(--theme-bg-secondary) 0%, var(--theme-bg) 100%) !important;
            border-left: var(--gen-border-width) var(--gen-border-style) var(--theme-border);
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.85);
            color: #f8fafc;
        }
        .oras-modal-panel {
            background-color: var(--theme-panel-solid) !important;
            background-image: linear-gradient(165deg, var(--theme-bg-secondary) 0%, var(--theme-bg) 100%) !important;
            border: var(--gen-border-width) var(--gen-border-style) var(--theme-border);
            border-radius: var(--gen-radius);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px var(--theme-glow);
            color: #f8fafc;
        }
        .oras-subpanel {
            background-color: var(--theme-subpanel) !important;
            border: var(--gen-border-width) var(--gen-border-style) var(--theme-border);
            border-radius: var(--gen-radius);
        }

        .coin-scene {
            width: 46px;
            height: 46px;
            perspective: 600px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }
        .coin-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 9999px;
        }
        .coin-face {
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            border: 2px solid rgba(255, 255, 255, 0.45);
            box-shadow: inset 0 2px 6px rgba(255,255,255,0.45),
                        inset 0 -3px 6px rgba(0,0,0,0.6),
                        0 0 14px var(--theme-glow);
        }

        .etb-sleeve-badge {
            background-size: 200% 200%;
            animation: holoShimmer 4s ease infinite;
        }
        @keyframes holoShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>

        const parseLimitlessText = (rawText) => {
            const lines = rawText.split(/\r?\n/);
            let currentCategory = 'Pokémon';
            const cardMap = new Map();
            const metaCache = loadMetaCache();

            for (let rawLine of lines) {
                const line = rawLine.trim();
                if (!line) continue;

                if (/^Pok[eé]mon/i.test(line)) { currentCategory = 'Pokémon'; continue; }
                if (/^Trainer/i.test(line)) { currentCategory = 'Trainer'; continue; }
                if (/^Energy/i.test(line)) { currentCategory = 'Energy'; continue; }

                const match = line.match(/^(\d+)\s+(.+?)\s+([A-Z0-9-]+)\s+([0-9a-zA-Z]+)$/);
                if (match) {
                    const count = parseInt(match[1], 10);
                    const name = match[2].trim();
                    const setCode = match[3].trim().toUpperCase();
                    let number = match[4].trim();

                    let apiSet = SET_MAP[setCode] || setCode.toLowerCase();
                    let apiNumber = number;

                    if (setCode === 'GEN-RC' && !number.toUpperCase().startsWith('RC')) {
                        apiNumber = `RC${number}`;
                    } else if (setCode === 'SMP' && !number.toUpperCase().startsWith('SM')) {
                        apiNumber = `SM${number}`;
                    } else if (setCode === 'XYP' && !number.toUpperCase().startsWith('XY')) {
                        apiNumber = `XY${number}`;
                    } else if (setCode === 'HIF' && parseInt(number, 10) > 69 && !number.toUpperCase().startsWith('SV')) {
                        apiNumber = `SV${ parseInt(number, 10) - 69 }`;
                    }

                    const uniqueKey = `${setCode}-${number}`;
                    const apiId = `${apiSet}-${apiNumber}`;
                    const imageUrl = `https://images.pokemontcg.io/${apiSet}/${apiNumber}_hires.png`;
                    const smallImageUrl = `https://images.pokemontcg.io/${apiSet}/${apiNumber}.png`;
                    const setIconUrl = `https://images.pokemontcg.io/${apiSet}/symbol.png`;
                    const cached = metaCache[apiId.toLowerCase()];

                    if (cardMap.has(uniqueKey)) {
                        cardMap.get(uniqueKey).count += count;
                    } else {
                        cardMap.set(uniqueKey, {
                            id: uniqueKey,
                            apiId,
                            name,
                            setCode,
                            number,
                            count,
                            category: currentCategory,
                            imageUrl,
                            smallImageUrl,
                            setIconUrl,
                            types: cached?.types || [],
                            subtypes: cached?.subtypes || [],
                            hp: cached?.hp || '',
                            attacks: cached?.attacks || [],
                            abilities: cached?.abilities || [],
                            rules: cached?.rules || [],
                            prices: cached?.prices || null,
                            rating: 0,
                            enriched: Boolean(cached)
                        });
                    }
                }
            }
            return Array.from(cardMap.values());
        };

        const LazyImage = ({ src, fallbackSrc, alt, className }) => {
            const [imgSrc, setImgSrc] = useState(src);
            const [loaded, setLoaded] = useState(false);
            const [errored, setErrored] = useState(false);

            useEffect(() => {
                setImgSrc(src);
                setLoaded(false);
                setErrored(false);
            }, [src]);

            const handleError = () => {
                if (fallbackSrc && imgSrc !== fallbackSrc) {
                    setImgSrc(fallbackSrc);
                } else {
                    setErrored(true);
                    setLoaded(true);
                }
            };

            return (
                <div className="card-aspect-ratio bg-slate-900 overflow-hidden rounded-lg flex items-center justify-center">
                    {!loaded && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 animate-pulse p-3 text-center">
                            <div className="w-8 h-8 rounded-full border-2 border-t-transparent animate-spin mb-2" style={{ borderColor: 'var(--theme-text-accent)', borderTopColor: 'transparent' }}></div>
                            <span className="text-[10px] text-slate-400 font-semibold truncate w-full">{alt}</span>
                        </div>
                    )}
                    {errored ? (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 p-3 text-center border border-slate-700">
                            <span className="text-xs font-extrabold text-white mb-1">{alt}</span>

                        </div>
                    ) : (
                        <img
                            src={imgSrc}
                            alt={alt}
                            loading="lazy"
                            onLoad={() => setLoaded(true)}
                            onError={handleError}
                            className={`${className} transition-opacity duration-300 ${loaded ? 'opacity-100' : 'opacity-0'}`}

        const CardModal = ({ card, onClose, onRate, decks, activeDeckId, onSetActiveDeck, onAddToDeck, onRemoveFromDeck, onUpdateCardPrice }) => {
            const [loadingPrice, setLoadingPrice] = useState(false);
            const [transferQty, setTransferQty] = useState(1);

            useEffect(() => {
                if (!card) return;
                setTransferQty(1);
                if (card.prices) return;

                let cancelled = false;
                const fetchLivePrice = async () => {
                    setLoadingPrice(true);
                    try {
                        const res = await fetch(`https://api.pokemontcg.io/v2/cards/${card.apiId}`);
                        if (res.ok) {
                            const json = await res.json();
                            const data = json.data;
                            if (data && !cancelled) {
                                let extracted = null;
                                if (data.tcgplayer && data.tcgplayer.prices) {
                                    const p = data.tcgplayer.prices;
                                    const variantKey = Object.keys(p)[0];
                                    const v = p[variantKey] || {};
                                    extracted = {
                                        source: 'TCGPlayer',
                                        updatedAt: data.tcgplayer.updatedAt || '',
                                        market: v.market ?? v.mid ?? null,
                                        low: v.low ?? null,
                                        high: v.high ?? null,
                                        normal: p.normal?.market ?? p.normal?.mid ?? null,
                                        holofoil: p.holofoil?.market ?? p.holofoil?.mid ?? null,
                                        reverseHolofoil: p.reverseHolofoil?.market ?? p.reverseHolofoil?.mid ?? null
                                    };
                                } else if (data.cardmarket && data.cardmarket.prices) {
                                    const cm = data.cardmarket.prices;
                                    extracted = {
                                        source: 'Cardmarket',
                                        updatedAt: data.cardmarket.updatedAt || '',
                                        market: cm.averageSellPrice ?? cm.trendPrice ?? null,
                                        low: cm.lowPrice ?? null,
                                        high: cm.trendPrice ?? null
                                    };
                                } else {
                                    extracted = { source: 'N/A', market: null };
                                }
                                onUpdateCardPrice(card.id, extracted);
                            }
                        }
                    } catch (e) {
                        console.warn("Live price lookup failed:", e);
                    } finally {
                        if (!cancelled) setLoadingPrice(false);
                    }
                };
                fetchLivePrice();
                return () => { cancelled = true; };
            }, [card?.id]);

            if (!card) return null;

            const activeDeck = decks.find(d => d.id === activeDeckId) || decks[0] || null;

                                </div>

                                    <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                                        Card Rating ({card.rating || 0}/5)

                                    <PokeballRating
                                        rating={card.rating || 0}
                                        onRate={(r) => onRate(card.id, r)}
                                        size="lg"

                                </div>
                            </div>

                            {/* Right Column: Full View Metadata, Market Price, and Deck Controls */}

                                <div>
                                    <div className="flex flex-wrap items-center gap-2 mb-1">

                                            {card.category}

                                        <span className="px-2.5 py-0.5 rounded text-xs font-bold bg-slate-900 border border-slate-700 text-slate-300 flex items-center gap-1.5">
                                            <img src={card.setIconUrl} alt="" className="w-4 h-4 object-contain filter invert" onError={(e) => { e.target.style.display = 'none'; }} />
                                            {card.setCode} #{card.number}
                                        </span>
                                        {card.hp && (
                                            <span className="px-2.5 py-0.5 rounded text-xs font-extrabold bg-rose-950/90 border border-rose-500/60 text-rose-300">

                                    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                                        <div>
                                            <div className="text-xs font-bold uppercase tracking-wider text-slate-400">Database Inventory</div>

                                                value={activeDeck?.id || ''}
                                                onChange={(e) => onSetActiveDeck(e.target.value)}
                                                className="px-2.5 py-1.5 rounded text-xs font-bold border border-slate-600 bg-slate-900 text-white"
                                            >
                                                {decks.map(d => (
                                                    <option key={d.id} value={d.id}>{d.name}</option>
                                                ))}
                                            </select>
                                        )}
                                    </div>

                                    {activeDeck ? (
                                        <div className="flex flex-wrap items-center gap-2">
                                            <div className="flex items-center border border-slate-700 rounded bg-slate-900">
                                                <button
                                                    type="button"
                                                    onClick={() => setTransferQty(q => Math.max(1, q - 1))}
                                                    className="px-2.5 py-1 text-sm font-bold text-slate-300 hover:text-white"
                                                >-</button>
                                                <span className="px-3 py-1 text-xs font-extrabold text-white">{transferQty}</span>
                                                <button
                                                    type="button"
                                                    onClick={() => setTransferQty(q => Math.min(Math.max(1, card.count), q + 1))}
                                                    className="px-2.5 py-1 text-sm font-bold text-slate-300 hover:text-white"
                                                >+</button>
                                            </div>
                                            <button
                                                type="button"
                                                disabled={card.count < 1}
                                                onClick={() => onAddToDeck(activeDeck.id, card.id, Math.min(transferQty, card.count))}
                                                className={`px-3.5 py-1.5 rounded text-xs font-extrabold transition-all ${
                                                    card.count > 0 ? 'theme-btn-primary' : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                                                }`}
                                            >
                                                Move {Math.min(transferQty, Math.max(1, card.count))} → {activeDeck.name}
                                            </button>
                                            {inActiveDeckCount > 0 && (
                                                <button
                                                    type="button"
                                                    onClick={() => onRemoveFromDeck(activeDeck.id, card.id, 1)}
                                                    className="px-3 py-1.5 rounded text-xs font-bold bg-slate-800 hover:bg-rose-900 text-rose-300 border border-rose-500/40"
                                                >
                                                    Return 1 to DB
                                                </button>
                                            )}
                                        </div>
                                    ) : (
                                        <p className="text-xs text-slate-400">
                                            Open the <strong>Decks</strong> drawer on the right to create a deck and move cards into it.
                                        </p>
                                    )}
                                </div>

                                {/* Live Market Price Section */}
                                <div className="oras-subpanel p-4">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
                                            <Icons.Dollar /> Market Pricing {card.prices?.source ? `(${card.prices.source})` : ''}
                                        </span>
                                        {card.prices?.updatedAt && (
                                            <span className="text-[11px] text-slate-400">Updated {card.prices.updatedAt}</span>
                                        )}
                                    </div>

                                    {loadingPrice ? (
                                        <div className="text-xs text-slate-300 flex items-center gap-2 py-2">
                                            <span className="w-4 h-4 rounded-full border-2 border-emerald-400 border-t-transparent animate-spin"></span>
                                            Fetching live TCGPlayer market data...
                                        </div>
                                    ) : card.prices && card.prices.market !== null ? (
                                        <div className="grid grid-cols-3 gap-2 text-center">
                                            <div className="p-2 rounded bg-slate-950 border border-slate-800">
                                                <div className="text-[10px] text-slate-400 uppercase font-bold">Market</div>
                                                <div className="text-base font-black text-emerald-400">
                                                    ${Number(card.prices.market).toFixed(2)}
                                                </div>
                                            </div>
                                            <div className="p-2 rounded bg-slate-950 border border-slate-800">
                                                <div className="text-[10px] text-slate-400 uppercase font-bold">Low</div>
                                                <div className="text-sm font-bold text-slate-200">
                                                    {card.prices.low ? `$${Number(card.prices.low).toFixed(2)}` : '—'}
                                                </div>
                                            </div>
                                            <div className="p-2 rounded bg-slate-950 border border-slate-800">
                                                <div className="text-[10px] text-slate-400 uppercase font-bold">High / Holo</div>
                                                <div className="text-sm font-bold text-amber-300">
                                                    {card.prices.holofoil
                                                        ? `$${Number(card.prices.holofoil).toFixed(2)}`
                                                        : card.prices.high
                                                        ? `$${Number(card.prices.high).toFixed(2)}`
                                                        : '—'}
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-xs text-slate-400">
                                            Market price not listed for this printing ({card.apiId}).
                                        </div>
                                    )}
                                </div>

                                {/* Abilities, Attacks & Rules */}
                                {(card.abilities?.length > 0 || card.attacks?.length > 0 || card.rules?.length > 0) && (
                                    <div className="oras-subpanel p-4 space-y-3 max-h-60 overflow-y-auto">
                                        {(card.abilities || []).map((ab, idx) => (
                                            <div key={idx} className="text-xs border-b border-slate-800 pb-2">
                                                <span className="px-1.5 py-0.5 rounded bg-rose-700 text-white font-bold mr-2">
                                                    {ab.type || 'Ability'}
                                                </span>
                                                <strong className="text-rose-300 font-extrabold">{ab.name}</strong>
                                                <p className="text-slate-300 mt-1 leading-relaxed">{ab.text}</p>
                                            </div>
                                        ))}
                                        {(card.attacks || []).map((atk, idx) => (
                                            <div key={idx} className="text-xs border-b border-slate-800 pb-2">
                                                <div className="flex items-center justify-between font-extrabold text-white">
                                                    <span>⚔️ {atk.name}</span>
                                                    <span className="text-amber-400">{atk.damage}</span>
                                                </div>
                                                {atk.text && <p className="text-slate-300 mt-1 leading-relaxed">{atk.text}</p>}
                                            </div>
                                        ))}
                                        {(card.rules || []).map((rule, idx) => (
                                            <p key={idx} className="text-[11px] italic text-slate-400 leading-relaxed">
                                                • {rule}
                                            </p>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [cards, setCards] = useState(() => {
                try {
                    const saved = localStorage.getItem('pokedex_kiosk_cards_v1_4');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed)) return parsed;
                    }
                } catch (e) {}
                return [];
            });

            const [decks, setDecks] = useState(() => {
                try {
                    const saved = localStorage.getItem('pokedex_kiosk_decks_v1_4');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return [
                    {
                        id: 'deck-default-1',
                        name: 'Primal ORAS Deck',
                        type: 'Fire',
                        sleeveId: 'evo-gold',
                        cards: {}
                    }
                ];
            });

            const [activeDeckId, setActiveDeckId] = useState('deck-default-1');
            const [showDeckDrawer, setShowDeckDrawer] = useState(false);

            const [themeIndex, setThemeIndex] = useState(() => {
                const saved = localStorage.getItem('pokedex_kiosk_theme_idx');
                return saved ? parseInt(saved, 10) || 0 : 0;
            });

            const [genNumber, setGenNumber] = useState(() => {
                const saved = localStorage.getItem('pokedex_kiosk_gen_num');
                return saved ? parseInt(saved, 10) || 6 : 6;
            });

            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('All');
            const [typeFilter, setTypeFilter] = useState('All');
            const [specialFilter, setSpecialFilter] = useState('All');
            const [trainerFilter, setTrainerFilter] = useState('All');
            const [energyFilter, setEnergyFilter] = useState('All');
            const [setFilter, setSetFilter] = useState('All');
            const [includeDeckCards, setIncludeDeckCards] = useState(false);

            const [selectedCard, setSelectedCard] = useState(null);
            const [showImportModal, setShowImportModal] = useState(false);
            const [showClearModal, setShowClearModal] = useState(false);
            const [importText, setImportText] = useState('');
            const [isEnriching, setIsEnriching] = useState(false);

            // New Deck Creation state inside Deck Drawer
            const [newDeckName, setNewDeckName] = useState('');
            const [newDeckType, setNewDeckType] = useState('Fire');
            const [newDeckSleeve, setNewDeckSleeve] = useState(ETB_SLEEVES[0].id);

            const fileInputRef = useRef(null);

            useEffect(() => {
                const timer = setTimeout(() => {
                    try {
                        localStorage.setItem('pokedex_kiosk_cards_v1_4', JSON.stringify(cards));
                    } catch (e) {}
                }, 400);
                return () => clearTimeout(timer);
            }, [cards]);

            useEffect(() => {
                try {
                    localStorage.setItem('pokedex_kiosk_decks_v1_4', JSON.stringify(decks));
                } catch (e) {}
            }, [decks]);

            useEffect(() => {
                localStorage.setItem('pokedex_kiosk_theme_idx', String(themeIndex));
                localStorage.setItem('pokedex_kiosk_gen_num', String(genNumber));

                const theme = TYPE_THEMES[themeIndex] || TYPE_THEMES[0];
                const genObj = GEN_THEMES.find(g => g.gen === genNumber) || GEN_THEMES[5];
                const root = document.documentElement;

                const isDefaultColorless = themeIndex === 0;
                const activeBg = isDefaultColorless ? genObj.bgOverride : theme.bg;
                const activeBgSec = isDefaultColorless ? genObj.bgSecOverride : theme.bgSec;
                const activePanelSolid = isDefaultColorless ? genObj.panelSolid : theme.panelSolid;
                const activeSubpanel = isDefaultColorless ? genObj.subpanelOverride : theme.bg;
                const activeBorder = isDefaultColorless ? genObj.borderOverride : theme.border;
                const activeAccent = isDefaultColorless ? genObj.accentOverride : theme.accent;
                const activeAccentHover = isDefaultColorless ? genObj.accentHoverOverride : theme.accentHover;
                const activeTextAccent = isDefaultColorless ? genObj.textAccentOverride : theme.textAccent;
                const activeGlow = isDefaultColorless ? genObj.glowOverride : theme.glow;

                root.style.setProperty('--theme-bg', activeBg);
                root.style.setProperty('--theme-bg-secondary', activeBgSec);
                root.style.setProperty('--theme-panel-solid', activePanelSolid);
                root.style.setProperty('--theme-subpanel', activeSubpanel);
                root.style.setProperty('--theme-panel', theme.panel);
                root.style.setProperty('--theme-border', activeBorder);
                root.style.setProperty('--theme-accent', activeAccent);
                root.style.setProperty('--theme-accent-hover', activeAccentHover);
                root.style.setProperty('--theme-glow', activeGlow);
                root.style.setProperty('--theme-text-accent', activeTextAccent);
                root.style.setProperty('--theme-gradient', theme.gradient);

                GEN_THEMES.forEach(g => document.body.classList.remove(`gen-${g.gen}`));
                document.body.classList.add(`gen-${genNumber}`);
            }, [themeIndex, genNumber]);

            useEffect(() => {
                const unenriched = cards.filter(c => !c.enriched);
                if (unenriched.length === 0 || isEnriching) return;

                let cancelled = false;
                const BATCH_SIZE = 30;
                const CONCURRENCY = 5; // 5 parallel requests * 30 cards = 150 unique cards per wave

                const fetchSingleBatch = async (batch) => {
                    const queryStr = batch.map(c => `id:"${c.apiId}"`).join(' OR ');
                    const encodedQuery = encodeURIComponent(`(${queryStr})`);
                    const url = `https://api.pokemontcg.io/v2/cards?q=${encodedQuery}&pageSize=250&select=id,types,subtypes,supertype,hp,attacks,abilities,rules,tcgplayer,cardmarket`;

                    try {
                        const res = await fetch(url);
                        if (res.status === 429) {
                            return { rateLimited: true, batch, items: [] };
                        }
                        if (res.ok) {
                            const data = await res.json();
                            return { rateLimited: false, batch, items: data.data || [] };
                        }
                        return { rateLimited: false, batch, items: [] };
                    } catch (err) {
                        return { rateLimited: false, batch, items: [], networkError: true };
                    }
                };

                const enrichWave = async () => {
                    setIsEnriching(true);
                    const waveCards = unenriched.slice(0, BATCH_SIZE * CONCURRENCY);
                    const subBatches = [];
                    for (let i = 0; i < waveCards.length; i += BATCH_SIZE) {
                        subBatches.push(waveCards.slice(i, i + BATCH_SIZE));
                    }

                    const results = await Promise.all(subBatches.map(b => fetchSingleBatch(b)));
                    if (cancelled) return;

                    const hitRateLimit = results.some(r => r.rateLimited);
                    const apiMap = new Map();
                    const processedIds = new Set();

                    results.forEach(res => {
                        if (!res.rateLimited && !res.networkError) {
                            res.batch.forEach(c => processedIds.add(c.id));
                            res.items.forEach(item => {
                                apiMap.set(item.id.toLowerCase(), item);
                            });
                        }
                    });

                    if (processedIds.size > 0) {
                        const metaCache = loadMetaCache();
                        setCards(prev => prev.map(card => {
                            if (!processedIds.has(card.id)) return card;
                            const found = apiMap.get(card.apiId.toLowerCase());
                            if (!found) return { ...card, enriched: true };

                            let extractedPrice = card.prices;
                            if (!extractedPrice && found.tcgplayer?.prices) {
                                const p = found.tcgplayer.prices;
                                const firstKey = Object.keys(p)[0];
                                const v = p[firstKey] || {};
                                extractedPrice = {
                                    source: 'TCGPlayer',
                                    updatedAt: found.tcgplayer.updatedAt || '',
                                    market: v.market ?? v.mid ?? null,
                                    low: v.low ?? null,
                                    high: v.high ?? null,
                                    holofoil: p.holofoil?.market ?? null
                                };
                            }

                            const updatedCard = {
                                ...card,
                                types: found.types || card.types || [],
                                subtypes: found.subtypes || card.subtypes || [],
                                hp: found.hp || card.hp || '',
                                attacks: found.attacks || card.attacks || [],
                                abilities: found.abilities || card.abilities || [],
                                rules: found.rules || card.rules || [],
                                prices: extractedPrice || null,
                                enriched: true
                            };

                            metaCache[card.apiId.toLowerCase()] = {
                                types: updatedCard.types,
                                subtypes: updatedCard.subtypes,
                                hp: updatedCard.hp,
                                attacks: updatedCard.attacks,
                                abilities: updatedCard.abilities,
                                rules: updatedCard.rules,
                                prices: updatedCard.prices
                            };

                            return updatedCard;
                        }));
                        saveMetaCache(metaCache);
                    }

                    const nextDelay = hitRateLimit ? 2500 : 80;
                    setTimeout(() => {
                        if (!cancelled) setIsEnriching(false);
                    }, nextDelay);
                };

                enrichWave();
                return () => { cancelled = true; };
            }, [cards, isEnriching]);

            const handleRateCard = (cardId, newRating) => {
                setCards(prev => prev.map(c => c.id === cardId ? { ...c, rating: newRating } : c));
                if (selectedCard && selectedCard.id === cardId) {
                    setSelectedCard(prev => prev ? { ...prev, rating: newRating } : null);
                }
            };

            const handleUpdateCardPrice = (cardId, priceObj) => {
                setCards(prev => prev.map(c => c.id === cardId ? { ...c, prices: priceObj } : c));
                if (selectedCard && selectedCard.id === cardId) {
                    setSelectedCard(prev => prev ? { ...prev, prices: priceObj } : null);
                }
            };

            // Move individual card copies from Database into a Deck
            const handleAddToDeck = (deckId, cardId, qty = 1) => {
                const targetCard = cards.find(c => c.id === cardId);
                if (!targetCard || targetCard.count < qty) return;

                setCards(prev => prev.map(c => c.id === cardId ? { ...c, count: c.count - qty } : c));
                setDecks(prev => prev.map(d => {
                    if (d.id !== deckId) return d;
                    const currentQty = d.cards[cardId] || 0;
                    return {
                        ...d,
                        cards: { ...d.cards, [cardId]: currentQty + qty }
                    };
                }));
                if (selectedCard && selectedCard.id === cardId) {
                    setSelectedCard(prev => prev ? { ...prev, count: prev.count - qty } : null);
                }
            };

            // Return individual card copies from a Deck back to the Database
            const handleRemoveFromDeck = (deckId, cardId, qty = 1) => {
                const targetDeck = decks.find(d => d.id === deckId);
                if (!targetDeck || (targetDeck.cards[cardId] || 0) < qty) return;

                setCards(prev => prev.map(c => c.id === cardId ? { ...c, count: c.count + qty } : c));
                setDecks(prev => prev.map(d => {
                    if (d.id !== deckId) return d;
                    const nextCount = (d.cards[cardId] || 0) - qty;
                    const nextCards = { ...d.cards };
                    if (nextCount <= 0) delete nextCards[cardId];
                    else nextCards[cardId] = nextCount;
                    return { ...d, cards: nextCards };
                }));
                if (selectedCard && selectedCard.id === cardId) {
                    setSelectedCard(prev => prev ? { ...prev, count: prev.count + qty } : null);
                }
            };

            const handleCreateDeck = (e) => {
                e.preventDefault();
                const name = newDeckName.trim() || `Deck #${decks.length + 1}`;
                const newDeck = {
                    id: `deck-${Date.now()}`,
                    name,
                    type: newDeckType,
                    sleeveId: newDeckSleeve,
                    cards: {}
                };
                setDecks(prev => [...prev, newDeck]);
                setActiveDeckId(newDeck.id);
                setNewDeckName('');
            };

            const handleDeleteDeck = (deckId) => {
                const deckToDelete = decks.find(d => d.id === deckId);
                if (!deckToDelete) return;

                // Return all cards in this deck back to the main database
                setCards(prev => prev.map(c => {
                    const returned = deckToDelete.cards[c.id] || 0;
                    return returned > 0 ? { ...c, count: c.count + returned } : c;
                }));

                const remaining = decks.filter(d => d.id !== deckId);
                setDecks(remaining);
                if (activeDeckId === deckId) {
                    setActiveDeckId(remaining[0]?.id || '');
                }
            };

            const handleImportSubmit = () => {
                if (!importText.trim()) return;
                const parsed = parseLimitlessText(importText);
                const existingMap = new Map(cards.map(c => [c.id, c]));
                const merged = parsed.map(newCard => {
                    const old = existingMap.get(newCard.id);
                    if (old) {
                        return {
                            ...newCard,
                            rating: old.rating || 0,
                            types: old.types?.length ? old.types : newCard.types,
                            subtypes: old.subtypes?.length ? old.subtypes : newCard.subtypes,
                            hp: old.hp || newCard.hp,
                            attacks: old.attacks?.length ? old.attacks : newCard.attacks,
                            abilities: old.abilities?.length ? old.abilities : newCard.abilities,
                            rules: old.rules?.length ? old.rules : newCard.rules,
                            prices: old.prices || newCard.prices,
                            enriched: old.enriched
                        };
                    }
                    return newCard;
                });
                setCards(merged);
                setShowImportModal(false);
                setImportText('');
            };

            const handleExportJSON = () => {
                const payload = { version: '1.4', cards, decks };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'deckbuilder-pokedex-backup.json';
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleLoadJSON = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (Array.isArray(data)) {
                            setCards(data);
                        } else if (data && Array.isArray(data.cards)) {
                            setCards(data.cards);
                            if (Array.isArray(data.decks)) setDecks(data.decks);
                        }
                    } catch (err) {
                        console.error("Invalid JSON backup file:", err);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const deckAllocationMap = useMemo(() => {
                const map = new Map();
                decks.forEach(d => {
                    Object.entries(d.cards || {}).forEach(([cardId, qty]) => {
                        map.set(cardId, (map.get(cardId) || 0) + qty);
                    });
                });
                return map;
            }, [decks]);

            const availableSets = useMemo(() => {
                const map = new Map();
                cards.forEach(c => {
                    if (!map.has(c.setCode)) {
                        map.set(c.setCode, c.setIconUrl);
                    }
                });
                return Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0]));
            }, [cards]);

            const filteredCards = useMemo(() => {
                const clauses = searchTerm
                    .split(',')
                    .map(s => s.trim())
                    .filter(Boolean);

                return cards.filter(card => {
                    const inDecksQty = deckAllocationMap.get(card.id) || 0;
                    const effectiveCount = includeDeckCards ? (card.count + inDecksQty) : card.count;
                    if (effectiveCount <= 0) return false;

                    if (categoryFilter !== 'All' && card.category !== categoryFilter) return false;
                    if (setFilter !== 'All' && card.setCode !== setFilter) return false;

                    if (categoryFilter === 'Pokémon') {
                        if (typeFilter !== 'All') {
                            const apiTarget = typeFilter === 'Dark' ? 'darkness' : typeFilter === 'Steel' ? 'metal' : typeFilter.toLowerCase();
                            const hasType = (card.types || []).some(t => t.toLowerCase() === apiTarget);
                            if (!hasType) return false;
                        }
                        if (specialFilter !== 'All') {
                            const boundaryRegex = new RegExp(`(^|[-\\s])${specialFilter}([-\\s]|$)`, 'i');
                            const inName = boundaryRegex.test(card.name);
                            const inSub = (card.subtypes || []).some(s => s.toLowerCase() === specialFilter.toLowerCase());
                            if (!inName && !inSub) return false;
                        }
                    }

                    if (categoryFilter === 'Trainer' && trainerFilter !== 'All') {
                        const target = trainerFilter.toLowerCase();
                        const hasSub = (card.subtypes || []).some(s => {
                            const clean = s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                            if (target === 'tool') return clean.includes('tool');
                            return clean === target;
                        });
                        if (!hasSub) return false;
                    }

                    if (categoryFilter === 'Energy' && energyFilter !== 'All') {
                        const isBasicByName = BASIC_ENERGIES.includes(card.name.toLowerCase().trim());
                        const hasSpecialSub = (card.subtypes || []).some(s => s.toLowerCase().includes('special'));
                        if (energyFilter === 'Basic' && (!isBasicByName || hasSpecialSub)) return false;
                        if (energyFilter === 'Special' && isBasicByName && !hasSpecialSub) return false;
                    }

                    // Multi-parameter comma search clauses:
                    // Supports *#* rating search, "quoted" deep text search, and standard name/set search
                    for (const clause of clauses) {
                        const ratingMatch = clause.match(/^\*([0-5])\*$/);
                        if (ratingMatch) {
                            const targetRating = parseInt(ratingMatch[1], 10);
                            if ((card.rating || 0) !== targetRating) return false;
                            continue;
                        }

                        const quoteMatch = clause.match(/^"(.+)"$/);
                        if (quoteMatch) {
                            const needle = quoteMatch[1].toLowerCase();
                            const inHp = (card.hp || '').toLowerCase() === needle || `${card.hp || ''} hp`.toLowerCase().includes(needle);
                            const inAttacks = (card.attacks || []).some(a =>
                                (a.name || '').toLowerCase().includes(needle) ||
                                (a.text || '').toLowerCase().includes(needle) ||
                                (a.damage || '').toLowerCase().includes(needle)
                            );
                            const inAbilities = (card.abilities || []).some(ab =>
                                (ab.name || '').toLowerCase().includes(needle) ||
                                (ab.text || '').toLowerCase().includes(needle)
                            );
                            const inRules = (card.rules || []).some(r => r.toLowerCase().includes(needle));
                            const inName = card.name.toLowerCase().includes(needle);
                            if (!inHp && !inAttacks && !inAbilities && !inRules && !inName) return false;
                            continue;
                        }

                                                                                    e.stopPropagation();
                                                                                    handleAddToDeck(deck.id, cardId, 1);
                                                                                }}
                                                                                title="Add 1 more copy from Database"
                                                                                className="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-emerald-700 text-white font-bold disabled:opacity-40"
                                                                            >
                                                                                +1
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    )}

                                                    <div className="flex justify-end mt-2 pt-2 border-t border-slate-800">
                                                        <button
                                                            type="button"
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleDeleteDeck(deck.id);
                                                            }}
                                                            className="text-[11px] font-bold text-rose-400 hover:text-rose-300 flex items-center gap-1"
                                                        >
                                                            <Icons.Trash /> Delete Deck (Return Cards)
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </aside>
                            </>
                        )}
                    </div>

                    {}
                    {selectedCard && (
                        <CardModal
                            card={selectedCard}
                            onClose={() => setSelectedCard(null)}
                            onRate={handleRateCard}
                            decks={decks}
                            activeDeckId={activeDeck?.id}
                            onSetActiveDeck={setActiveDeckId}
                            onAddToDeck={handleAddToDeck}
                            onRemoveFromDeck={handleRemoveFromDeck}
                            onUpdateCardPrice={handleUpdateCardPrice}
                        />
                    )}

                    {/* Import Limitless Text Modal */}
                    {showImportModal && (
                        <div
                            className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in"
                            onClick={() => setShowImportModal(false)}
                        >
                            <div
                                className="oras-modal-panel w-full max-w-2xl p-5 space-y-4"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                                    <h3 className="text-base font-extrabold text-white gen-title-font">
                                        Import Limitless TCG Deck / Collection Text
                                    </h3>
                                    <button onClick={() => setShowImportModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                                </div>
                                <p className="text-xs text-slate-300">
                                    Paste your Limitless TCG export text below (e.g., <code>10 Pikachu EVO 35</code>). Existing Pokéball ratings will be preserved automatically.
                                </p>
                                <textarea
                                    rows={10}
                                    value={importText}
                                    onChange={(e) => setImportText(e.target.value)}
                                    placeholder={`Pokémon: 21\n10 Pikachu EVO 35\n1 Tapu Lele-GX GRI 60\n\nTrainer: 10\n4 Cynthia UPR 119`}
                                    className="w-full p-3 rounded text-xs font-mono bg-slate-950 border border-slate-700 text-white focus:outline-none"
                                />
                                {}
                                <div className="flex flex-wrap justify-end items-center gap-2">
                                    <div className="flex items-center gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowImportModal(false)}
                                            className="px-4 py-1.5 rounded text-xs font-bold bg-slate-800 text-slate-300 hover:text-white"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="button"
                                            onClick={handleImportSubmit}
                                            className="px-4 py-1.5 rounded text-xs font-extrabold theme-btn-primary"
                                        >
                                            Save & Import Cards
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {showClearModal && (
                        <div
                            className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in"
                            onClick={() => setShowClearModal(false)}
                        >
                            <div
                                className="oras-modal-panel w-full max-w-md p-5 space-y-4"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <h3 className="text-base font-extrabold text-rose-400 gen-title-font">
                                    Clear Entire Database?
                                </h3>
                                <p className="text-xs text-slate-300 leading-relaxed">
                                    This will remove all imported cards and ratings from your local database. You can always re-import your text list or JSON backup at any time.
                                </p>
                                <div className="flex justify-end gap-2">
                                    <button
                                        type="button"
                                        onClick={() => setShowClearModal(false)}
                                        className="px-4 py-1.5 rounded text-xs font-bold bg-slate-800 text-slate-300 hover:text-white"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setCards([]);
                                            setDecks(prev => prev.map(d => ({ ...d, cards: {} })));
                                            localStorage.removeItem('pokedex_kiosk_cards_v1_4');
                                            setShowClearModal(false);
                                        }}
                                        className="px-4 py-1.5 rounded text-xs font-extrabold bg-rose-600 hover:bg-rose-500 text-white"
                                    >
                                        Yes, Wipe Database
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
