        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Press+Start+2P&display=swap');
        
        :root {
            --theme-bg: #091326;
            --theme-bg-secondary: #10203d;
            --theme-panel-solid: #112240;
            --theme-panel: rgba(17, 34, 64, 0.96);
            --theme-border: #e11d48;
            --theme-border-secondary: #0284c7;
            --theme-accent: #e11d48;
            --theme-accent-hover: #be123c;
            --theme-glow: rgba(225, 29, 72, 0.45);
            --theme-text-accent: #38bdf8;
            --theme-gradient: radial-gradient(circle at 12% 15%, rgba(225, 29, 72, 0.22), transparent 50%),
                              radial-gradient(circle at 88% 85%, rgba(2, 132, 199, 0.25), transparent 55%);
            --gen-radius: 10px;
            --gen-card-clip: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
            --gen-header-border: 2px solid var(--theme-border);
            --gen-font-display: 'Orbitron', 'Inter', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
        }

        * {
            box-sizing: border-box;
        }

        /* Explicit Native Fallbacks for Tailwind v3 classes on mobile/offline browsers */
        .hidden { display: none !important; }
        button {
            background: transparent;
            color: inherit;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        input, textarea, select {
            font-family: inherit;
            color: #f8fafc;
            background-color: #091326;
        }
        img {
            max-width: 100%;
            display: block;
        }

        /* Explicit Slate & Aspect Ratio Fallbacks so Mobile never turns transparent */
        .bg-slate-950, .bg-slate-950\/90 { background-color: rgba(4, 9, 20, 0.94) !important; }
        .bg-slate-900, .bg-slate-900\/95, .bg-slate-900\/90, .bg-slate-900\/80, .bg-slate-900\/70, .bg-slate-900\/60 { background-color: var(--theme-bg) !important; }
        .bg-slate-800, .bg-slate-800\/95, .bg-slate-800\/90, .bg-slate-800\/80, .bg-slate-800\/70, .bg-slate-800\/50 { background-color: var(--theme-panel-solid) !important; }
        .bg-slate-700, .bg-slate-700\/80 { background-color: #263859 !important; }
        .border-slate-800, .border-slate-700, .border-slate-700\/80, .border-slate-700\/70, .border-slate-700\/50, .border-slate-600 { border-color: var(--theme-border) !important; }
        .text-slate-200 { color: #e2e8f0 !important; }
        .text-slate-300 { color: #cbd5e1 !important; }
        .text-slate-400 { color: #94a3b8 !important; }
        .text-slate-500 { color: #64748b !important; }
        .card-aspect-ratio {
            position: relative;
            width: 100%;
            aspect-ratio: 63 / 88;
        }
        @supports not (aspect-ratio: 63 / 88) {
            .card-aspect-ratio {
                padding-top: 139.68%;
                height: 0;
            }
            .card-aspect-ratio > img, .card-aspect-ratio > div {
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--theme-bg);
            background-image: var(--theme-gradient);
            background-attachment: fixed;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            transition: background-color 0.4s ease, background-image 0.4s ease;
        }

        /* Generation-Specific Background Overlays & Styles */
        body.gen-1 {
            --gen-radius: 2px;
            --gen-card-clip: none;
            --gen-font-display: 'Press Start 2P', monospace;
            --gen-border-style: double;
            --gen-border-width: 4px;
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 0), var(--theme-gradient);
            background-size: 12px 12px, 100% 100%;
        }
        body.gen-2 {
            --gen-radius: 6px;
            --gen-card-clip: none;
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            background-image: repeating-linear-gradient(0deg, rgba(250, 204, 21, 0.03) 0px, rgba(250, 204, 21, 0.03) 2px, transparent 2px, transparent 6px), var(--theme-gradient);
        }
        body.gen-3 {
            --gen-radius: 8px;
            --gen-card-clip: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
        }
        body.gen-4 {
            --gen-radius: 12px;
            --gen-card-clip: none;
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: ridge;
            --gen-border-width: 3px;
            background-image: linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), var(--theme-gradient);
            background-size: 20px 20px, 20px 20px, 100% 100%;
        }
        body.gen-5 {
            --gen-radius: 4px;
            --gen-card-clip: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 10px, transparent 10px, transparent 20px), var(--theme-gradient);
        }
        /* DEFAULT: Gen 6 - Omega Ruby / Alpha Sapphire PokéNav Plus / DexNav */
        body.gen-6 {
            --gen-radius: 10px;
            --gen-card-clip: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            background-image: 
                repeating-linear-gradient(0deg, rgba(56, 189, 248, 0.035) 0px, rgba(56, 189, 248, 0.035) 1px, transparent 1px, transparent 4px),
                linear-gradient(90deg, rgba(225, 29, 72, 0.04) 1px, transparent 1px),
                var(--theme-gradient);
            background-size: 100% 4px, 32px 32px, 100% 100%;
        }
        body.gen-7 {
            --gen-radius: 22px;
            --gen-card-clip: none;
            --gen-font-display: 'Inter', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 3px;
        }
        body.gen-8 {
            --gen-radius: 6px;
            --gen-card-clip: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
        }
        body.gen-9 {
            --gen-radius: 16px;
            --gen-card-clip: none;
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            background-image: radial-gradient(circle at 50% 0%, rgba(250, 204, 21, 0.14), transparent 45%), var(--theme-gradient);
        }

        .gen-title-font {
            font-family: var(--gen-font-display);
            letter-spacing: 0.03em;
        }
        body.gen-1 .gen-title-font {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(9, 19, 38, 0.8); border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--theme-border); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--theme-accent); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes holoShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes orasPulse {
            0%, 100% { box-shadow: 0 0 12px var(--theme-glow), inset 0 0 12px rgba(56, 189, 248, 0.15); }
            50% { box-shadow: 0 0 22px var(--theme-glow), inset 0 0 18px rgba(225, 29, 72, 0.25); }
        }
        
        .animate-fade-in { animation: fadeIn 0.22s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }

        /* ORAS / Gen-Aware Header & Panels */
        .theme-header {
            background-color: var(--theme-panel-solid);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            border-bottom: var(--gen-border-width) var(--gen-border-style) var(--theme-border);
            box-shadow: 0 6px 24px -4px rgba(0, 0, 0, 0.6), 0 2px 10px var(--theme-glow);
            position: relative;
        }
        /* ORAS Dual Ruby/Sapphire Tech Strip along top of header */
        .oras-top-strip {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, var(--theme-accent) 0%, var(--theme-text-accent) 50%, var(--theme-accent) 100%);
            background-size: 200% 100%;
            animation: holoShimmer 6s linear infinite;
        }

        .theme-card {
            background-color: var(--theme-panel-solid);
            background-image: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.25) 100%);
            border: var(--gen-border-width) var(--gen-border-style) var(--theme-border);
            border-radius: var(--gen-radius);
            clip-path: var(--gen-card-clip);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.25s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.45);
        }
        .theme-card:hover {
            transform: translateY(-5px) scale(1.015);
            box-shadow: 0 12px 28px -4px var(--theme-glow);
            border-color: var(--theme-text-accent);
            z-index: 10;
        }
        .theme-btn-primary {
            background: linear-gradient(135deg, var(--theme-accent) 0%, var(--theme-accent-hover) 100%);
            color: #ffffff !important;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: var(--gen-radius);
            box-shadow: 0 4px 14px -2px var(--theme-glow);
            transition: all 0.2s ease;
        }
        .theme-btn-primary:hover {
            filter: brightness(1.12);
            transform: translateY(-1px);
        }
        .theme-pill-active {
            background: linear-gradient(135deg, var(--theme-accent) 0%, var(--theme-accent-hover) 100%) !important;
            border-color: var(--theme-text-accent) !important;
            color: #ffffff !important;
            box-shadow: 0 0 12px var(--theme-glow);
        }

        /* Opaque Mobile-Safe Drawer & Modals */
        .oras-deck-drawer {
            background-color: var(--theme-panel-solid) !important;
            background-image: linear-gradient(180deg, var(--theme-bg-secondary) 0%, var(--theme-bg) 100%) !important;
            border-left: 2px solid var(--theme-border);
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.85);
            color: #f8fafc;
        }
        .oras-modal-panel {
            background-color: var(--theme-panel-solid) !important;
            background-image: linear-gradient(165deg, var(--theme-bg-secondary) 0%, var(--theme-bg) 100%) !important;
            border: 2px solid var(--theme-border);
            border-radius: var(--gen-radius);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px var(--theme-glow);
            color: #f8fafc;
        }
        .oras-subpanel {
            background-color: var(--theme-bg) !important;
            border: 1px solid var(--theme-border);
            border-radius: var(--gen-radius);
        }

        /* 3D Type Coin */
        .coin-scene {
            width: 48px;
            height: 48px;
            perspective: 600px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }
        .coin-object {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 9999px;
        }
        .coin-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 3px rgba(255,255,255,0.35),
                        inset 0 0 10px rgba(0,0,0,0.45),
                        0 4px 14px var(--theme-glow);
            overflow: hidden;
        }
        .coin-shine {
            position: absolute;
            inset: -40%;
            background: linear-gradient(135deg, transparent 35%, rgba(255,255,255,0.45) 50%, transparent 65%);
            pointer-events: none;
            transition: transform 0.6s ease;
        }
        .coin-scene:hover .coin-shine {
            transform: translate(25%, 25%);
        }

        /* Generation Box Switcher next to Coin */
        .gen-box-btn {
            min-width: 48px;
            height: 48px;
            background-color: var(--theme-bg);
            border: 2px solid var(--theme-text-accent);
            border-radius: var(--gen-radius);
            clip-path: var(--gen-card-clip);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            animation: orasPulse 4s infinite ease-in-out;
            transition: transform 0.18s ease, border-color 0.2s ease;
            padding: 2px 8px;
        }
        .gen-box-btn:hover {
            transform: scale(1.06);
            border-color: #ffffff;
        }

        /* Toggle Slider for Deck Cards */
        .oras-slider-track {
            width: 44px;
            height: 24px;
            border-radius: 9999px;
            position: relative;
            transition: background-color 0.25s ease, border-color 0.25s ease;
            border: 2px solid var(--theme-border);
            flex-shrink: 0;
        }
        .oras-slider-thumb {
            width: 16px;
            height: 16px;
            border-radius: 9999px;
            background-color: #ffffff;
            position: absolute;
            top: 2px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* ETB Sleeve Visual Effects */
        .etb-sleeve-shimmer {
            background-size: 200% 200%;
            animation: holoShimmer 5s ease infinite;
        }

        /* Responsive Grid Fallback */
        .cards-grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 1rem;
        }
        @media (min-width: 768px) {
            .cards-grid-layout {
                grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
                gap: 1.4rem;
            }
        }
    </style>
</head>

        const LimitlessParser = {
            getCardDetails: (setAbbrev, number) => {
                const setMap = {
                    'EVO': 'xy12', 'DRM': 'sm75', 'SUM': 'sm1', 'BKP': 'xy9', 'FLI': 'sm6',
                    'GRI': 'sm2', 'LOT': 'sm8', 'CES': 'sm7', 'FCO': 'xy10', 'PHF': 'xy4',
                    'SLG': 'sm35', 'STS': 'xy11', 'CIN': 'sm4', 'AOR': 'xy7', 'UPR': 'sm5',
                    'GEN': 'g1', 'PRC': 'xy5', 'FFI': 'xy3', 'XY': 'xy1', 'KSS': 'xy0',
                    'ROS': 'xy6', 'SMP': 'smp', 'HIF': 'sm115', 'BUS': 'sm3', 'BKT': 'xy8',
                    'XYP': 'xyp', 'FLF': 'xy2', 'GEN-RC': 'rc'
                };
                
                let setId = setMap[setAbbrev] || setAbbrev.toLowerCase();
                let formattedNumber = number;
                
                if (setAbbrev === 'SMP') formattedNumber = `SM${number}`;
                if (setAbbrev === 'XYP') formattedNumber = `XY${number}`;
                if (setAbbrev === 'GEN-RC') { setId = 'g1'; formattedNumber = `rc${number}`; }
                
                return {
                    setId,
                    number: formattedNumber,
                    apiId: `${setId}-${formattedNumber}`
                };
            },

            parse: (text) => {
                const lines = text.split('\n');
                const cardsMap = new Map();
                let category = 'Pokémon';
                let idCounter = 0;
                
                for (let line of lines) {
                    line = line.trim();
                    if (!line) continue;
                    
                    if (line.match(/^(Pokémon|Pokemon|Trainer|Energy):/i)) {
                        category = line.split(':')[0].trim().replace(/Pokemon/i, 'Pokémon');
                        continue;
                    }
                    
                    const match = line.match(/^(\d+)\s+(.+?)\s+([A-Z0-9-]{2,6})\s+([0-9a-zA-Z]+)$/);
                    if (match) {
                        const count = parseInt(match[1], 10);
                        const name = match[2];
                        const set = match[3];
                        const number = match[4];
                        const key = `${set}-${number}`;
                        const details = LimitlessParser.getCardDetails(set, number);

                        if (cardsMap.has(key)) {
                            const existing = cardsMap.get(key);
                            existing.count += count;
                        } else {
                            cardsMap.set(key, {
                                id: `card-${set}-${number}-${idCounter++}`,
                                key: key,
                                count: count,
                                name: name,
                                set: set,
                                number: number,
                                category: category,
                                officialSetId: details.setId,
                                apiId: details.apiId,
                                imageUrl: `https://images.pokemontcg.io/${details.setId}/${details.number}.png`,
                                types: [],
                                subtypes: [],
                                prices: null,
                                rating: 0,
                                enriched: false
                            });
                        }
                    }
                }
                return Array.from(cardsMap.values());
            }
        };

        /* Helper to extract readable prices from PokemonTCG API data */
        const extractPricing = (apiCard) => {
            if (!apiCard) return null;
            const variants = [];
            let primaryPrice = null;
            let source = 'TCGPlayer';
            let updatedAt = apiCard.tcgplayer?.updatedAt || apiCard.cardmarket?.updatedAt || null;

            if (apiCard.tcgplayer && apiCard.tcgplayer.prices) {
                const p = apiCard.tcgplayer.prices;
                const labelMap = {
                    normal: 'Normal',
                    holofoil: 'Holofoil',
                    reverseHolofoil: 'Reverse Holo',
                    '1stEditionHolofoil': '1st Ed. Holo',
                    unlimitedHolofoil: 'Unlimited Holo'
                };
                Object.keys(p).forEach(k => {
                    const entry = p[k];
                    if (entry && (entry.market || entry.mid || entry.low)) {
                        const val = entry.market || entry.mid || entry.low;
                        if (primaryPrice === null) primaryPrice = val;
                        variants.push({
                            label: labelMap[k] || k,
                            market: entry.market || null,
                            low: entry.low || null,
                            mid: entry.mid || null,
                            high: entry.high || null
                        });
                    }
                });
            }

            if (variants.length === 0 && apiCard.cardmarket && apiCard.cardmarket.prices) {
                const cm = apiCard.cardmarket.prices;
                source = 'Cardmarket';
                const val = cm.averageSellPrice || cm.trendPrice || cm.lowPrice;
                if (val) {
                    primaryPrice = val;
                    variants.push({
                        label: 'Trend / Avg',
                        market: cm.trendPrice || cm.averageSellPrice,
                        low: cm.lowPrice || null,
                        mid: cm.averageSellPrice || null,
                        high: cm.reverseHoloTrend || null
                    });
                }
            }

            return {
                primary: primaryPrice,
                source,
                updatedAt,
                variants
            };
        };

                        title={`Current Type Theme: ${currentTheme.label} (Click to flip coin!)`}
                    >

                            title={`Generation ${currentGen.gen}: ${currentGen.name} (${currentGen.subtitle}) — Click to cycle Generation!`}
                        >
                            <span className="text-[9px] font-black uppercase tracking-widest leading-none opacity-80" style={{ color: 'var(--theme-text-accent)' }}>
                                GEN
                            </span>
                            <span className="text-lg font-black leading-tight text-white gen-title-font">
                                {currentGen.gen}
                            </span>
                        </div>

                        {/* Metadata & Quick Pickers for Coin & Gen */}
                        <div className="flex flex-col justify-center">
                            <button 
                                onClick={() => { setShowGenMenu(!showGenMenu); setShowQuickMenu(false); }}
                                className="text-[11px] font-black uppercase tracking-wider flex items-center gap-1 text-left hover:underline leading-tight"
                                style={{ color: 'var(--theme-text-accent)' }}
                                title="Choose Generation GUI Theme (1-9)"
                            >
                                <span>{currentGen.code}</span>
                                <span className="text-[9px] opacity-80">▾</span>
                            </button>
                            <button 
                                onClick={() => { setShowQuickMenu(!showQuickMenu); setShowGenMenu(false); }}
                                className="text-xs font-extrabold flex items-center gap-1 text-left text-slate-200 hover:text-white leading-tight mt-0.5"
                                title="Choose Elemental Type Theme"
                            >
                                <span>{currentTheme.label}</span>
                                <span className="text-[9px] opacity-70">▾</span>
                            </button>
                        </div>
                    </div>

                    {/* Type Coin Quick Picker Popover */}
                    {showQuickMenu && (
                        <div className="absolute top-14 left-0 z-50 oras-modal-panel p-2.5 w-48 grid grid-cols-2 gap-1.5 animate-fade-in">
                            <div className="col-span-2 text-[10px] font-black uppercase tracking-wider text-slate-400 px-1 pb-1 border-b border-slate-700">
                                Select Type Coin
                            </div>
                            {TYPE_THEMES.map((t, idx) => (
                                <button
                                    key={t.id}
                                    onClick={() => {
                                        setFlipDeg(prev => prev + 360);
                                        onSelectTheme(idx);
                                        setShowQuickMenu(false);
                                    }}
                                    className={`flex items-center gap-1.5 px-2 py-1.5 rounded-lg text-xs font-bold transition ${idx === themeIndex ? 'theme-btn-primary' : 'text-slate-300 hover:bg-slate-700'}`}
                                >
                                    <span className="w-3.5 h-3.5 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: t.coinGrad }}></span>
                                    <span className="truncate">{t.label}</span>
                                </button>
                            ))}
                        </div>
                    )}

                    {/* Generation 1-9 Quick Picker Popover */}
                    {showGenMenu && (
                        <div className="absolute top-14 left-10 z-50 oras-modal-panel p-3 w-64 flex flex-col gap-1.5 animate-fade-in">
                            <div className="text-[10px] font-black uppercase tracking-wider text-slate-400 px-1 pb-1 border-b border-slate-700 flex justify-between">
                                <span>Select Generation UI</span>
                                <span style={{ color: 'var(--theme-text-accent)' }}>Gen {currentGen.gen}</span>
                            </div>
                            <div className="grid grid-cols-3 gap-1.5 pt-1">
                                {GEN_THEMES.map(g => (
                                    <button
                                        key={g.gen}
                                        onClick={() => {
                                            onSelectGen(g.gen);
                                            setShowGenMenu(false);
                                        }}
                                        className={`flex flex-col items-center justify-center p-2 rounded-lg border text-center transition ${
                                            g.gen === genNumber
                                                ? 'theme-btn-primary border-white'
                                                : 'oras-subpanel text-slate-300 hover:bg-slate-700'
                                        }`}
                                    >
                                        <span className="text-sm font-black leading-none">{g.gen}</span>
                                        <span className="text-[10px] font-bold opacity-85 mt-1">{g.code}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="text-[11px] text-center font-bold pt-1 text-slate-300">
                                {currentGen.name}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CardModal = ({ card, decks, activeDeckId, onClose, onUpdateCard, onMoveToDeck, onRemoveFromDeck }) => {
            const [loadingPrice, setLoadingPrice] = useState(false);
            const [targetDeckId, setTargetDeckId] = useState(activeDeckId || (decks[0]?.id || ''));
            const [moveQty, setMoveQty] = useState(1);

            useEffect(() => {
                if (activeDeckId) setTargetDeckId(activeDeckId);
                else if (decks.length > 0 && !targetDeckId) setTargetDeckId(decks[0].id);
            }, [activeDeckId, decks]);

            useEffect(() => {
                setMoveQty(1);
            }, [card?.id]);

            // Fetch live pricing on demand when Full View opens if not already loaded
            useEffect(() => {
                let isMounted = true;
                if (card && !card.prices && card.apiId) {
                    setLoadingPrice(true);
                    fetch(`https://api.pokemontcg.io/v2/cards/${card.apiId}`)
                        .then(res => res.ok ? res.json() : null)
                        .then(json => {
                            if (isMounted && json && json.data) {
                                const extracted = extractPricing(json.data);
                                onUpdateCard({
                                    ...card,
                                    prices: extracted || { primary: null, variants: [] },
                                    types: json.data.types || card.types,
                                    subtypes: json.data.subtypes || card.subtypes,
                                    hp: json.data.hp || card.hp,
                                    attacks: json.data.attacks || card.attacks,
                                    abilities: json.data.abilities || card.abilities,
                                    rules: json.data.rules || card.rules,
                                    enriched: true
                                });
                            }
                        })
                        .catch(() => {})
                        .finally(() => {
                            if (isMounted) setLoadingPrice(false);
                        });
                }
                return () => { isMounted = false; };
            }, [card?.id]);

            if (!card) return null;

            const cardKey = `${card.set}-${card.number}`;
            const decksContainingCard = decks.map(d => {
                const found = d.cards.find(c => `${c.set}-${c.number}` === cardKey);
                return found ? { deck: d, count: found.count } : null;
            }).filter(Boolean);

            const totalInDecks = decksContainingCard.reduce((acc, item) => acc + item.count, 0);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-slate-950/90 backdrop-blur-md animate-fade-in" onClick={onClose}>
                    <div 
                        className="oras-modal-panel w-full max-w-5xl max-h-[92vh] overflow-hidden flex flex-col md:flex-row relative" 
                        onClick={e => e.stopPropagation()}
                    >
                        <button onClick={onClose} className="absolute top-4 right-4 z-20 bg-slate-900 hover:bg-slate-700 text-white p-2.5 rounded-full transition-colors border border-slate-600 shadow-lg">
                            <Icons.X />
                        </button>

                        {/* Left Card Artwork Preview */}
                        <div className="w-full md:w-5/12 p-6 flex flex-col items-center justify-center oras-subpanel border-b md:border-b-0 md:border-r border-slate-700">
                            <LazyImage src={card.imageUrl} alt={card.name} className="w-full max-w-xs card-aspect-ratio rounded-2xl shadow-2xl" />
                            <div className="mt-3 text-xs text-slate-300 font-bold tracking-wide">
                                Full View • {card.set} #{card.number}
                            </div>
                        </div>

                        {/* Right Details, Price & Deck Transfer Controls */}
                        <div className="w-full md:w-7/12 p-5 md:p-8 overflow-y-auto flex flex-col gap-5">
                            <div>
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="text-xs font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30">
                                        {card.category}
                                    </span>
                                    {card.subtypes && card.subtypes.map(st => (
                                        <span key={st} className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-slate-700 text-slate-300">
                                            {st}
                                        </span>
                                    ))}
                                </div>
                                <h2 className="text-2xl sm:text-3xl font-extrabold text-white mt-1 gen-title-font">{card.name}</h2>

                                {/* 5-Pokéball Rating */}
                                <div className="flex items-center gap-2 mt-3">
                                    {[1, 2, 3, 4, 5].map(star => (
                                        <button
                                            key={star}
                                            onClick={() => onUpdateCard && onUpdateCard({...card, rating: card.rating === star ? 0 : star})}
                                            className="transition-transform transform hover:scale-110 focus:outline-none"
                                            title={`Rate ${star} Pokéball(s) (Searchable via *${star}*)`}
                                        >
                                            <Icons.Pokeball 
                                                className={`w-7 h-7 ${star <= (card.rating || 0) ? 'text-red-500 fill-red-500 drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]' : 'text-slate-500 hover:text-red-400/50'}`} 
                                            />
                                        </button>
                                    ))}
                                    {card.rating > 0 && (
                                        <button 
                                            onClick={() => onUpdateCard({...card, rating: 0})}
                                            className="text-xs text-slate-300 hover:text-white ml-2 underline"
                                        >
                                            Reset (*0*)
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Live Market Price Section */}
                            <div className="oras-subpanel p-4">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
                                        <Icons.Dollar /> Market Pricing {card.prices?.source ? `(${card.prices.source})` : ''}
                                    </span>
                                    {card.prices?.updatedAt && (
                                        <span className="text-[11px] text-slate-400">Updated {card.prices.updatedAt}</span>
                                    )}
                                </div>
                            </div>

                            {/* Live Market Price Section */}
                            <div className="bg-slate-900/90 rounded-2xl p-4 border border-slate-700">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
                                        <Icons.Dollar /> Market Pricing {card.prices?.source ? `(${card.prices.source})` : ''}
                                    </span>
                                    {card.prices?.updatedAt && (
                                        <span className="text-[11px] text-slate-500">Updated {card.prices.updatedAt}</span>
                                    )}
                                </div>

                                {loadingPrice ? (
                                    <div className="flex items-center gap-2 py-2 text-slate-400 text-sm">
                                        <div className="w-4 h-4 border-2 border-emerald-400/30 border-t-emerald-400 rounded-full animate-spin"></div>
                                        <span>Fetching live market prices...</span>
                                    </div>
                                ) : card.prices && card.prices.variants && card.prices.variants.length > 0 ? (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-2">
                                        {card.prices.variants.map((v, i) => (
                                            <div key={i} className="bg-slate-800/90 border border-slate-700/80 rounded-xl p-3 flex justify-between items-center">
                                                <div>
                                                    <div className="text-xs font-bold text-slate-300">{v.label}</div>
                                                    <div className="text-[11px] text-slate-400 mt-0.5">
                                                        {v.low ? `Low: $${v.low.toFixed(2)}` : ''} {v.high ? `• High: $${v.high.toFixed(2)}` : ''}
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-lg font-black text-emerald-400">
                                                        ${(v.market || v.mid || v.low || 0).toFixed(2)}
                                                    </span>
                                                    <div className="text-[10px] uppercase text-slate-400">Market</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-sm text-slate-400 py-1">
                                        No market price recorded for this printing ({card.set} #{card.number}).
                                    </div>
                                )}
                            </div>

                            {/* Database & Deck Inventory Status */}
                            <div className="grid grid-cols-3 gap-3 oras-subpanel p-4 text-center">
                                <div>
                                    <div className="text-xs text-slate-400">Set & Number</div>
                                    <div className="font-bold text-white mt-1">{card.set} #{card.number}</div>
                                </div>
                                <div className="border-x border-slate-700">
                                    <div className="text-xs text-slate-400">Available in DB</div>
                                    <div className={`font-black text-xl mt-0.5 ${card.count > 0 ? 'text-emerald-400' : 'text-amber-400'}`}>
                                        {card.count}x
                                    </div>
                                </div>
                                <div>
                                    <div className="text-xs text-slate-400">Moved to Decks</div>
                                    <div className="font-black text-xl text-blue-400 mt-0.5">{totalInDecks}x</div>
                                </div>
                            </div>

                            {/* Move Between Database and Decks */}
                            <div className="oras-subpanel p-4 flex flex-col gap-3">
                                <div className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                                    <Icons.Deck /> Deck Assignment (Moves from Database)
                                </div>

                                {decks.length === 0 ? (
                                    <p className="text-xs text-slate-400">
                                        No decks created yet. Open the <strong>Deck Window</strong> on the right to create a deck!
                                    </p>
                                ) : (
                                    <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5">
                                        <select
                                            value={targetDeckId}
                                            onChange={e => setTargetDeckId(e.target.value)}
                                            className="flex-grow bg-slate-800 border border-slate-600 rounded-xl px-3 py-2.5 text-sm font-semibold text-white focus:outline-none"
                                        >
                                            {decks.map(d => (
                                                <option key={d.id} value={d.id}>
                                                    {d.name} ({d.cards.reduce((a, c) => a + c.count, 0)} cards)
                                                </option>
                                            ))}
                                        </select>

                                        <div className="flex items-center gap-2">
                                            <input
                                                type="number"
                                                min="1"
                                                max={Math.max(1, card.count)}
                                                value={moveQty}
                                                onChange={e => setMoveQty(Math.max(1, Math.min(card.count || 1, parseInt(e.target.value, 10) || 1)))}
                                                disabled={card.count === 0}
                                                className="w-16 bg-slate-800 border border-slate-600 rounded-xl px-2.5 py-2 text-center font-bold text-white"
                                            />
                                            <button
                                                disabled={card.count <= 0 || !targetDeckId}
                                                onClick={() => onMoveToDeck(card, targetDeckId, moveQty)}
                                                className={`px-4 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-1.5 ${card.count > 0 ? 'theme-btn-primary' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}`}
                                            >
                                                <Icons.Plus /> Move to Deck
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Copies currently in decks */}
                                {decksContainingCard.length > 0 && (
                                    <div className="pt-2 border-t border-slate-800 space-y-2">
                                        <div className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">
                                            Currently Assigned To:
                                        </div>
                                        {decksContainingCard.map(({ deck, count }) => (
                                            <div key={deck.id} className="flex items-center justify-between bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700">
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-sm text-white">{deck.name}</span>
                                                    <span className="text-xs px-2 py-0.5 bg-blue-500/20 text-blue-300 rounded-full font-bold">{count}x in deck</span>
                                                </div>
                                                <div className="flex items-center gap-1.5">
                                                    <button
                                                        onClick={() => onRemoveFromDeck(cardKey, deck.id, 1)}
                                                        className="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-lg text-slate-200 transition"
                                                        title="Return 1 copy to Database"
                                                    >
                                                        -1 to DB
                                                    </button>
                                                    <button
                                                        onClick={() => onRemoveFromDeck(cardKey, deck.id, count)}
                                                        className="px-2.5 py-1 bg-red-900/50 hover:bg-red-800/70 text-xs font-bold rounded-lg text-red-200 transition"
                                                        title="Return all copies to Database"
                                                    >
                                                        Return All
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ImportModal = ({ onClose, onImport }) => {
            const [text, setText] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            
            const handleSave = () => {
                const parsed = LimitlessParser.parse(text);
                if (parsed.length > 0) {
                    onImport(parsed);
                } else {
                    setErrorMsg("No valid cards found. Ensure each line matches the Limitless format (e.g. '4 Pikachu EVO 35').");
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md animate-fade-in">
                    <div className="oras-modal-panel w-full max-w-2xl overflow-hidden relative flex flex-col h-[80vh]">
                        <div className="p-6 border-b border-slate-700 flex justify-between items-center">
                            <h3 className="text-xl font-bold gen-title-font">Import Limitless Text List</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white"><Icons.X /></button>
                        </div>
                        <div className="flex-grow p-6 flex flex-col">
                            <p className="text-slate-300 mb-3 text-sm">Paste a Limitless TCG formatted list below to populate your database.</p>
                            {errorMsg && (
                                <div className="mb-3 p-3 rounded-xl bg-red-900 border border-red-700 text-red-200 text-xs font-semibold">
                                    {errorMsg}
                                </div>
                            )}
                            <textarea 
                                value={text}
                                onChange={e => { setText(e.target.value); setErrorMsg(''); }}
                                className="flex-grow oras-subpanel p-4 text-white focus:outline-none font-mono text-sm resize-none"
                                placeholder={"4 Pikachu EVO 35\n2 Tapu Lele-GX GRI 60\n4 Cynthia UPR 119"}
                            ></textarea>
                        </div>
                        <div className="p-6 border-t border-slate-700 flex justify-end gap-4">
                            <button onClick={onClose} className="px-6 py-3 rounded-xl font-bold text-slate-300 hover:bg-slate-700 transition">Cancel</button>
                            <button onClick={handleSave} className="px-6 py-3 rounded-xl font-bold theme-btn-primary">Save & Import</button>
                        </div>
                    </div>
                </div>
            );
        };

        const DeckWindow = ({
            isOpen,
            onToggle,
            decks,
            activeDeckId,
            onSelectDeck,
            onCreateDeck,
            onUpdateDeckMeta,
            onDeleteDeck,
            onMoveOneToDeck,
            onRemoveFromDeck,
            onOpenCardFullView
        }) => {
            const [isCreating, setIsCreating] = useState(false);
            const [editingDeckId, setEditingDeckId] = useState(null);
            const [nameInput, setNameInput] = useState('');
            const [typeInput, setTypeInput] = useState('Colorless');
            const [sleeveInput, setSleeveInput] = useState(ETB_SLEEVES[0].id);
            const [copiedId, setCopiedId] = useState(null);

            const activeDeck = decks.find(d => d.id === activeDeckId) || null;

            const startCreate = () => {
                setNameInput(`New Deck #${decks.length + 1}`);
                setTypeInput('Colorless');
                setSleeveInput(ETB_SLEEVES[0].id);
                setEditingDeckId(null);
                setIsCreating(true);
            };

            const startEdit = (deck) => {
                setNameInput(deck.name);
                setTypeInput(deck.type || 'Colorless');
                setSleeveInput(deck.sleeveId || ETB_SLEEVES[0].id);
                setEditingDeckId(deck.id);
                setIsCreating(true);
            };

            const handleSaveDeckForm = () => {
                if (!nameInput.trim()) return;
                if (editingDeckId) {
                    onUpdateDeckMeta(editingDeckId, {
                        name: nameInput.trim(),
                        type: typeInput,
                        sleeveId: sleeveInput
                    });
                } else {
                    onCreateDeck({
                        name: nameInput.trim(),
                        type: typeInput,
                        sleeveId: sleeveInput
                    });
                }
                setIsCreating(false);
                setEditingDeckId(null);
            };

            const handleCopyDecklist = (deck) => {
                const lines = deck.cards.map(c => `${c.count} ${c.name} ${c.set} ${c.number}`).join('\n');
                const textArea = document.createElement('textarea');
                textArea.value = lines;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                setCopiedId(deck.id);
                setTimeout(() => setCopiedId(null), 2000);
            };

            return (
                <>
                    {/* Floating Tab on Right Edge when collapsed */}
                    {!isOpen && (
                        <button
                            onClick={onToggle}
                            style={{ backgroundColor: 'var(--theme-panel-solid)', borderColor: 'var(--theme-border)' }}
                            className="fixed right-0 top-1/2 -translate-y-1/2 z-30 border-l-2 border-y-2 rounded-l-2xl py-4 px-2.5 shadow-2xl flex flex-col items-center gap-2 transition-all group"
                            title="Open Deck Window"
                        >
                            <Icons.ChevronLeft />
                            <Icons.Deck />
                            <span className="text-[10px] font-extrabold uppercase tracking-widest text-slate-200" style={{ writingMode: 'vertical-rl' }}>
                                Decks ({decks.length})
                            </span>
                        </button>
                    )}

                    {/* Mobile Dark Backdrop Overlay so Deck Window is never confusing or transparent on phones */}
                    {isOpen && (
                        <div 
                            onClick={onToggle}
                            style={{ backgroundColor: 'rgba(2, 6, 23, 0.78)' }}
                            className="fixed inset-0 z-40 md:hidden animate-fade-in"
                        />
                    )}

                    {/* Collapsible Opaque Sidebar Panel */}
                    {isOpen && (
                        <aside
                            style={{
                                width: 'min(92vw, 384px)',
                                zIndex: 50
                            }}
                            className="fixed md:static top-0 right-0 h-full oras-deck-drawer flex flex-col flex-shrink-0 animate-fade-in"
                        >
                            {/* Deck Window Header */}
                            <div className="p-4 border-b border-slate-700 flex items-center justify-between" style={{ backgroundColor: 'var(--theme-bg)' }}>
                                <div className="flex items-center gap-2.5">
                                    <Icons.Deck />
                                    <div>
                                        <h2 className="font-extrabold text-white text-sm sm:text-base leading-tight gen-title-font">Deck Window</h2>
                                        <p className="text-[11px] text-slate-300">Cards added move off the main DB</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-1.5">
                                    <button
                                        onClick={startCreate}
                                        className="px-3 py-1.5 rounded-xl text-xs font-bold theme-btn-primary flex items-center gap-1"
                                    >
                                        <Icons.Plus /> New Deck
                                    </button>
                                    <button
                                        onClick={onToggle}

                            {/* Deck Selector List & Active Deck Contents */}
                            <div className="flex-grow overflow-y-auto p-4 space-y-4" style={{ WebkitOverflowScrolling: 'touch' }}>
                                {decks.length === 0 ? (

                                            {decks.map(deck => {

                                                            return (

                                                                    <div

                                                                        }}
                                                                    >

                                                                            src={c.imageUrl}

                                                                        />
                                                                    </div>

                                                                    <div
                                                                        onClick={() => onOpenCardFullView(c)}
                                                                        className="flex-grow min-w-0 cursor-pointer"
                                                                    >
                                                                        <div className="text-xs font-bold text-white truncate">{c.name}</div>
                                                                        <div className="text-[11px] text-slate-300">{c.set} #{c.number}</div>
                                                                    </div>

                                                                    {/* Quantity & Move Controls */}
                                                                    <div className="flex items-center gap-1 flex-shrink-0">
                                                                        <button
                                                                            onClick={() => onRemoveFromDeck(cardKey, activeDeck.id, 1)}
                                                                            className="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-white border border-slate-500"
                                                                            title="Return 1 to Database"
                                                                        >
                                                                            <Icons.Minus />
                                                                        </button>
                                                                        <span className="w-6 text-center text-xs font-black text-white">
                                                                            {c.count}x
                                                                        </span>
                                                                        <button
                                                                            onClick={() => onMoveOneToDeck(c, activeDeck.id)}
                                                                            className="w-7 h-7 rounded-lg theme-btn-primary flex items-center justify-center text-white"
                                                                            title="Move 1 more from Database"
                                                                        >
