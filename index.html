<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deckbuilder Pokedex</title>
    <!-- Tailwind CSS Play CDN + Static Fallback -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (Production UMD) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Press+Start+2P&family=VT323&display=swap');

        :root {
            --theme-bg: #061021;
            --theme-bg-secondary: #0c1f3d;
            --theme-panel-solid: #10264a;
            --theme-panel: rgba(16, 38, 74, 0.96);
            --theme-subpanel: #08152b;
            --theme-border: #e11d48;
            --theme-border-secondary: #00b4d8;
            --theme-accent: #e11d48;
            --theme-accent-hover: #be123c;
            --theme-glow: rgba(225, 29, 72, 0.5);
            --theme-text-accent: #38bdf8;
            --theme-header-grad: linear-gradient(90deg, #2a0815 0%, #0d1f3d 50%, #06283d 100%);
            --theme-banner-grad: linear-gradient(90deg, rgba(159, 18, 57, 0.92) 0%, rgba(15, 23, 42, 0.96) 50%, rgba(3, 105, 161, 0.92) 100%);
            --theme-gradient: radial-gradient(circle at 10% 15%, rgba(225, 29, 72, 0.32), transparent 48%),
                              radial-gradient(circle at 90% 85%, rgba(0, 180, 216, 0.34), transparent 52%);
            --gen-radius: 10px;
            --gen-card-clip: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            --gen-font-display: 'Orbitron', 'Inter', sans-serif;
            --gen-font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            --gen-card-shadow: 0 6px 18px rgba(0, 0, 0, 0.55), inset 0 0 12px var(--theme-glow);
        }

        * {
            box-sizing: border-box;
        }

        .pixel-sprite {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .hidden { display: none !important; }
        button {
            background: transparent;
            color: inherit;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        input, textarea, select {
            font-family: inherit;
            color: #f8fafc;
            background-color: var(--theme-subpanel);
        }
        img {
            max-width: 100%;
            display: block;
        }

        /* Global Type & Gen Theme Binding Across All Surfaces */
        .bg-slate-950, .bg-slate-950\/90, .bg-slate-950\/95 { background-color: var(--theme-bg) !important; }
        .bg-slate-900, .bg-slate-900\/95, .bg-slate-900\/90, .bg-slate-900\/80, .bg-slate-900\/70, .bg-slate-900\/60 { background-color: var(--theme-subpanel) !important; }
        .bg-slate-800, .bg-slate-800\/95, .bg-slate-800\/90, .bg-slate-800\/80, .bg-slate-800\/70, .bg-slate-800\/50 { background-color: var(--theme-panel-solid) !important; }
        .bg-slate-700, .bg-slate-700\/80 { background-color: var(--theme-bg-secondary) !important; }
        .border-slate-800, .border-slate-800\/80, .border-slate-700, .border-slate-700\/80, .border-slate-700\/70, .border-slate-700\/50, .border-slate-600 { border-color: var(--theme-border) !important; }
        .text-slate-200 { color: #e2e8f0 !important; }
        .text-slate-300 { color: #cbd5e1 !important; }
        .text-slate-400 { color: #94a3b8 !important; }
        .text-slate-500 { color: #64748b !important; }

        .card-aspect-ratio {
            position: relative;
            width: 100%;
            aspect-ratio: 63 / 88;
        }
        @supports not (aspect-ratio: 63 / 88) {
            .card-aspect-ratio {
                padding-top: 139.68%;
                height: 0;
            }
            .card-aspect-ratio > img, .card-aspect-ratio > div {
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
            }
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--gen-font-body);
            background-color: var(--theme-bg);
            background-image: var(--theme-gradient);
            background-attachment: fixed;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            transition: background-color 0.25s ease;
        }

        /* GEN 1: Kanto Red Pokédex + Classic Game Boy Dot-Matrix LCD */
        body.gen-1 {
            --gen-radius: 0px;
            --gen-card-clip: none;
            --gen-font-display: 'Press Start 2P', monospace;
            --gen-border-style: double;
            --gen-border-width: 4px;
            --gen-card-shadow: 4px 4px 0px #000000;
            background-image:
                radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 0),
                var(--theme-gradient);
            background-size: 10px 10px, 100% 100%;
        }
        body.gen-1 .theme-header {
            border-bottom: 5px double #f8fafc !important;
            box-shadow: 0 5px 0 #000000 !important;
        }
        body.gen-1 .oras-subpanel, body.gen-1 .theme-card {
            box-shadow: 4px 4px 0px #000000 !important;
        }

        /* GEN 2: Johto Pokégear Gold & Silver GBC OS */
        body.gen-2 {
            --gen-radius: 4px;
            --gen-card-clip: none;
            --gen-font-display: 'Press Start 2P', monospace;
            --gen-border-style: ridge;
            --gen-border-width: 3px;
            --gen-card-shadow: 0 0 0 2px #0f172a, 4px 4px 0px var(--theme-glow);
            background-image:
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 2px, transparent 2px, transparent 6px),
                var(--theme-gradient);
        }
        body.gen-2 .theme-header {
            border-bottom: 4px ridge var(--theme-border) !important;
        }

        /* GEN 3: Hoenn GBA PokéNav / Emerald Battle Frontier */
        body.gen-3 {
            --gen-radius: 6px;
            --gen-card-clip: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 3px;
            --gen-card-shadow: 0 5px 0 rgba(0, 0, 0, 0.7), inset 0 0 0 1px var(--theme-glow);
            background-image:
                repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0px, rgba(255, 255, 255, 0.04) 2px, transparent 2px, transparent 5px),
                var(--theme-gradient);
        }

        /* GEN 4: Sinnoh DS Pokétch Dual-Screen LCD Watch */
        body.gen-4 {
            --gen-radius: 10px;
            --gen-card-clip: none;
            --gen-font-display: 'VT323', 'Orbitron', monospace;
            --gen-border-style: outset;
            --gen-border-width: 3px;
            --gen-card-shadow: inset 0 0 0 2px var(--theme-glow), 0 6px 14px rgba(0,0,0,0.65);
            background-image:
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                var(--theme-gradient);
            background-size: 16px 16px, 16px 16px, 100% 100%;
        }

        /* GEN 5: Unova C-Gear High-Contrast Black & White Geometric OS */
        body.gen-5 {
            --gen-radius: 2px;
            --gen-card-clip: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            --gen-card-shadow: 4px 4px 0px var(--theme-text-accent);
            background-image:
                repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 14px, transparent 14px, transparent 28px),
                var(--theme-gradient);
        }

        /* DEFAULT GEN 6: Omega Ruby / Alpha Sapphire PokéNav Plus & DexNav */
        body.gen-6 {
            --gen-radius: 10px;
            --gen-card-clip: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            --gen-card-shadow: 0 8px 22px rgba(0, 0, 0, 0.65), inset 0 0 15px var(--theme-glow);
            background-image:
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 4px),
                var(--theme-gradient);
        }

        /* GEN 7: Alola Rotom Dex (Rotom Orange + Turquoise Bubble Screen) */
        body.gen-7 {
            --gen-radius: 20px;
            --gen-card-clip: none;
            --gen-font-display: 'Orbitron', 'Inter', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 3px;
            --gen-card-shadow: 0 8px 20px var(--theme-glow), inset 0 0 14px var(--theme-glow);
            background-image:
                radial-gradient(circle at 50% 0%, var(--theme-glow), transparent 60%),
                var(--theme-gradient);
        }

        /* GEN 8: Galar Sword & Shield Stadium Broadcast (Skewed Slashes) */
        body.gen-8 {
            --gen-radius: 4px;
            --gen-card-clip: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            --gen-card-shadow: -3px 3px 0px var(--theme-text-accent), 3px -3px 0px var(--theme-accent);
            background-image:
                repeating-linear-gradient(-35deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 12px, transparent 12px, transparent 24px),
                var(--theme-gradient);
        }

        /* GEN 9: Paldea Scarlet & Violet Terastal Crystal OS */
        body.gen-9 {
            --gen-radius: 14px;
            --gen-card-clip: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
            --gen-font-display: 'Orbitron', sans-serif;
            --gen-border-style: solid;
            --gen-border-width: 2px;
            --gen-card-shadow: 0 8px 25px var(--theme-glow), inset 0 0 12px var(--theme-glow);
            background-image:
                conic-gradient(from 45deg at 50% 0%, var(--theme-glow), transparent 45%, var(--theme-glow)),
                var(--theme-gradient);
        }

        /* SECRET WII THEME: Nintendo Wii Channel Menu (2006) */
        body.wii-mode {
            --theme-bg: #e6eaef !important;
            --theme-bg-secondary: #d4dce6 !important;
            --theme-panel-solid: #ffffff !important;
            --theme-panel: rgba(255, 255, 255, 0.96) !important;
            --theme-subpanel: #f1f5f9 !important;
            --theme-border: #34beed !important;
            --theme-accent: #34beed !important;
            --theme-accent-hover: #009bd6 !important;
            --theme-glow: rgba(52, 190, 237, 0.55) !important;
            --theme-text-accent: #0284c7 !important;
            --theme-header-grad: linear-gradient(180deg, #ffffff 0%, #e4ebf2 85%, #cfd9e5 100%) !important;
            --theme-banner-grad: linear-gradient(90deg, #d8e2ed 0%, #f1f5f9 50%, #d8e2ed 100%) !important;
            --gen-radius: 22px !important;
            --gen-card-clip: none !important;
            --gen-font-display: 'Inter', -apple-system, sans-serif !important;
            --gen-border-style: solid !important;
            --gen-border-width: 3px !important;
            --gen-card-shadow: 0 6px 14px rgba(15, 23, 42, 0.12), inset 0 2px 0 #ffffff !important;
            color: #334155 !important;
            background-color: #e6eaef !important;
            background-image:
                repeating-linear-gradient(0deg, rgba(148, 163, 184, 0.14) 0px, rgba(148, 163, 184, 0.14) 2px, transparent 2px, transparent 8px),
                radial-gradient(circle at 50% 20%, rgba(52, 190, 237, 0.2), transparent 65%) !important;
        }
        body.wii-mode .text-white { color: #1e293b !important; }
        body.wii-mode .text-slate-200,
        body.wii-mode .text-slate-300 { color: #334155 !important; }
        body.wii-mode .text-slate-400 { color: #64748b !important; }
        body.wii-mode .theme-card {
            background-image: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%) !important;
            border: 3px solid #cbd5e1 !important;
        }
        body.wii-mode .theme-card:hover {
            border-color: #34beed !important;
            box-shadow: 0 0 18px rgba(52, 190, 237, 0.7), inset 0 0 8px rgba(52, 190, 237, 0.25) !important;
            transform: scale(1.025);
        }
        body.wii-mode .oras-subpanel {
            background-color: #ffffff !important;
            border: 2px solid #cbd5e1 !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06), inset 0 1px 0 #ffffff !important;
        }
        body.wii-mode .theme-btn-primary,
        body.wii-mode .theme-pill-active {
            background: linear-gradient(180deg, #5fd0f7 0%, #24b0e3 100%) !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 12px rgba(52, 190, 237, 0.65) !important;
        }
        body.wii-mode input, body.wii-mode textarea, body.wii-mode select {
            color: #1e293b !important;
            background-color: #ffffff !important;
            border-color: #94a3b8 !important;
        }

        .gen-title-font {
            font-family: var(--gen-font-display);
            letter-spacing: 0.03em;
        }
        body.gen-1 .gen-title-font, body.gen-2 .gen-title-font {
            font-size: 0.8rem;
            line-height: 1.35;
        }
        body.gen-4 .gen-title-font {
            font-size: 1.25rem;
            letter-spacing: 0.06em;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--theme-bg); border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--theme-border); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--theme-accent); }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.24s ease-out forwards; }

        .theme-header {
            background: var(--theme-header-grad) !important;
            border-bottom: var(--gen-border-width) var(--gen-border-style) var(--theme-border) !important;
            box-shadow: 0 6px 24px -4px rgba(0, 0, 0, 0.65), 0 2px 14px var(--theme-glow) !important;
            position: relative;
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .theme-banner {
            background: var(--theme-banner-grad) !important;
            border-bottom: 2px solid var(--theme-border) !important;
        }

        .theme-card {
            background-color: var(--theme-panel-solid);
            background-image: linear-gradient(155deg, rgba(255,255,255,0.07) 0%, var(--theme-subpanel) 95%);
            border: var(--gen-border-width) var(--gen-border-style) var(--theme-border);
            border-radius: var(--gen-radius);
            clip-path: var(--gen-card-clip);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.2s ease;
            box-shadow: var(--gen-card-shadow);
            content-visibility: auto;
            contain-intrinsic-size: 230px;
        }
        .theme-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px -4px var(--theme-glow);
            border-color: var(--theme-text-accent);
            z-index: 10;
        }
        .theme-btn-primary {
            background: linear-gradient(135deg, var(--theme-accent) 0%, var(--theme-accent-hover) 100%);
            color: #ffffff !important;
            border: 1px solid var(--theme-text-accent);
            border-radius: var(--gen-radius);
            clip-path: var(--gen-card-clip);
            box-shadow: 0 4px 12px -2px var(--theme-glow);
            transition: all 0.18s ease;
        }
        .theme-btn-primary:hover {
            filter: brightness(1.12);
            transform: translateY(-1px);
        }
        .theme-pill-active {
            background: linear-gradient(135deg, var(--theme-accent) 0%, var(--theme-accent-hover) 100%) !important;
            border-color: var(--theme-text-accent) !important;
            color: #ffffff !important;
            box-shadow: 0 0 12px var(--theme-glow);
        }

        .oras-deck-drawer {
            background-color: var(--theme-panel-solid) !important;
            background-image: linear-gradient(180deg, var(--theme-bg-secondary) 0%, var(--theme-bg) 100%) !important;
            border-left: var(--gen-border-width) var(--gen-border-style) var(--theme-border);
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.85);
            color: #f8fafc;
        }
        .oras-modal-panel {
            background-color: var(--theme-panel-solid) !important;
            background-image: linear-gradient(165deg, var(--theme-bg-secondary) 0%, var(--theme-bg) 100%) !important;
            border: var(--gen-border-width) var(--gen-border-style) var(--theme-border);
            border-radius: var(--gen-radius);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px var(--theme-glow);
            color: #f8fafc;
        }
        .oras-subpanel {
            background-color: var(--theme-subpanel) !important;
            background-image: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
            border: 1.5px var(--gen-border-style) var(--theme-border);
            border-radius: var(--gen-radius);
            box-shadow: inset 0 0 10px var(--theme-glow);
        }

        .coin-scene {
            width: 44px;
            height: 44px;
            perspective: 600px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }
        .coin-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 9999px;
        }
        .coin-face {
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            border: 2px solid rgba(255, 255, 255, 0.55);
            box-shadow: inset 0 2px 6px rgba(255,255,255,0.45),
                        inset 0 -3px 6px rgba(0,0,0,0.6),
                        0 0 14px var(--theme-glow);
        }

        .etb-sleeve-badge {
            background-size: 200% 200%;
            animation: holoShimmer 4s ease infinite;
        }
        @keyframes holoShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Mobile-Specific Compact Scaling */
        @media (max-width: 640px) {
            :root {
                --gen-border-width: 1.5px;
            }
            body.gen-6 {
                --gen-card-clip: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
            }
            .coin-scene {
                width: 34px;
                height: 34px;
            }
            .mobile-logo-sprite {
                width: 36px !important;
                height: 36px !important;
                min-width: 36px !important;
                min-height: 36px !important;
            }
            .gen-title-font {
                font-size: 0.85rem !important;
            }
        }
    </style>
</head>

    <script type="text/babel">

        const parseLimitlessText = (rawText) => {
            const lines = rawText.split(/\r?\n/);
            let currentCategory = 'Pokémon';
            const cardMap = new Map();
            const metaCache = loadMetaCache();

            for (let rawLine of lines) {
                const line = rawLine.trim();
                if (!line) continue;

                if (/^Pok[eé]mon/i.test(line)) { currentCategory = 'Pokémon'; continue; }
                if (/^Trainer/i.test(line)) { currentCategory = 'Trainer'; continue; }
                if (/^Energy/i.test(line)) { currentCategory = 'Energy'; continue; }

                const match = line.match(/^(\d+)\s+(.+?)\s+([A-Z0-9-]+)\s+([0-9a-zA-Z]+)$/);
                if (match) {
                    const count = parseInt(match[1], 10);
                    const name = match[2].trim();
                    const setCode = match[3].trim().toUpperCase();
                    let number = match[4].trim();

                    let apiSet = SET_MAP[setCode] || setCode.toLowerCase();
                    let apiNumber = number;

                    if (setCode === 'GEN-RC' && !number.toUpperCase().startsWith('RC')) {
                        apiNumber = `RC${number}`;
                    } else if (setCode === 'SMP' && !number.toUpperCase().startsWith('SM')) {
                        apiNumber = `SM${number}`;
                    } else if (setCode === 'XYP' && !number.toUpperCase().startsWith('XY')) {
                        apiNumber = `XY${number}`;
                    } else if (setCode === 'HIF' && parseInt(number, 10) > 69 && !number.toUpperCase().startsWith('SV')) {
                        apiNumber = `SV${ parseInt(number, 10) - 69 }`;
                    }

                    const uniqueKey = `${setCode}-${number}`;
                    const apiId = `${apiSet}-${apiNumber}`;
                    const imageUrl = `https://images.pokemontcg.io/${apiSet}/${apiNumber}_hires.png`;
                    const smallImageUrl = `https://images.pokemontcg.io/${apiSet}/${apiNumber}.png`;
                    const setIconUrl = `https://images.pokemontcg.io/${apiSet}/symbol.png`;
                    const cached = metaCache[apiId.toLowerCase()];

                    // Instant Heuristic Subtype & Special Type Inference so filters work even before sync completes
                    const inferredSubtypes = cached?.subtypes ? [...cached.subtypes] : [];
                    if (inferredSubtypes.length === 0) {
                        if (/\b-?GX\b/i.test(name)) inferredSubtypes.push('GX');
                        if (/\b-?EX\b/i.test(name)) inferredSubtypes.push('EX');
                        if (/\bBREAK\b/i.test(name)) inferredSubtypes.push('BREAK');
                        if (/\bPrism Star\b|◇/i.test(name)) inferredSubtypes.push('Prism Star');
                        if (/\bVMAX\b/i.test(name)) inferredSubtypes.push('VMAX');
                        else if (/\bVSTAR\b/i.test(name)) inferredSubtypes.push('VSTAR');
                        else if (/(^|[-\s])V([-\s]|$)/.test(name)) inferredSubtypes.push('V');
                        if (currentCategory === 'Trainer') {
                            if (/Spirit Link|Fury Belt|Hard Charm|Talon|Trick Coin|Frying Pan|Baton|Float Stone|Choice Band|Muscle Band|Cape|Bells|Board|Helmet|Goggles/i.test(name)) {
                                inferredSubtypes.push('Pokémon Tool');
                            } else if (/Sea of Nothingness|Reverse Valley|Mt\. Coronet|Scorched Earth|Mountain Ring|Life Forest|Rough Seas|Devoured Field|Shrine|Stadium|Brooklet Hill|Parallel City|Sky Field|Dimension Valley|Silent Lab|Virbank| Altar | Labs/i.test(name)) {
                                inferredSubtypes.push('Stadium');
                            }
                        }
                    }

                    if (cardMap.has(uniqueKey)) {
                        cardMap.get(uniqueKey).count += count;
                    } else {
                        cardMap.set(uniqueKey, {
                            id: uniqueKey,
                            apiId,
                            name,
                            setCode,
                            number,
                            count,
                            category: currentCategory,
                            imageUrl,
                            smallImageUrl,
                            setIconUrl,
                            types: cached?.types || [],
                            subtypes: inferredSubtypes,
                            hp: cached?.hp || '',
                            attacks: cached?.attacks || [],
                            abilities: cached?.abilities || [],
                            rules: cached?.rules || [],
                            prices: cached?.prices || null,
                            rating: 0,
                            enriched: Boolean(cached)
                        });
                    }
                }
            }
            return Array.from(cardMap.values());
        };

        /* Renders Official Pokémon TCG Type / Energy Images with Automatic Fallback */
        const TypeSymbol = ({ type, className = "w-5 h-5" }) => {
            const entry = TYPE_ICON_URLS[type] || TYPE_ICON_URLS.Colorless;
            const [src, setSrc] = useState(entry.primary);

            useEffect(() => {
                const nextEntry = TYPE_ICON_URLS[type] || TYPE_ICON_URLS.Colorless;
                setSrc(nextEntry.primary);
            }, [type]);

            return (
                <img
                    src={src}
                    alt={type}
                     referrerPolicy="no-referrer"
                    onError={() => {
                        if (src !== entry.fallback) setSrc(entry.fallback);
                    }}
                    className={`${className} rounded-full object-contain flex-shrink-0 select-none pointer-events-none`}
                />
            );

            Cart: () => (

                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
            ),
            Upload: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
            ),
            Download: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
            ),
            Trash: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            ),
            Deck: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                </svg>
            ),
            Close: () => (
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            ),
            Dollar: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            ),
            ChevronUp: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 15l7-7 7 7"/>
                </svg>
            ),
            ChevronDown: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7"/>
                </svg>
            )
        };

        /* Reusable Multi-Parameter Card Filter Function (Shared by Main View & Cart Add Window) */
        const filterCardCollection = ({
            cards,
            deckAllocationMap,
            includeDeckCards = true,
            ignoreZeroCount = true,
            searchTerm = '',
            categoryFilter = 'All',
            typeFilter = 'All',
            specialFilter = 'All',
            trainerFilter = 'All',
            energyFilter = 'All',
            setFilter = 'All'
        }) => {
            const parsedClauses = searchTerm
                .split(',')
                .map(s => s.trim())
                .filter(Boolean)
                .map(clause => {
                    const ratingMatch = clause.match(/^\*([0-5])\*$/);
                    if (ratingMatch) {
                        return { type: 'rating', val: parseInt(ratingMatch[1], 10) };
                    }
                    const quoteMatch = clause.match(/^"(.+)"$/);
                    if (quoteMatch) {
                        return { type: 'quote', val: quoteMatch[1].toLowerCase() };
                    }
                    return { type: 'text', val: clause.toLowerCase() };
                });

            const apiTargetType = typeFilter === 'Dark' ? 'darkness' : typeFilter === 'Steel' ? 'metal' : typeFilter.toLowerCase();
            const specialRegex = specialFilter !== 'All' ? new RegExp(`(^|[-\\s])${specialFilter}([-\\s]|$)`, 'i') : null;
            const specialLower = specialFilter.toLowerCase();
            const trainerTarget = trainerFilter.toLowerCase();

            return cards.filter(card => {
                if (!ignoreZeroCount) {
                    const inDecksQty = deckAllocationMap ? (deckAllocationMap.get(card.id) || 0) : 0;
                    const effectiveCount = includeDeckCards ? (card.count + inDecksQty) : card.count;
                    if (effectiveCount <= 0) return false;
                }

                if (categoryFilter !== 'All' && card.category !== categoryFilter) return false;
                if (setFilter !== 'All' && card.setCode !== setFilter) return false;

                if (categoryFilter === 'Pokémon') {
                    if (typeFilter !== 'All') {
                        const hasType = (card.types || []).some(t => t.toLowerCase() === apiTargetType);
                        if (!hasType) return false;
                    }
                    if (specialRegex) {
                        const inName = specialRegex.test(card.name);
                        const inSub = (card.subtypes || []).some(s => s.toLowerCase() === specialLower);
                        if (!inName && !inSub) return false;
                    }
                }

                if (categoryFilter === 'Trainer' && trainerFilter !== 'All') {
                    const hasSub = (card.subtypes || []).some(s => {
                        const clean = s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                        if (trainerTarget === 'tool') return clean.includes('tool');
                        return clean === trainerTarget;
                    });
                    if (!hasSub) return false;
                }

                if (categoryFilter === 'Energy' && energyFilter !== 'All') {
                    const isBasicByName = BASIC_ENERGIES.includes(card.name.toLowerCase().trim());
                    const hasSpecialSub = (card.subtypes || []).some(s => s.toLowerCase().includes('special'));
                    if (energyFilter === 'Basic' && (!isBasicByName || hasSpecialSub)) return false;
                    if (energyFilter === 'Special' && isBasicByName && !hasSpecialSub) return false;
                }

                for (let i = 0; i < parsedClauses.length; i++) {
                    const c = parsedClauses[i];
                    if (c.type === 'rating') {
                        if ((card.rating || 0) !== c.val) return false;
                    } else if (c.type === 'quote') {
                        const needle = c.val;
                        const inHp = (card.hp || '').toLowerCase() === needle || `${card.hp || ''} hp`.toLowerCase().includes(needle);
                        const inAttacks = (card.attacks || []).some(a =>
                            (a.name || '').toLowerCase().includes(needle) ||
                            (a.text || '').toLowerCase().includes(needle) ||
                            (a.damage || '').toLowerCase().includes(needle)
                        );
                        const inAbilities = (card.abilities || []).some(ab =>
                            (ab.name || '').toLowerCase().includes(needle) ||
                            (ab.text || '').toLowerCase().includes(needle)
                        );
                        const inRules = (card.rules || []).some(r => r.toLowerCase().includes(needle));
                        const inName = card.name.toLowerCase().includes(needle);
                        if (!inHp && !inAttacks && !inAbilities && !inRules && !inName) return false;
                    } else {
                        const lowerClause = c.val;
                        const nameMatch = card.name.toLowerCase().includes(lowerClause);
                        const setMatch = card.setCode.toLowerCase() === lowerClause;
                        if (!nameMatch && !setMatch) return false;
                    }
                }

                return true;
            });
        };

        /* Cart-Style Add Cards Modal (Full Search & Filter Parity with Top Bar) */
        const AddCardsCartModal = ({
            isOpen,
            onClose,
            cards,
            availableSets,
            deckAllocationMap,
            initialTarget = 'database',
            activeDeck,
            onConfirmAddToDatabase,
            onConfirmAddToDeck
        }) => {
            const [targetMode, setTargetMode] = useState(initialTarget);
            const [searchInput, setSearchInput] = useState('');
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('All');
            const [typeFilter, setTypeFilter] = useState('All');
            const [specialFilter, setSpecialFilter] = useState('All');
            const [trainerFilter, setTrainerFilter] = useState('All');
            const [energyFilter, setEnergyFilter] = useState('All');
            const [setFilter, setSetFilter] = useState('All');
            const [cart, setCart] = useState({});
            const [visibleLimit, setVisibleLimit] = useState(48);

            // Optional External Set Catalog Loader so users can also browse entire sets to add new cards
            const [catalogSetCode, setCatalogSetCode] = useState('EVO');
            const [externalSetCards, setExternalSetCards] = useState([]);
            const [loadingCatalog, setLoadingCatalog] = useState(false);
            const [catalogSourceMode, setCatalogSourceMode] = useState('local'); // 'local' | 'expansion'

            useEffect(() => {
                setTargetMode(initialTarget);
                setCart({});
            }, [initialTarget, isOpen]);

            useEffect(() => {
                const t = setTimeout(() => setSearchTerm(searchInput), 100);
                return () => clearTimeout(t);
            }, [searchInput]);

            useEffect(() => {
                setVisibleLimit(48);
            }, [searchTerm, categoryFilter, typeFilter, specialFilter, trainerFilter, energyFilter, setFilter, catalogSourceMode]);

            // Load an entire expansion set from CDN when browsing "All Expansion Cards"
            useEffect(() => {
                if (!isOpen || catalogSourceMode !== 'expansion') return;
                let cancelled = false;
                const loadExpansion = async () => {
                    setLoadingCatalog(true);
                    const apiSet = SET_MAP[catalogSetCode] || catalogSetCode.toLowerCase();
                    const urls = [
                        `https://cdn.jsdelivr.net/gh/PokemonTCG/pokemon-tcg-data@master/cards/en/${apiSet}.json`,
                        `https://raw.githubusercontent.com/PokemonTCG/pokemon-tcg-data/master/cards/en/${apiSet}.json`
                    ];
                    let data = null;
                    for (const u of urls) {
                        try {
                            const r = await fetch(u);
                            if (r.ok) {
                                data = await r.json();
                                break;
                            }
                        } catch (e) {}
                    }
                    if (!cancelled && Array.isArray(data)) {
                        const existingById = new Map(cards.map(c => [c.id, c]));
                        const mapped = data.map(item => {
                            const num = item.number || item.id.split('-')[1] || '1';
                            const id = `${catalogSetCode}-${num}`;
                            const existing = existingById.get(id);
                            const cat = item.supertype === 'Trainer' ? 'Trainer' : item.supertype === 'Energy' ? 'Energy' : 'Pokémon';
                            return {
                                id,
                                apiId: item.id,
                                name: item.name,
                                setCode: catalogSetCode,
                                number: String(num),
                                count: existing ? existing.count : 0,
                                category: cat,
                                imageUrl: item.images?.large || `https://images.pokemontcg.io/${apiSet}/${num}_hires.png`,
                                smallImageUrl: item.images?.small || `https://images.pokemontcg.io/${apiSet}/${num}.png`,
                                setIconUrl: `https://images.pokemontcg.io/${apiSet}/symbol.png`,
                                types: item.types || [],
                                subtypes: item.subtypes || [],
                                hp: item.hp || '',
                                attacks: item.attacks || [],
                                abilities: item.abilities || [],
                                rules: item.rules || [],
                                prices: existing?.prices || null,
                                rating: existing?.rating || 0,
                                enriched: true
                            };
                        });
                        setExternalSetCards(mapped);
                    }
                    if (!cancelled) setLoadingCatalog(false);
                };
                loadExpansion();
                return () => { cancelled = true; };
            }, [isOpen, catalogSourceMode, catalogSetCode, cards]);

            const sourcePool = catalogSourceMode === 'expansion' ? externalSetCards : cards;

            const matchingCards = useMemo(() => {
                return filterCardCollection({
                    cards: sourcePool,
                    deckAllocationMap,
                    includeDeckCards: true,
                    ignoreZeroCount: targetMode === 'database',
                    searchTerm,
                    categoryFilter,
                    typeFilter,
                    specialFilter,
                    trainerFilter,
                    energyFilter,
                    setFilter: catalogSourceMode === 'expansion' ? 'All' : setFilter
                });
            }, [sourcePool, deckAllocationMap, targetMode, searchTerm, categoryFilter, typeFilter, specialFilter, trainerFilter, energyFilter, setFilter, catalogSourceMode]);

            const cardLookup = useMemo(() => {
                const map = new Map();
                cards.forEach(c => map.set(c.id, c));
                externalSetCards.forEach(c => {
                    if (!map.has(c.id)) map.set(c.id, c);
                });
                return map;
            }, [cards, externalSetCards]);

            const adjustCartQty = (card, delta) => {
                setCart(prev => {
                    const current = prev[card.id]?.qty || 0;
                    const maxAllowed = targetMode === 'deck' ? Math.max(0, card.count) : 99;
                    const next = Math.min(maxAllowed, Math.max(0, current + delta));
                    const copy = { ...prev };
                    if (next <= 0) {
                        delete copy[card.id];
                    } else {
                        copy[card.id] = { card, qty: next };
                    }
                    return copy;
                });
            };

            const setExactCartQty = (card, val) => {
                const parsed = parseInt(val, 10) || 0;
                const maxAllowed = targetMode === 'deck' ? Math.max(0, card.count) : 99;
                const clamped = Math.min(maxAllowed, Math.max(0, parsed));
                setCart(prev => {
                    const copy = { ...prev };
                    if (clamped <= 0) delete copy[card.id];
                    else copy[card.id] = { card, qty: clamped };
                    return copy;
                });
            };

            const cartEntries = Object.values(cart);
            const totalCartItems = cartEntries.reduce((sum, item) => sum + item.qty, 0);

            const handleConfirm = () => {
                if (totalCartItems <= 0) {
                    onClose();
                    return;
                }
                if (targetMode === 'deck' && activeDeck) {
                    onConfirmAddToDeck(activeDeck.id, cartEntries);
                } else {
                    onConfirmAddToDatabase(cartEntries);
                }
                setCart({});
                onClose();
            };

            if (!isOpen) return null;

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-5 bg-black/85 backdrop-blur-sm animate-fade-in"
                    onClick={onClose}
                >
                    <div
                        className="oras-modal-panel w-full max-w-6xl h-[92vh] flex flex-col overflow-hidden animate-slide-up"
                        onClick={(e) => e.stopPropagation()}
                    >
                        {/* Modal Top Header */}
                        <div className="px-3.5 sm:px-5 py-2.5 sm:py-3 border-b border-slate-700 flex flex-wrap items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5">
                                <div className="p-2 rounded-lg theme-btn-primary">
                                    <Icons.Cart />
                                </div>
                                <div>
                                    <h2 className="text-sm sm:text-lg font-black text-white gen-title-font">
                                        {targetMode === 'deck' && activeDeck
                                            ? `Card Cart // Add to ${activeDeck.name}`
                                            : 'Card Cart // Add Cards to Database'}
                                    </h2>
                                    <p className="text-[10px] sm:text-xs text-slate-300">
                                        Search and filter cards below, pick quantities into your cart, then click Add to confirm.
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                {/* Destination Switcher: Add to Database vs Add to Active Deck */}
                                <div className="flex items-center oras-subpanel p-0.5 text-[11px] font-extrabold">
                                    <button
                                        type="button"
                                        onClick={() => setTargetMode('database')}
                                        className={`px-2.5 py-1 rounded transition-all ${
                                            targetMode === 'database' ? 'theme-pill-active' : 'text-slate-300 hover:text-white'
                                        }`}
                                    >
                                        + To Database
                                    </button>
                                    {activeDeck && (
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setTargetMode('deck');
                                                setCatalogSourceMode('local');
                                            }}
                                            className={`px-2.5 py-1 rounded transition-all ${
                                                targetMode === 'deck' ? 'theme-pill-active' : 'text-slate-300 hover:text-white'
                                            }`}
                                        >
                                            + To Deck ({activeDeck.name})
                                        </button>
                                    )}
                                </div>

                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="p-1.5 rounded-lg oras-subpanel text-slate-300 hover:text-white"
                                >
                                    <Icons.Close />
                                </button>
                            </div>
                        </div>

                        {/* Search & Filter Bar (Identical capabilities to Top Bar) */}
                        <div className="px-3.5 sm:px-5 py-2.5 border-b border-slate-800 space-y-2 bg-slate-950/60">
                            <div className="flex flex-col lg:flex-row items-stretch lg:items-center gap-2">
                                <div className="relative flex-1">
                                    <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400">
                                        <Icons.Search />
                                    </div>
                                    <input
                                        type="text"
                                        value={searchInput}
                                        onChange={(e) => setSearchInput(e.target.value)}
                                        placeholder='Search cards, comma params (Altaria, "80"), or *3* for rating...'
                                        className="w-full pl-9 pr-7 py-1.5 rounded-lg text-xs sm:text-sm font-medium oras-subpanel text-white placeholder-slate-400 focus:outline-none"
                                    />
                                    {searchInput && (
                                        <button
                                            type="button"
                                            onClick={() => { setSearchInput(''); setSearchTerm(''); }}
                                            className="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-white font-bold"
                                        >
                                            ✕
                                        </button>
                                    )}
                                </div>

                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    {/* Category Tabs */}
                                    <div className="flex items-center gap-1 oras-subpanel p-0.5">
                                        {['All', 'Pokémon', 'Trainer', 'Energy'].map(cat => (
                                            <button
                                                key={cat}
                                                type="button"
                                                onClick={() => setCategoryFilter(cat)}
                                                className={`px-2.5 py-1 rounded text-xs font-extrabold transition-all ${
                                                    categoryFilter === cat ? 'theme-pill-active' : 'text-slate-300 hover:text-white'
                                                }`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Source Switcher when adding to Database: Local DB vs Full Expansion Catalog */}
                                    {targetMode === 'database' && (
                                        <div className="flex items-center gap-1.5 oras-subpanel p-0.5 text-[11px] font-bold">
                                            <button
                                                type="button"
                                                onClick={() => setCatalogSourceMode('local')}
                                                className={`px-2 py-1 rounded ${
                                                    catalogSourceMode === 'local' ? 'theme-pill-active' : 'text-slate-300 hover:text-white'
                                                }`}
                                            >
                                                My DB ({cards.length})
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setCatalogSourceMode('expansion')}
                                                className={`px-2 py-1 rounded ${
                                                    catalogSourceMode === 'expansion' ? 'theme-pill-active' : 'text-slate-300 hover:text-white'
                                                }`}
                                            >
                                                Browse Set Catalog
                                            </button>
                                            {catalogSourceMode === 'expansion' && (
                                                <select
                                                    value={catalogSetCode}
                                                    onChange={(e) => setCatalogSetCode(e.target.value)}
                                                    className="px-2 py-0.5 rounded text-xs font-extrabold bg-slate-950 border border-slate-700 text-white"
                                                >
                                                    {Object.keys(SET_MAP).map(code => (
                                                        <option key={code} value={code}>{code}</option>
                                                    ))}
                                                </select>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {categoryFilter === 'Pokémon' && (
                                <div className="flex flex-col gap-1">
                                    <div className="flex items-center gap-1 overflow-x-auto pb-0.5">
                                        <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 mr-1 flex-shrink-0">Type:</span>
                                        {['All', 'Grass', 'Fire', 'Water', 'Lightning', 'Psychic', 'Fighting', 'Dark', 'Steel', 'Fairy', 'Dragon', 'Colorless'].map(t => (
                                            <button
                                                key={t}
                                                type="button"
                                                onClick={() => setTypeFilter(t)}
                                                className={`px-2 py-0.5 rounded text-xs font-bold border transition-all flex items-center gap-1 flex-shrink-0 ${
                                                    typeFilter === t ? 'theme-pill-active' : 'oras-subpanel text-slate-300 hover:text-white'
                                                }`}
                                            >
                                                {t !== 'All' && <TypeSymbol type={t} className="w-3.5 h-3.5" />}
                                                <span>{t}</span>
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex items-center gap-1 overflow-x-auto pb-0.5">
                                        <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 mr-1 flex-shrink-0">Special:</span>
                                        {['All', 'EX', 'GX', 'BREAK', 'V', 'VMAX', 'VSTAR', 'Prism Star'].map(sp => (
                                            <button
                                                key={sp}
                                                type="button"
                                                onClick={() => setSpecialFilter(sp)}
                                                className={`px-2 py-0.5 rounded text-xs font-bold border transition-all flex-shrink-0 ${
                                                    specialFilter === sp ? 'theme-pill-active' : 'oras-subpanel text-slate-300 hover:text-white'
                                                }`}
                                            >
                                                {sp}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {categoryFilter === 'Trainer' && (
                                <div className="flex items-center gap-1 overflow-x-auto pb-0.5">
                                    <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 mr-1 flex-shrink-0">Class:</span>
                                    {['All', 'Item', 'Supporter', 'Tool', 'Stadium'].map(tr => (
                                        <button
                                            key={tr}
                                            type="button"
                                            onClick={() => setTrainerFilter(tr)}
                                            className={`px-2.5 py-0.5 rounded text-xs font-bold border transition-all flex-shrink-0 ${
                                                trainerFilter === tr ? 'theme-pill-active' : 'oras-subpanel text-slate-300 hover:text-white'
                                            }`}
                                        >
                                            {tr}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {categoryFilter === 'Energy' && (
                                <div className="flex items-center gap-1 overflow-x-auto pb-0.5">
                                    <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 mr-1 flex-shrink-0">Energy:</span>
                                    {['All', 'Basic', 'Special'].map(en => (
                                        <button
                                            key={en}
                                            type="button"
                                            onClick={() => setEnergyFilter(en)}
                                            className={`px-2.5 py-0.5 rounded text-xs font-bold border transition-all flex-shrink-0 ${
                                                energyFilter === en ? 'theme-pill-active' : 'oras-subpanel text-slate-300 hover:text-white'
                                            }`}
                                        >
                                            {en}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {catalogSourceMode === 'local' && availableSets.length > 0 && (
                                <div className="flex items-center gap-1 overflow-x-auto pb-0.5">
                                    <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 mr-1 flex-shrink-0">Set:</span>
                                    <button
                                        type="button"
                                        onClick={() => setSetFilter('All')}
                                        className={`px-2 py-0.5 rounded text-xs font-bold border transition-all flex-shrink-0 ${
                                            setFilter === 'All' ? 'theme-pill-active' : 'oras-subpanel text-slate-300 hover:text-white'
                                        }`}
                                    >
                                        All Sets
                                    </button>
                                    {availableSets.map(([code, iconUrl]) => (
                                        <button
                                            key={code}
                                            type="button"
                                            onClick={() => setSetFilter(code)}
                                            className={`px-2 py-0.5 rounded text-xs font-bold border transition-all flex items-center gap-1 flex-shrink-0 whitespace-nowrap ${
                                                setFilter === code ? 'theme-pill-active' : 'oras-subpanel text-slate-300 hover:text-white'
                                            }`}
                                        >
                                            <img

        const GenHardwareBanner = ({ genNumber, currentGen, currentTheme, wiiMode, onExitWiiMode, onHideHeader }) => {

                            <button

        const TypeCoinAndGenBox = ({

            onSelectTheme,

        const LazyImage = React.memo(({ src, fallbackSrc, alt, className }) => {
            const [imgSrc, setImgSrc] = useState(src);
            const [loaded, setLoaded] = useState(false);
            const [errored, setErrored] = useState(false);

            useEffect(() => {
                setImgSrc(src);
                setLoaded(false);
                setErrored(false);
            }, [src]);

            const handleError = () => {
                if (fallbackSrc && imgSrc !== fallbackSrc) {
                    setImgSrc(fallbackSrc);
                } else {
                    setErrored(true);
                    setLoaded(true);
                }
            };

            return (
                <div className="card-aspect-ratio bg-slate-900 overflow-hidden rounded-md sm:rounded-lg flex items-center justify-center">
                    {!loaded && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 p-2 text-center">

                            <span className="text-[9px] text-slate-400 font-semibold truncate w-full">{alt}</span>
                        </div>
                    )}
                    {errored ? (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 p-2 text-center border border-slate-700">

                        </div>
                    ) : (
                        <img
                            src={imgSrc}
                            alt={alt}
                            loading="lazy"
                            decoding="async"
                            onLoad={() => setLoaded(true)}
                            onError={handleError}
                            className={`${className} transition-opacity duration-200 ${loaded ? 'opacity-100' : 'opacity-0'}`}

                <div

                    className="theme-card p-1.5 sm:p-2.5 flex flex-col justify-between cursor-pointer group relative"

                                onRate={(r) => onRate(card.id, r)}

                            />

        /* Full View Modal Component */
        const CardModal = ({

                        if (res.ok) {

                                {/* Abilities, Attacks & Rules */}

                                    <div className="oras-subpanel p-3.5 space-y-3">

                                            Card Text & Attacks
                                        </div>
