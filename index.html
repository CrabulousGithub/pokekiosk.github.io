        const App = () => {
            const [cards, setCards] = useState(() => {
                try {
                    const saved = localStorage.getItem('pokedex_kiosk_cards_v1_4');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return [];
            });

            const [decks, setDecks] = useState(() => {
                try {
                    const saved = localStorage.getItem('pokedex_kiosk_decks_v1_4');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return [
                    {
                        id: 'deck-default-1',
                        name: 'Primal ORAS Deck',
                        type: 'Fire',
                        sleeveId: 'evo-gold',
                        cards: {}
                    }
                ];
            });

            const [activeDeckId, setActiveDeckId] = useState('deck-default-1');
            const [showDeckDrawer, setShowDeckDrawer] = useState(false);

            const [themeIndex, setThemeIndex] = useState(() => {
                const saved = localStorage.getItem('pokedex_kiosk_theme_idx');
                return saved ? parseInt(saved, 10) || 0 : 0;
            });

            const [genNumber, setGenNumber] = useState(() => {
                const saved = localStorage.getItem('pokedex_kiosk_gen_num');
                return saved ? parseInt(saved, 10) || 6 : 6;
            });

            const [wiiMode, setWiiMode] = useState(() => {
                return localStorage.getItem('pokedex_kiosk_wii_mode') === 'true';
            });
            const isCoinHoveredRef = useRef(false);
            const wHeldRef = useRef(false);

            const handleCoinHoverChange = useCallback((hovered) => {
                isCoinHoveredRef.current = hovered;
                if (hovered && wHeldRef.current) {
                    setWiiMode(prev => !prev);
                }
            }, []);

            // Secret Wii Theme Easter Egg: Hold 'W' while hovering the mouse over the Type Coin
            useEffect(() => {
                const onKeyDown = (e) => {
                    const tag = (e.target?.tagName || '').toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                    if (e.key === 'w' || e.key === 'W') {
                        const wasHeld = wHeldRef.current;
                        wHeldRef.current = true;
                        if (!wasHeld && isCoinHoveredRef.current) {
                            setWiiMode(prev => !prev);
                        }
                    }
                };
                const onKeyUp = (e) => {
                    if (e.key === 'w' || e.key === 'W') {
                        wHeldRef.current = false;
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                window.addEventListener('keyup', onKeyUp);
                return () => {
                    window.removeEventListener('keydown', onKeyDown);
                    window.removeEventListener('keyup', onKeyUp);
                };
            }, []);

            const [isHeaderCollapsed, setIsHeaderCollapsed] = useState(false);
            const [searchInput, setSearchInput] = useState('');
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('All');
            const [typeFilter, setTypeFilter] = useState('All');
            const [specialFilter, setSpecialFilter] = useState('All');
            const [trainerFilter, setTrainerFilter] = useState('All');
            const [energyFilter, setEnergyFilter] = useState('All');
            const [setFilter, setSetFilter] = useState('All');
            const [includeDeckCards, setIncludeDeckCards] = useState(false);

            const PAGE_BATCH_SIZE = 60;
            const [visibleCount, setVisibleCount] = useState(PAGE_BATCH_SIZE);

            const [selectedCard, setSelectedCard] = useState(null);
            const [showImportModal, setShowImportModal] = useState(false);
            const [showClearModal, setShowClearModal] = useState(false);
            const [showAddCartModal, setShowAddCartModal] = useState(false);
            const [addCartInitialTarget, setAddCartInitialTarget] = useState('database');
            const [importText, setImportText] = useState('');
            const [isEnriching, setIsEnriching] = useState(false);

            // Enhanced Deck Viewer state
            const [isDeckViewerExpanded, setIsDeckViewerExpanded] = useState(false);
            const [deckViewLayout, setDeckViewLayout] = useState('visual'); // 'visual' | 'list'
            const [deckCategoryTab, setDeckCategoryTab] = useState('All');
            const [deckInternalSearch, setDeckInternalSearch] = useState('');
            const [showNewDeckForm, setShowNewDeckForm] = useState(false);
            const [copiedDeckId, setCopiedDeckId] = useState(null);

            // New Deck Creation state inside Deck Drawer
            const [newDeckName, setNewDeckName] = useState('');
            const [newDeckType, setNewDeckType] = useState('Fire');
            const [newDeckSleeve, setNewDeckSleeve] = useState(ETB_SLEEVES[0].id);

            const fileInputRef = useRef(null);
            const mainScrollRef = useRef(null);
            const loadMoreSentinelRef = useRef(null);
            const syncLockRef = useRef(false);

            // Debounce search input so typing on a 2,500+ card database has zero lag
            useEffect(() => {
                const timer = setTimeout(() => {
                    setSearchTerm(searchInput);
                }, 120);
                return () => clearTimeout(timer);
            }, [searchInput]);

            // Reset windowed pagination when filters change
            useEffect(() => {
                setVisibleCount(PAGE_BATCH_SIZE);
                if (mainScrollRef.current) {
                    mainScrollRef.current.scrollTop = 0;
                }
            }, [searchTerm, categoryFilter, typeFilter, specialFilter, trainerFilter, energyFilter, setFilter, includeDeckCards]);

            useEffect(() => {
                const timer = setTimeout(() => {
                    try {
                        localStorage.setItem('pokedex_kiosk_cards_v1_4', JSON.stringify(cards));
                    } catch (e) {}
                }, 400);
                return () => clearTimeout(timer);
            }, [cards]);

            useEffect(() => {
                try {
                    localStorage.setItem('pokedex_kiosk_decks_v1_4', JSON.stringify(decks));
                } catch (e) {}
            }, [decks]);

            useEffect(() => {
                localStorage.setItem('pokedex_kiosk_theme_idx', String(themeIndex));
                localStorage.setItem('pokedex_kiosk_gen_num', String(genNumber));
                localStorage.setItem('pokedex_kiosk_wii_mode', String(wiiMode));

                const theme = TYPE_THEMES[themeIndex] || TYPE_THEMES[0];
                const genObj = GEN_THEMES.find(g => g.gen === genNumber) || GEN_THEMES[5];
                const root = document.documentElement;

                const isDefaultColorless = themeIndex === 0;
                const activeBg = isDefaultColorless ? genObj.bgOverride : theme.bg;
                const activeBgSec = isDefaultColorless ? genObj.bgSecOverride : theme.bgSec;
                const activePanelSolid = isDefaultColorless ? genObj.panelSolid : theme.panelSolid;
                const activeSubpanel = isDefaultColorless ? genObj.subpanelOverride : theme.bg;
                const activeBorder = isDefaultColorless ? genObj.borderOverride : theme.border;
                const activeAccent = isDefaultColorless ? genObj.accentOverride : theme.accent;
                const activeAccentHover = isDefaultColorless ? genObj.accentHoverOverride : theme.accentHover;
                const activeTextAccent = isDefaultColorless ? genObj.textAccentOverride : theme.textAccent;
                const activeGlow = isDefaultColorless ? genObj.glowOverride : theme.glow;

                const headerGrad = isDefaultColorless
                    ? `linear-gradient(135deg, ${genObj.panelSolid} 0%, ${genObj.bgSecOverride} 55%, ${genObj.bgOverride} 100%)`
                    : `linear-gradient(135deg, ${theme.panelSolid} 0%, ${theme.bgSec} 50%, ${theme.bg} 100%)`;

                const bannerGrad = isDefaultColorless
                    ? `linear-gradient(90deg, ${genObj.accentOverride}33 0%, ${genObj.subpanelOverride} 50%, ${genObj.panelSolid} 100%)`
                    : `linear-gradient(90deg, ${theme.accent}44 0%, ${theme.bg} 50%, ${theme.panelSolid} 100%)`;

                const fullGradient = isDefaultColorless
                    ? `radial-gradient(circle at 12% 18%, ${genObj.glowOverride}, transparent 50%), radial-gradient(circle at 88% 82%, ${genObj.accentOverride}33, transparent 52%)`
                    : theme.gradient;

                root.style.setProperty('--theme-bg', activeBg);
                root.style.setProperty('--theme-bg-secondary', activeBgSec);
                root.style.setProperty('--theme-panel-solid', activePanelSolid);
                root.style.setProperty('--theme-subpanel', activeSubpanel);
                root.style.setProperty('--theme-panel', theme.panel);
                root.style.setProperty('--theme-border', activeBorder);
                root.style.setProperty('--theme-accent', activeAccent);
                root.style.setProperty('--theme-accent-hover', activeAccentHover);
                root.style.setProperty('--theme-glow', activeGlow);
                root.style.setProperty('--theme-text-accent', activeTextAccent);
                root.style.setProperty('--theme-header-grad', headerGrad);
                root.style.setProperty('--theme-banner-grad', bannerGrad);
                root.style.setProperty('--theme-gradient', fullGradient);

                GEN_THEMES.forEach(g => document.body.classList.remove(`gen-${g.gen}`));
                document.body.classList.add(`gen-${genNumber}`);
                if (wiiMode) {
                    document.body.classList.add('wii-mode');
                } else {
                    document.body.classList.remove('wii-mode');
                }
            }, [themeIndex, genNumber, wiiMode]);

            /*
             * FIXED ULTRA-FAST SET-BASED SYNC ENGINE:
             * Uses syncLockRef so updating isEnriching state never triggers a self-cancelling
             * dependency cleanup. Fetches static expansion JSON files from jsDelivr + GitHub Raw CDN.
             */
            const unenrichedCount = useMemo(() => cards.filter(c => !c.enriched).length, [cards]);

            useEffect(() => {
                if (unenrichedCount === 0 || syncLockRef.current) return;

                let isUnmounted = false;
                syncLockRef.current = true;
                setIsEnriching(true);

                const syncByExpansionSets = async () => {
                    try {
                        const unenriched = cards.filter(c => !c.enriched);
                        const setsToFetch = Array.from(new Set(
                            unenriched.map(c => c.apiId.split('-')[0].toLowerCase()).filter(Boolean)
                        ));

                        const currentSetBatch = setsToFetch.slice(0, 8);
                        const fetchedCardMap = new Map();

                        await Promise.all(currentSetBatch.map(async (setId) => {
                            // For Hidden Fates (sm115), also check Shiny Vault (sma)
                            const targetSetIds = setId === 'sm115' ? ['sm115', 'sma'] : [setId];

                            for (const sId of targetSetIds) {
                                const cdnUrls = [
                                    `https://cdn.jsdelivr.net/gh/PokemonTCG/pokemon-tcg-data@master/cards/en/${sId}.json`,
                                    `https://raw.githubusercontent.com/PokemonTCG/pokemon-tcg-data/master/cards/en/${sId}.json`
                                ];

                                let loaded = false;
                                for (const url of cdnUrls) {
                                    try {
                                        const res = await fetch(url);
                                        if (res.ok) {
                                            const setCards = await res.json();
                                            if (Array.isArray(setCards)) {
                                                setCards.forEach(item => {
                                                    if (item && item.id) {
                                                        fetchedCardMap.set(item.id.toLowerCase(), item);
                                                        if (item.number) {
                                                            fetchedCardMap.set(`${setId}-${String(item.number).toLowerCase()}`, item);
                                                        }
                                                    }
                                                });
                                                loaded = true;
                                                break;
                                            }
                                        }
                                    } catch (e) {}
                                }

                                if (!loaded) {
                                    try {
                                        const apiRes = await fetch(`https://api.pokemontcg.io/v2/cards?q=set.id:${sId}&pageSize=250&select=id,number,types,subtypes,supertype,hp,attacks,abilities,rules,tcgplayer`);
                                        if (apiRes.ok) {
                                            const json = await apiRes.json();
                                            (json.data || []).forEach(item => {
                                                if (item && item.id) {
                                                    fetchedCardMap.set(item.id.toLowerCase(), item);
                                                    if (item.number) {
                                                        fetchedCardMap.set(`${setId}-${String(item.number).toLowerCase()}`, item);
                                                    }
                                                }
                                            });
                                        }
                                    } catch (e) {}
                                }
                            }
                        }));

                        if (isUnmounted) return;

                        const batchSetLookup = new Set(currentSetBatch);
                        const metaCache = loadMetaCache();

                        setCards(prev => prev.map(card => {
                            if (card.enriched) return card;
                            const cardSetId = card.apiId.split('-')[0].toLowerCase();
                            if (!batchSetLookup.has(cardSetId)) return card;

                            const lowerId = card.apiId.toLowerCase();
                            const altId = `${cardSetId}-${card.number.toLowerCase()}`;
                            const cleanNum = card.number.replace(/^0+/, '').toLowerCase();
                            const altCleanId = `${cardSetId}-${cleanNum}`;
                            const found = fetchedCardMap.get(lowerId) || fetchedCardMap.get(altId) || fetchedCardMap.get(altCleanId);

                            if (!found) {
                                return { ...card, enriched: true };
                            }

                            let extractedPrice = card.prices;
                            if (!extractedPrice && found.tcgplayer?.prices) {
                                const p = found.tcgplayer.prices;
                                const firstKey = Object.keys(p)[0];
                                const v = p[firstKey] || {};
                                extractedPrice = {
                                    source: 'TCGPlayer',
                                    updatedAt: found.tcgplayer.updatedAt || '',
                                    market: v.market ?? v.mid ?? null,
                                    low: v.low ?? null,
                                    high: v.high ?? null,
                                    holofoil: p.holofoil?.market ?? null
                                };
                            }

                            const updatedCard = {
                                ...card,
                                types: found.types || card.types || [],
                                subtypes: found.subtypes || card.subtypes || [],
                                hp: found.hp || card.hp || '',
                                attacks: found.attacks || card.attacks || [],
                                abilities: found.abilities || card.abilities || [],
                                rules: found.rules || card.rules || [],
                                prices: extractedPrice || null,
                                enriched: true
                            };

                            metaCache[lowerId] = {
                                types: updatedCard.types,
                                subtypes: updatedCard.subtypes,
                                hp: updatedCard.hp,
                                attacks: updatedCard.attacks,
                                abilities: updatedCard.abilities,
                                rules: updatedCard.rules,
                                prices: updatedCard.prices
                            };

                            return updatedCard;
                        }));

                        saveMetaCache(metaCache);
                    } finally {
                        syncLockRef.current = false;
                        if (!isUnmounted) {
                            setIsEnriching(false);
                        }
                    }
                };

                syncByExpansionSets();
                return () => { isUnmounted = true; };
            }, [unenrichedCount, cards]);

            const handleRateCard = useCallback((cardId, newRating) => {
                setCards(prev => prev.map(c => c.id === cardId ? { ...c, rating: newRating } : c));
                setSelectedCard(prev => (prev && prev.id === cardId) ? { ...prev, rating: newRating } : prev);
            }, []);

            const handleUpdateCardPrice = useCallback((cardId, priceObj) => {
                setCards(prev => prev.map(c => c.id === cardId ? { ...c, prices: priceObj } : c));
                setSelectedCard(prev => (prev && prev.id === cardId) ? { ...prev, prices: priceObj } : prev);
            }, []);

            // Move individual card copies from Database into a Deck
            const handleAddToDeck = useCallback((deckId, cardId, qty = 1) => {
                setCards(prev => {
                    const target = prev.find(c => c.id === cardId);
                    if (!target || target.count < qty) return prev;
                    return prev.map(c => c.id === cardId ? { ...c, count: c.count - qty } : c);
                });
                setDecks(prev => prev.map(d => {
                    if (d.id !== deckId) return d;
                    const currentQty = d.cards[cardId] || 0;
                    return {
                        ...d,
                        cards: { ...d.cards, [cardId]: currentQty + qty }
                    };
                }));
                setSelectedCard(prev => (prev && prev.id === cardId) ? { ...prev, count: Math.max(0, prev.count - qty) } : prev);
            }, []);

            // Return individual card copies from a Deck back to the Database
            const handleRemoveFromDeck = useCallback((deckId, cardId, qty = 1) => {
                setDecks(prev => prev.map(d => {
                    if (d.id !== deckId || (d.cards[cardId] || 0) < qty) return d;
                    const nextCount = (d.cards[cardId] || 0) - qty;
                    const nextCards = { ...d.cards };
                    if (nextCount <= 0) delete nextCards[cardId];
                    else nextCards[cardId] = nextCount;
                    return { ...d, cards: nextCards };
                }));
                setCards(prev => prev.map(c => c.id === cardId ? { ...c, count: c.count + qty } : c));
                setSelectedCard(prev => (prev && prev.id === cardId) ? { ...prev, count: prev.count + qty } : prev);
            }, []);

            // Confirm batch-adding cart items directly to the Database
            const handleConfirmAddToDatabase = useCallback((cartEntries) => {
                if (!cartEntries || cartEntries.length === 0) return;
                setCards(prev => {
                    const map = new Map(prev.map(c => [c.id, { ...c }]));
                    cartEntries.forEach(({ card, qty }) => {
                        if (map.has(card.id)) {
                            const existing = map.get(card.id);
                            existing.count += qty;
                        } else {
                            map.set(card.id, {
                                ...card,
                                count: qty
                            });
                        }
                    });
                    return Array.from(map.values());
                });
            }, []);

            // Confirm batch-moving cart items from Database into a target Deck
            const handleConfirmAddToDeck = useCallback((deckId, cartEntries) => {
                if (!deckId || !cartEntries || cartEntries.length === 0) return;
                const actualTransfers = {};
                setCards(prev => prev.map(c => {
                    const entry = cartEntries.find(item => item.card.id === c.id);
                    if (!entry) return c;
                    const moveQty = Math.min(c.count, entry.qty);
                    if (moveQty > 0) {
                        actualTransfers[c.id] = moveQty;
                        return { ...c, count: c.count - moveQty };
                    }
                    return c;
                }));
                setDecks(prev => prev.map(d => {
                    if (d.id !== deckId) return d;
                    const updatedCards = { ...d.cards };
                    cartEntries.forEach(({ card, qty }) => {
                        const moveQty = actualTransfers[card.id] ?? qty;
                        if (moveQty > 0) {
                            updatedCards[card.id] = (updatedCards[card.id] || 0) + moveQty;
                        }
                    });
                    return { ...d, cards: updatedCards };
                }));
            }, []);

            const handleUpdateDeckMeta = useCallback((deckId, patch) => {
                setDecks(prev => prev.map(d => d.id === deckId ? { ...d, ...patch } : d));
            }, []);

            const handleExportDeckText = useCallback((deck) => {
                if (!deck) return;
                const lines = [];
                const entries = Object.entries(deck.cards || {})
                    .map(([id, qty]) => ({ card: cards.find(c => c.id === id), id, qty }))
                    .filter(item => item.qty > 0);

                const groups = { 'Pokémon': [], 'Trainer': [], 'Energy': [] };
                entries.forEach(item => {
                    const cat = item.card?.category || 'Pokémon';
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(item);
                });

                Object.entries(groups).forEach(([cat, list]) => {
                    if (list.length === 0) return;
                    const totalCat = list.reduce((s, i) => s + i.qty, 0);
                    lines.push(`${cat}: ${totalCat}`);
                    list.forEach(({ card, id, qty }) => {
                        if (card) {
                            lines.push(`${qty} ${card.name} ${card.setCode} ${card.number}`);
                        } else {
                            lines.push(`${qty} ${id}`);
                        }
                    });
                    lines.push('');
                });

                const textOut = lines.join('\n').trim();
                const ta = document.createElement('textarea');
                ta.value = textOut;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                document.body.removeChild(ta);
                setCopiedDeckId(deck.id);
                setTimeout(() => setCopiedDeckId(null), 2000);
            }, [cards]);

            const handleCreateDeck = (e) => {
                e.preventDefault();
                const name = newDeckName.trim() || `Deck #${decks.length + 1}`;
                const newDeck = {
                    id: `deck-${Date.now()}`,
                    name,
                    type: newDeckType,
                    sleeveId: newDeckSleeve,
                    cards: {}
                };
                setDecks(prev => [...prev, newDeck]);
                setActiveDeckId(newDeck.id);
                setNewDeckName('');
            };

            const handleDeleteDeck = (deckId) => {
                const deckToDelete = decks.find(d => d.id === deckId);
                if (!deckToDelete) return;

                // Return all cards in this deck back to the main database
                setCards(prev => prev.map(c => {
                    const returned = deckToDelete.cards[c.id] || 0;
                    return returned > 0 ? { ...c, count: c.count + returned } : c;
                }));

                const remaining = decks.filter(d => d.id !== deckId);
                setDecks(remaining);
                if (activeDeckId === deckId) {
                    setActiveDeckId(remaining[0]?.id || '');
                }
            };

            const handleImportSubmit = () => {
                if (!importText.trim()) return;
                const parsed = parseLimitlessText(importText);
                const existingMap = new Map(cards.map(c => [c.id, c]));
                const merged = parsed.map(newCard => {
                    const old = existingMap.get(newCard.id);
                    if (old) {
                        return {
                            ...newCard,
                            rating: old.rating || 0,
                            types: old.types?.length ? old.types : newCard.types,
                            subtypes: old.subtypes?.length ? old.subtypes : newCard.subtypes,
                            hp: old.hp || newCard.hp,
                            attacks: old.attacks?.length ? old.attacks : newCard.attacks,
                            abilities: old.abilities?.length ? old.abilities : newCard.abilities,
                            rules: old.rules?.length ? old.rules : newCard.rules,
                            prices: old.prices || newCard.prices,
                            enriched: old.enriched
                        };
                    }
                    return newCard;
                });
                setCards(merged);
                setShowImportModal(false);
                setImportText('');
            };

            const handleExportJSON = () => {
                const payload = { version: '1.4', cards, decks };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'deckbuilder-pokedex-backup.json';
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleLoadJSON = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (Array.isArray(data)) {
                            setCards(data);
                        } else if (data && Array.isArray(data.cards)) {
                            setCards(data.cards);
                            if (Array.isArray(data.decks)) setDecks(data.decks);
                        }
                    } catch (err) {
                        console.error("Invalid JSON backup file:", err);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const deckAllocationMap = useMemo(() => {
                const map = new Map();
                decks.forEach(d => {
                    Object.entries(d.cards || {}).forEach(([cardId, qty]) => {
                        map.set(cardId, (map.get(cardId) || 0) + qty);
                    });
                });
                return map;
            }, [decks]);

            const availableSets = useMemo(() => {
                const map = new Map();
                cards.forEach(c => {
                    if (!map.has(c.setCode)) {
                        map.set(c.setCode, c.setIconUrl);
                    }
                });
                return Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0]));
            }, [cards]);

            const filteredCards = useMemo(() => {
                return filterCardCollection({
                    cards,
                    deckAllocationMap,
                    includeDeckCards,
                    ignoreZeroCount: false,
                    searchTerm,
                    categoryFilter,
                    typeFilter,
                    specialFilter,
                    trainerFilter,
                    energyFilter,
                    setFilter
                });
            }, [cards, deckAllocationMap, includeDeckCards, categoryFilter, setFilter, typeFilter, specialFilter, trainerFilter, energyFilter, searchTerm]);

            const visibleCards = useMemo(() => {
                return filteredCards.slice(0, visibleCount);
            }, [filteredCards, visibleCount]);

            // Infinite scroll observer to smoothly load more cards on large databases
            useEffect(() => {
                const sentinel = loadMoreSentinelRef.current;
                if (!sentinel || visibleCount >= filteredCards.length) return;

                const observer = new IntersectionObserver(
                    (entries) => {
                        if (entries[0]?.isIntersecting) {
                            setVisibleCount(prev => Math.min(filteredCards.length, prev + PAGE_BATCH_SIZE));
                        }
                    },
                    { root: mainScrollRef.current, rootMargin: '320px' }
                );
                observer.observe(sentinel);
                return () => observer.disconnect();
            }, [visibleCount, filteredCards.length]);

            const totalAvailableCards = useMemo(() => cards.reduce((acc, c) => acc + c.count, 0), [cards]);
            const enrichedCount = useMemo(() => cards.filter(c => c.enriched).length, [cards]);
            const enrichPercent = cards.length > 0 ? Math.round((enrichedCount / cards.length) * 100) : 100;
            const currentGenObj = GEN_THEMES.find(g => g.gen === genNumber) || GEN_THEMES[5];
            const currentThemeObj = TYPE_THEMES[themeIndex] || TYPE_THEMES[0];
            const activeDeck = decks.find(d => d.id === activeDeckId) || decks[0] || null;

            return (
                <div className="flex flex-col h-full w-full overflow-hidden animate-fade-in">
                    {}
                    {isHeaderCollapsed ? (
                        <div className="flex-none theme-header px-3 py-1.5 flex items-center justify-between z-20">
                            <div className="flex items-center gap-2 min-w-0">
                                <img
                                    src={LOGO_URL}
                                    alt="Paras"
                                    className="pixel-sprite w-6 h-6 object-contain flex-shrink-0"
                                />
                                <span className="text-xs font-extrabold text-white truncate gen-title-font">
                                    Deckbuilder Pokedex
                                </span>
                                <span className="text-[10px] font-bold px-2 py-0.5 rounded oras-subpanel" style={{ color: 'var(--theme-text-accent)' }}>
                                    {filteredCards.length} Shown
                                </span>
                            </div>
                            <div className="flex items-center gap-1.5">
                                <button
                                    type="button"
                                    onClick={() => setShowDeckDrawer(prev => !prev)}
                                    className="px-2.5 py-1 rounded text-[11px] font-extrabold oras-subpanel flex items-center gap-1"
                                    style={{ color: 'var(--theme-text-accent)' }}
                                >
                                    <Icons.Deck />
                                    <span>Decks ({decks.length})</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setIsHeaderCollapsed(false)}
                                    className="px-2.5 py-1 rounded text-[11px] font-extrabold theme-btn-primary flex items-center gap-1"
                                >
                                    <Icons.ChevronDown />
                                    <span>Show Bar</span>
                                </button>
                            </div>
                        </div>
                    ) : (
                        <header className="flex-none theme-header z-20">
                            <GenHardwareBanner
                                genNumber={genNumber}
                                currentGen={currentGenObj}
                                currentTheme={currentThemeObj}
                                wiiMode={wiiMode}
                                onExitWiiMode={() => setWiiMode(false)}
                                onHideHeader={() => setIsHeaderCollapsed(true)}
                            />

                            <div className="max-w-7xl mx-auto px-2.5 sm:px-6 py-1.5 sm:py-2.5 flex flex-col lg:flex-row justify-between items-center gap-2 sm:gap-3">
                                {/* Left Brand (Transparent Paras Sprite) + 3D Type Coin + Generation Box */}
                                <div className="flex items-center justify-between w-full lg:w-auto gap-2">
                                    <div className="flex items-center gap-2 min-w-0">
                                        <img
                                            src={LOGO_URL}
                                            alt="Paras Sprite"
                                            className="pixel-sprite mobile-logo-sprite object-contain drop-shadow-[0_2px_6px_rgba(0,0,0,0.75)] hover:scale-110 transition-transform flex-shrink-0"
                                            style={{ width: '48px', height: '48px', minWidth: '48px', minHeight: '48px', backgroundColor: 'transparent' }}
                                        />
                                        <div className="min-w-0">
                                            <h1 className="text-sm sm:text-xl font-extrabold text-white tracking-tight leading-tight truncate gen-title-font">
                                                Deckbuilder Pokedex
                                            </h1>
                                            <div className="flex flex-wrap items-center gap-1.5 text-[10px] sm:text-[11px] text-slate-300 font-semibold">
                                                <span>{totalAvailableCards} Cards • {cards.length} Unique</span>
                                                {enrichPercent < 100 && (
                                                    <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full oras-subpanel text-[9px] sm:text-[10px] font-bold" style={{ color: 'var(--theme-text-accent)' }}>
                                                        <span className="w-1.5 h-1.5 rounded-full animate-ping" style={{ backgroundColor: 'var(--theme-text-accent)' }}></span>
                                                        Sync {enrichPercent}%
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    <TypeCoinAndGenBox
                                        themeIndex={themeIndex}
                                        onFlipCoin={() => setThemeIndex(prev => (prev + 1) % TYPE_THEMES.length)}
                                        onSelectTheme={(idx) => setThemeIndex(idx)}
                                        genNumber={genNumber}
                                        onCycleGen={() => setGenNumber(prev => (prev % 9) + 1)}
                                        onSelectGen={(g) => setGenNumber(g)}
                                        wiiMode={wiiMode}
                                        onCoinHoverChange={handleCoinHoverChange}
                                    />
                                </div>

                                {/* Right Action Buttons: Compact on Mobile */}
                                <div className="flex flex-wrap items-center justify-end gap-1 sm:gap-1.5 w-full lg:w-auto">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setAddCartInitialTarget('database');
                                            setShowAddCartModal(true);
                                        }}
                                        title="Open Card Cart to search and add cards to your Database"
                                        className="px-2.5 sm:px-3 py-1 sm:py-1.5 rounded text-[11px] sm:text-xs font-extrabold theme-btn-primary flex items-center gap-1"
                                    >
                                        <Icons.Plus /> <span>Add</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleExportJSON}
                                        className="px-2 sm:px-2.5 py-1 sm:py-1.5 rounded text-[11px] sm:text-xs font-bold oras-subpanel hover:brightness-110 text-slate-200 flex items-center gap-1"
                                    >
                                        <Icons.Download /> <span className="hidden xs:inline">Export</span> JSON
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => fileInputRef.current?.click()}
                                        className="px-2 sm:px-2.5 py-1 sm:py-1.5 rounded text-[11px] sm:text-xs font-bold oras-subpanel hover:brightness-110 text-slate-200 flex items-center gap-1"
                                    >
                                        <Icons.Upload /> <span className="hidden xs:inline">Load</span> JSON
                                    </button>
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        accept=".json"
                                        onChange={handleLoadJSON}
                                        className="hidden"
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowImportModal(true)}
                                        className="px-2.5 sm:px-3 py-1 sm:py-1.5 rounded text-[11px] sm:text-xs font-extrabold theme-btn-primary flex items-center gap-1"
                                    >
                                        <Icons.Upload /> Import
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setShowClearModal(true)}
                                        className="px-2 sm:px-2.5 py-1 sm:py-1.5 rounded text-[11px] sm:text-xs font-bold oras-subpanel hover:bg-rose-900 text-rose-200 flex items-center gap-1"
                                    >
                                        <Icons.Trash /> <span className="hidden sm:inline">Clear</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setShowDeckDrawer(prev => !prev)}
                                        className="px-2.5 sm:px-3 py-1 sm:py-1.5 rounded text-[11px] sm:text-xs font-extrabold oras-subpanel hover:brightness-110 flex items-center gap-1"
                                        style={{ borderColor: 'var(--theme-text-accent)', color: 'var(--theme-text-accent)' }}
                                    >
                                        <Icons.Deck />
                                        <span>Decks ({decks.length})</span>
                                    </button>
                                </div>
                            </div>

                            {/* Compact Filter Controls */}
                            <div className="max-w-7xl mx-auto px-2.5 sm:px-6 pb-2 space-y-1.5">
                                <div className="flex flex-col md:flex-row items-stretch md:items-center gap-1.5 sm:gap-2">
                                    {/* Multi-parameter Search Input */}
                                    <div className="relative flex-1">
                                        <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400">
                                            <Icons.Search />
                                        </div>
                                        <input
                                            type="text"
                                            value={searchInput}
                                            onChange={(e) => setSearchInput(e.target.value)}
                                            placeholder='Search name, comma params (Altaria, "80"), or *3* for rating...'
                                            className="w-full pl-9 pr-7 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-medium oras-subpanel text-white placeholder-slate-400 focus:outline-none"
                                        />
                                        {searchInput && (
                                            <button
                                                type="button"
                                                onClick={() => { setSearchInput(''); setSearchTerm(''); }}
                                                className="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-white font-bold"
                                            >
                                                ✕
                                            </button>
                                        )}
                                    </div>

                                    <div className="flex items-center justify-between gap-1.5">
                                        {/* Category Tabs */}
                                        <div className="flex items-center gap-1 oras-subpanel p-0.5 sm:p-1 overflow-x-auto">
                                            {['All', 'Pokémon', 'Trainer', 'Energy'].map(cat => (
                                                <button
                                                    key={cat}
                                                    type="button"
                                                    onClick={() => setCategoryFilter(cat)}
                                                    className={`px-2.5 sm:px-3 py-1 rounded text-[11px] sm:text-xs font-extrabold transition-all flex-shrink-0 ${
                                                        categoryFilter === cat ? 'theme-pill-active' : 'text-slate-300 hover:text-white'
                                                    }`}
                                                >
                                                    {cat}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Slider to Include or Hide Cards in Decks */}
                                        <label className="flex items-center gap-1.5 px-2 sm:px-3 py-1 sm:py-1.5 oras-subpanel cursor-pointer select-none flex-shrink-0">
                                            <span className="text-[10px] sm:text-xs font-bold text-slate-200">In Decks</span>
                                            <button
                                                type="button"
                                                role="switch"
                                                aria-checked={includeDeckCards}
                                                onClick={() => setIncludeDeckCards(prev => !prev)}
                                                className="w-8 sm:w-10 h-4 sm:h-5 flex items-center rounded-full p-0.5 transition-colors"
                                                style={{ backgroundColor: includeDeckCards ? 'var(--theme-accent)' : 'var(--theme-bg-secondary)' }}
                                            >
                                                <span
                                                    className={`bg-white w-3 sm:w-4 h-3 sm:h-4 rounded-full shadow-md transform transition-transform ${
                                                        includeDeckCards ? 'translate-x-4 sm:translate-x-5' : 'translate-x-0'
                                                    }`}
                                                />
                                            </button>
                                        </label>
                                    </div>
                                </div>

                                {categoryFilter === 'Pokémon' && (
                                    <div className="flex flex-col gap-1 pt-0.5">
                                        <div className="flex items-center gap-1 overflow-x-auto pb-0.5">
                                            <span className="text-[9px] sm:text-[10px] font-black uppercase tracking-wider text-slate-400 mr-1 flex-shrink-0">Type:</span>
                                            {['All', 'Grass', 'Fire', 'Water', 'Lightning', 'Psychic', 'Fighting', 'Dark', 'Steel', 'Fairy', 'Dragon', 'Colorless'].map(t => (
                                                <button
                                                    key={t}
                                                    type="button"
                                                    onClick={() => setTypeFilter(t)}
                                                    className={`px-2 py-0.5 sm:py-1 rounded text-[11px] sm:text-xs font-bold border transition-all flex items-center gap-1 flex-shrink-0 ${
                                                        typeFilter === t ? 'theme-pill-active' : 'oras-subpanel text-slate-300 hover:text-white'
                                                    }`}
                                                >
                                                    {t !== 'All' && <TypeSymbol type={t} className="w-3.5 h-3.5" />}
                                                    <span>{t}</span>
                                                </button>
                                            ))}

                                                                onClick={() => {
                                                                    setAddCartInitialTarget('deck');
                                                                    setShowAddCartModal(true);
                                                                }}
                                                                className="px-3.5 py-1.5 rounded text-xs font-extrabold theme-btn-primary inline-flex items-center gap-1"
                                                            >
                                                                <Icons.Plus /> Pick Cards from Database
                                                            </button>
                                                        </div>
                                                    ) : deckViewLayout === 'visual' ? (
                                                        <div className={`grid gap-2 ${
                                                            isDeckViewerExpanded
                                                                ? 'grid-cols-3 sm:grid-cols-4 lg:grid-cols-5'
                                                                : 'grid-cols-2 sm:grid-cols-3'
                                                        }`}>
                                                            {filteredDeckEntries.map(({ cardId, qty, card }) => (
                                                                <div
                                                                    key={cardId}
                                                                    onClick={() => setSelectedCard(card)}
                                                                    className="theme-card p-1.5 flex flex-col justify-between cursor-pointer relative"
                                                                >
                                                                    <div className="relative">
                                                                        <LazyImage
                                                                            src={card.smallImageUrl}
                                                                            fallbackSrc={card.imageUrl}
                                                                            alt={card.name}
                                                                            className="w-full h-full object-contain rounded"
                                                                        />
                                                                        <span className="absolute top-1 left-1 px-1.5 py-0.5 rounded bg-sky-600 text-white text-[10px] font-black shadow border border-white/50">
                                                                            {qty}× in Deck
                                                                        </span>
                                                                        <span className="absolute top-1 right-1 px-1.5 py-0.5 rounded bg-black/80 text-slate-200 text-[9px] font-bold">
                                                                            DB: {card.count}
                                                                        </span>
                                                                    </div>
                                                                    <div className="mt-1.5 pt-1 border-t border-slate-800/80 space-y-1">
                                                                        <div className="text-[11px] font-extrabold text-white truncate">{card.name}</div>
                                                                        <div
                                                                            className="flex items-center justify-between gap-1"
                                                                            onClick={(e) => e.stopPropagation()}
                                                                        >
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => handleRemoveFromDeck(activeDeck.id, cardId, 1)}
                                                                                title="Return 1 copy to Database"
                                                                                className="px-2 py-0.5 rounded bg-slate-800 hover:bg-rose-700 text-white text-[10px] font-black"
                                                                            >
                                                                                -1
                                                                            </button>
                                                                            <span className="text-[10px] font-bold text-slate-400">
                                                                                {card.setCode} #{card.number}
                                                                            </span>
                                                                            <button
                                                                                type="button"
                                                                                disabled={card.count < 1}
                                                                                onClick={() => handleAddToDeck(activeDeck.id, cardId, 1)}
                                                                                title="Move 1 more copy from Database"
                                                                                className="px-2 py-0.5 rounded bg-slate-800 hover:bg-emerald-700 text-white text-[10px] font-black disabled:opacity-35"
                                                                            >
                                                                                +1
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    ) : (
                                                        <div className="space-y-2.5">
                                                            {['Pokémon', 'Trainer', 'Energy'].map(sectionCat => {
                                                                const sectionItems = filteredDeckEntries.filter(e => e.card.category === sectionCat);
                                                                if (sectionItems.length === 0) return null;
                                                                const secTotal = sectionItems.reduce((s, i) => s + i.qty, 0);
                                                                return (
                                                                    <div key={sectionCat} className="oras-subpanel p-2.5 space-y-1.5">
                                                                        <div className="flex items-center justify-between text-[11px] font-black uppercase tracking-wider pb-1 border-b border-slate-800" style={{ color: 'var(--theme-text-accent)' }}>
                                                                            <span>{sectionCat}</span>
                                                                            <span>{secTotal} Cards</span>
                                                                        </div>
                                                                        {sectionItems.map(({ cardId, qty, card }) => (
                                                                            <div
                                                                                key={cardId}
                                                                                onClick={() => setSelectedCard(card)}
                                                                                className="flex items-center justify-between gap-2 px-2 py-1.5 rounded bg-slate-950/90 border border-slate-800/90 hover:border-sky-500/50 cursor-pointer text-xs"
                                                                            >
                                                                                <div className="flex items-center gap-2 min-w-0">
                                                                                    <img
                                                                                        src={card.smallImageUrl}
                                                                                        alt={card.name}
                                                                                        className="w-6 h-8 object-contain rounded flex-shrink-0"
                                                                                    />
                                                                                    <span className="font-black text-sky-400">{qty}×</span>
                                                                                    <div className="truncate">
                                                                                        <span className="font-bold text-white">{card.name}</span>
                                                                                        <span className="text-[10px] text-slate-400 ml-1.5">
                                                                                            {card.setCode} #{card.number}
                                                                                        </span>
                                                                                    </div>
                                                                                </div>
                                                                                <div
                                                                                    className="flex items-center gap-1 flex-shrink-0"
                                                                                    onClick={(e) => e.stopPropagation()}
                                                                                >
                                                                                    <span className="text-[10px] text-slate-400 mr-1">DB:{card.count}</span>
                                                                                    <button
                                                                                        type="button"
                                                                                        onClick={() => handleRemoveFromDeck(activeDeck.id, cardId, 1)}
                                                                                        className="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-rose-700 text-white font-bold"
                                                                                    >
                                                                                        -1
                                                                                    </button>
                                                                                    <button
                                                                                        type="button"
                                                                                        disabled={card.count < 1}
                                                                                        onClick={() => handleAddToDeck(activeDeck.id, cardId, 1)}
                                                                                        className="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-emerald-700 text-white font-bold disabled:opacity-40"
                                                                                    >
                                                                                        +1
                                                                                    </button>
                                                                                </div>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>

                                                {/* Deck Footer Controls */}
                                                <div className="pt-2 border-t border-slate-700 flex items-center justify-between flex-shrink-0">
                                                    <span className="text-[10px] font-bold text-slate-400">
                                                        Click any card to open Full View
                                                    </span>
                                                    <button
                                                        type="button"
                                                        onClick={() => handleDeleteDeck(activeDeck.id)}
                                                        className="text-[11px] font-bold text-rose-400 hover:text-rose-300 flex items-center gap-1"
                                                    >
                                                        <Icons.Trash /> Delete Deck (Return Cards)
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })() : (
                                        <div className="oras-subpanel p-6 text-center text-xs text-slate-400">
                                            No decks created yet. Click <strong>+ New Deck</strong> above to start!
                                        </div>
                                    )}
                                </aside>
                            </>
                        )}
                    </div>

                    {/* Cart-Based Add Cards Window */}
                    <AddCardsCartModal
                        isOpen={showAddCartModal}
                        onClose={() => setShowAddCartModal(false)}
                        cards={cards}
                        availableSets={availableSets}
                        deckAllocationMap={deckAllocationMap}
                        initialTarget={addCartInitialTarget}
                        activeDeck={activeDeck}
                        onConfirmAddToDatabase={handleConfirmAddToDatabase}
                        onConfirmAddToDeck={handleConfirmAddToDeck}
                    />

                    {selectedCard && (
                        <CardModal
                            card={selectedCard}
                            onClose={() => setSelectedCard(null)}
                            onRate={handleRateCard}
                            decks={decks}
                            activeDeckId={activeDeck?.id}
                            onSetActiveDeck={setActiveDeckId}
                            onAddToDeck={handleAddToDeck}
                            onRemoveFromDeck={handleRemoveFromDeck}
                            onUpdateCardPrice={handleUpdateCardPrice}
                        />
                    )}

                    {/* Import Limitless Text Modal */}
                    {showImportModal && (
                        <div
                            className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in"
                            onClick={() => setShowImportModal(false)}
                        >
                            <div
                                className="oras-modal-panel w-full max-w-2xl p-5 space-y-4"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                                    <h3 className="text-base font-extrabold text-white gen-title-font">
                                        Import Limitless TCG Deck / Collection Text
                                    </h3>
                                    <button onClick={() => setShowImportModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                                </div>
                                <p className="text-xs text-slate-300">
                                    Paste your Limitless TCG export text below (e.g., <code>10 Pikachu EVO 35</code>). Existing Pokéball ratings will be preserved automatically.
                                </p>
                                <textarea
                                    rows={10}
                                    value={importText}
                                    onChange={(e) => setImportText(e.target.value)}
                                    placeholder={`Pokémon: 21\n10 Pikachu EVO 35\n1 Tapu Lele-GX GRI 60\n\nTrainer: 10\n4 Cynthia UPR 119`}
                                    className="w-full p-3 rounded text-xs font-mono bg-slate-950 border border-slate-700 text-white focus:outline-none"
                                />
                                {}
                                <div className="flex flex-wrap justify-end items-center gap-2">
                                    <div className="flex items-center gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowImportModal(false)}
                                            className="px-4 py-1.5 rounded text-xs font-bold bg-slate-800 text-slate-300 hover:text-white"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="button"
                                            onClick={handleImportSubmit}
                                            className="px-4 py-1.5 rounded text-xs font-extrabold theme-btn-primary"
                                        >
                                            Save & Import Cards
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {showClearModal && (
                        <div
                            className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in"
                            onClick={() => setShowClearModal(false)}
                        >
                            <div
                                className="oras-modal-panel w-full max-w-md p-5 space-y-4"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <h3 className="text-base font-extrabold text-rose-400 gen-title-font">
                                    Clear Entire Database?
                                </h3>
                                <p className="text-xs text-slate-300 leading-relaxed">
                                    This will remove all imported cards and ratings from your local database. You can always re-import your text list or JSON backup at any time.
                                </p>
                                <div className="flex justify-end gap-2">
                                    <button
                                        type="button"
                                        onClick={() => setShowClearModal(false)}
                                        className="px-4 py-1.5 rounded text-xs font-bold bg-slate-800 text-slate-300 hover:text-white"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setCards([]);
                                            setDecks(prev => prev.map(d => ({ ...d, cards: {} })));
                                            localStorage.removeItem('pokedex_kiosk_cards_v1_4');
                                            setShowClearModal(false);
                                        }}
                                        className="px-4 py-1.5 rounded text-xs font-extrabold bg-rose-600 hover:bg-rose-500 text-white"
                                    >
                                        Yes, Wipe Database
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
