                                                )}
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        </aside>
                    )}
                </>
            );
        };

        const App = () => {
            const [dbCards, setDbCards] = useState([]);
            const [decks, setDecks] = useState([]);
            const [activeDeckId, setActiveDeckId] = useState(null);
            const [isDeckWindowOpen, setIsDeckWindowOpen] = useState(false);
            const [themeIndex, setThemeIndex] = useState(0); // Default 0 = Colorless (ORAS Ruby/Sapphire accent)
            const [genNumber, setGenNumber] = useState(6);   // Default 6 = Omega Ruby / Alpha Sapphire
            const [includeDeckCards, setIncludeDeckCards] = useState(false); // Slider to include or hide cards used in decks

            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('All');
            const [typeFilter, setTypeFilter] = useState('All');
            const [specialFilter, setSpecialFilter] = useState('All');
            const [trainerFilter, setTrainerFilter] = useState('All');
            const [setFilter, setSetFilter] = useState('All');
            const [energyFilter, setEnergyFilter] = useState('All');
            
            const [isEnriching, setIsEnriching] = useState(false);
            const [selectedCardKey, setSelectedCardKey] = useState(null);
            const [showImport, setShowImport] = useState(false);
            const [showClearConfirm, setShowClearConfirm] = useState(false);
            
            const POKEMON_TYPES = [
                { label: 'Grass', value: 'Grass' },
                { label: 'Fire', value: 'Fire' },
                { label: 'Water', value: 'Water' },
                { label: 'Lightning', value: 'Lightning' },
                { label: 'Psychic', value: 'Psychic' },
                { label: 'Fighting', value: 'Fighting' },
                { label: 'Dark', value: 'Darkness' },
                { label: 'Steel', value: 'Metal' },
                { label: 'Fairy', value: 'Fairy' },
                { label: 'Dragon', value: 'Dragon' },
                { label: 'Colorless', value: 'Colorless' }
            ];
            const SPECIAL_TYPES = ['EX', 'GX', 'BREAK', 'V', 'VMAX', 'VSTAR', 'Prism Star'];
            const TRAINER_TYPES = ['Item', 'Supporter', 'Tool', 'Stadium'];

            // Apply CSS Variables & Generation Body Class whenever Type Coin or Generation Number changes
            useEffect(() => {
                const theme = TYPE_THEMES[themeIndex] || TYPE_THEMES[0];
                const genObj = GEN_THEMES.find(g => g.gen === genNumber) || GEN_THEMES[5];
                const root = document.documentElement;

                // Blend Generation signature aesthetic with Type Coin selection
                const isDefaultColorless = themeIndex === 0;
                const activeBg = isDefaultColorless ? genObj.bgOverride : theme.bg;
                const activePanelSolid = isDefaultColorless ? genObj.panelSolid : theme.panelSolid;
                const activeBorder = isDefaultColorless ? genObj.borderOverride : theme.border;
                const activeAccent = isDefaultColorless ? genObj.accentOverride : theme.accent;
                const activeTextAccent = isDefaultColorless ? genObj.textAccentOverride : theme.textAccent;

                root.style.setProperty('--theme-bg', activeBg);
                root.style.setProperty('--theme-bg-secondary', theme.bgSec);
                root.style.setProperty('--theme-panel-solid', activePanelSolid);
                root.style.setProperty('--theme-panel', theme.panel);
                root.style.setProperty('--theme-border', activeBorder);
                root.style.setProperty('--theme-accent', activeAccent);
                root.style.setProperty('--theme-accent-hover', theme.accentHover);
                root.style.setProperty('--theme-glow', theme.glow);
                root.style.setProperty('--theme-text-accent', activeTextAccent);
                root.style.setProperty('--theme-gradient', theme.gradient);

                // Apply gen-1 through gen-9 class on document.body
                GEN_THEMES.forEach(g => document.body.classList.remove(`gen-${g.gen}`));
                document.body.classList.add(`gen-${genNumber}`);
            }, [themeIndex, genNumber]);

            // Load Database, Decks, Theme Coin, and Generation Number from localStorage
            useEffect(() => {
                const savedData = localStorage.getItem('pokeKioskDB');
                const savedDecks = localStorage.getItem('pokeKioskDecks');
                const savedTheme = localStorage.getItem('pokeKioskThemeIdx');
                const savedGen = localStorage.getItem('pokeKioskGenNum');

                if (savedTheme !== null) {
                    const idx = parseInt(savedTheme, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < TYPE_THEMES.length) {
                        setThemeIndex(idx);
                    }
                }

                if (savedGen !== null) {
                    const gNum = parseInt(savedGen, 10);
                    if (!isNaN(gNum) && gNum >= 1 && gNum <= 9) {
                        setGenNumber(gNum);
                    }
                }

                if (savedDecks) {
                    try {
                        const parsedDecks = JSON.parse(savedDecks);
                        if (Array.isArray(parsedDecks)) {
                            setDecks(parsedDecks);
                            if (parsedDecks.length > 0) setActiveDeckId(parsedDecks[0].id);
                        }
                    } catch (e) {}
                }

                if (savedData) {
                    try {
                        let parsed = JSON.parse(savedData);
                        const version = localStorage.getItem('pokeKioskVersion');
                        if (version !== '1.4') {
                            parsed = parsed.map(c => ({ ...c, enriched: false }));
                            localStorage.setItem('pokeKioskVersion', '1.4');
                        }
                        setDbCards(parsed);
                    } catch (e) {
                        setDbCards([]);
                    }
                }
            }, []);

            const saveAllState = (newCards, newDecks) => {
                if (newCards !== undefined) {
                    setDbCards(newCards);
                    localStorage.setItem('pokeKioskDB', JSON.stringify(newCards));
                }
                if (newDecks !== undefined) {
                    setDecks(newDecks);
                    localStorage.setItem('pokeKioskDecks', JSON.stringify(newDecks));
                }
            };

            const handleFlipCoin = () => {
                setThemeIndex(prev => {
                    const next = (prev + 1) % TYPE_THEMES.length;
                    localStorage.setItem('pokeKioskThemeIdx', String(next));
                    return next;
                });
            };

            const handleSelectTheme = (idx) => {
                setThemeIndex(idx);
                localStorage.setItem('pokeKioskThemeIdx', String(idx));
            };

            const handleCycleGen = () => {
                setGenNumber(prev => {
                    const next = prev >= 9 ? 1 : prev + 1;
                    localStorage.setItem('pokeKioskGenNum', String(next));
                    return next;
                });
            };

            const handleSelectGen = (num) => {
                setGenNumber(num);
                localStorage.setItem('pokeKioskGenNum', String(num));
            };

            useEffect(() => {
                const enrichDatabase = async () => {
                    const missing = dbCards.filter(c => !c.enriched);
                    if (missing.length === 0 || isEnriching) return;

                    setIsEnriching(true);
                    const batch = missing.slice(0, 10);
                    const validBatch = batch.filter(c => c.apiId);

                    if (validBatch.length === 0) {
                        setDbCards(prev => prev.map(c => batch.some(b => b.id === c.id) ? { ...c, enriched: true } : c));
                        setIsEnriching(false);
                        return;
                    }

                    const queryStr = validBatch.map(c => `id:"${c.apiId}"`).join(' OR ');
                    const encodedQuery = encodeURIComponent(`(${queryStr})`);
                    
                    try {
                        const res = await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodedQuery}&select=id,types,subtypes,supertype,hp,attacks,abilities,rules,tcgplayer,cardmarket`);
                        
                        if (res.status === 429 || res.status >= 500) {
                            setIsEnriching(false);
                            setTimeout(() => setDbCards(prev => [...prev]), 5000);
                            return;
                        }

                        if (!res.ok) {
                            throw new Error(`API Request Failed with status ${res.status}`);
                        }
                        
                        const json = await res.json();
                        
                        if (json.data) {
                            const enrichedMap = {};
                            json.data.forEach(d => { enrichedMap[d.id.toLowerCase()] = d; });
                            
                            setDbCards(prev => {
                                const updated = prev.map(c => {
                                    const lookupId = c.apiId ? c.apiId.toLowerCase() : '';
                                    if (enrichedMap[lookupId]) {
                                        const apiCard = enrichedMap[lookupId];
                                        return {
                                            ...c,
                                            types: apiCard.types || [],
                                            subtypes: apiCard.subtypes || [],
                                            category: apiCard.supertype || c.category,
                                            hp: apiCard.hp || null,
                                            attacks: apiCard.attacks || [],
                                            abilities: apiCard.abilities || [],
                                            rules: apiCard.rules || [],
                                            prices: extractPricing(apiCard),
                                            enriched: true
                                        };
                                    }
                                    if (batch.some(b => b.id === c.id)) return { ...c, enriched: true };
                                    return c;
                                });
                                localStorage.setItem('pokeKioskDB', JSON.stringify(updated));
                                return updated;
                            });
                        }
                    } catch (e) {
                        setIsEnriching(false);
                        setTimeout(() => setDbCards(prev => [...prev]), 5000);
                        return;
                    } finally {
                        setIsEnriching(false);
                    }
                };

                const timeoutId = setTimeout(enrichDatabase, 1200); 
                return () => clearTimeout(timeoutId);
            }, [dbCards, isEnriching]);

            const handleCreateDeck = ({ name, type, sleeveId }) => {
                const newDeck = {
                    id: `deck-${Date.now()}`,
                    name,
                    type,
                    sleeveId,
                    cards: []
                };
                const nextDecks = [...decks, newDeck];
                saveAllState(undefined, nextDecks);
                setActiveDeckId(newDeck.id);
                setIsDeckWindowOpen(true);
            };

            const handleUpdateDeckMeta = (deckId, updates) => {
                const nextDecks = decks.map(d => d.id === deckId ? { ...d, ...updates } : d);
                saveAllState(undefined, nextDecks);
            };

            const handleDeleteDeck = (deckId) => {
                const deckToDelete = decks.find(d => d.id === deckId);
                if (!deckToDelete) return;

                // Return all cards in this deck back to the main database
                const returnedMap = new Map();
                deckToDelete.cards.forEach(c => {
                    returnedMap.set(`${c.set}-${c.number}`, c);
                });

                const updatedDb = [...dbCards];
                returnedMap.forEach((deckCard, key) => {
                    const idx = updatedDb.findIndex(dbC => `${dbC.set}-${dbC.number}` === key);
                    if (idx > -1) {
                        updatedDb[idx] = { ...updatedDb[idx], count: updatedDb[idx].count + deckCard.count };
                    } else {
                        updatedDb.push({ ...deckCard });
                    }
                });

                const remainingDecks = decks.filter(d => d.id !== deckId);
                saveAllState(updatedDb, remainingDecks);
                if (activeDeckId === deckId) {
                    setActiveDeckId(remainingDecks[0]?.id || null);
                }
            };

            // Move `qty` copies of `card` OFF the database and INTO `deckId`
            const handleMoveToDeck = (card, deckId, qty = 1) => {
                const targetId = deckId || activeDeckId;
                if (!targetId) {
                    setIsDeckWindowOpen(true);
                    return;
                }

                const cardKey = `${card.set}-${card.number}`;
                const dbIdx = dbCards.findIndex(c => `${c.set}-${c.number}` === cardKey);
                if (dbIdx === -1 || dbCards[dbIdx].count <= 0) return;

                const actualMove = Math.min(qty, dbCards[dbIdx].count);
                if (actualMove <= 0) return;

                const nextDb = dbCards.map((c, i) => i === dbIdx ? { ...c, count: c.count - actualMove } : c);

                const nextDecks = decks.map(d => {
                    if (d.id !== targetId) return d;
                    const existingIdx = d.cards.findIndex(dc => `${dc.set}-${dc.number}` === cardKey);
                    let nextDeckCards;
                    if (existingIdx > -1) {
                        nextDeckCards = d.cards.map((dc, i) => i === existingIdx ? { ...dc, count: dc.count + actualMove } : dc);
                    } else {
                        nextDeckCards = [...d.cards, { ...dbCards[dbIdx], count: actualMove }];
                    }
                    return { ...d, cards: nextDeckCards };
                });

                saveAllState(nextDb, nextDecks);
            };

            // Move `qty` copies OFF `deckId` and BACK INTO the database
            const handleRemoveFromDeck = (cardKey, deckId, qty = 1) => {
                const targetDeck = decks.find(d => d.id === deckId);
                if (!targetDeck) return;
                const deckCard = targetDeck.cards.find(c => `${c.set}-${c.number}` === cardKey);
                if (!deckCard) return;

                const actualReturn = Math.min(qty, deckCard.count);
                if (actualReturn <= 0) return;

                // Add back to database
                const nextDb = [...dbCards];
                const dbIdx = nextDb.findIndex(c => `${c.set}-${c.number}` === cardKey);
                if (dbIdx > -1) {
                    nextDb[dbIdx] = { ...nextDb[dbIdx], count: nextDb[dbIdx].count + actualReturn };
                } else {
                    nextDb.push({ ...deckCard, count: actualReturn });
                }

                // Subtract from deck
                const nextDecks = decks.map(d => {
                    if (d.id !== deckId) return d;
                    const updatedCards = d.cards
                        .map(c => `${c.set}-${c.number}` === cardKey ? { ...c, count: c.count - actualReturn } : c)
                        .filter(c => c.count > 0);
                    return { ...d, cards: updatedCards };
                });

                saveAllState(nextDb, nextDecks);
            };

            const handleImport = (newCards) => {
                const existingMap = new Map(dbCards.map(c => [`${c.set}-${c.number}`, c]));
                const mergedCards = newCards.map(nc => {
                    const ext = existingMap.get(`${nc.set}-${nc.number}`);
                    if (ext) {
                        return { 
                            ...nc, 
                            rating: ext.rating || 0, 
                            enriched: ext.enriched, 
                            types: ext.types, 
                            subtypes: ext.subtypes, 
                            category: ext.category,
                            hp: ext.hp,
                            attacks: ext.attacks,
                            abilities: ext.abilities,
                            rules: ext.rules,
                            prices: ext.prices || null
                        };
                    }
                    return nc;
                });

                saveAllState(mergedCards, undefined);
                setShowImport(false);
            };

            const handleExportJSON = () => {
                const payload = {
                    version: '1.5',
                    dbCards,
                    decks,
                    themeIndex,
                    genNumber
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "deckbuilder_pokedex_backup.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            const handleImportJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        if (Array.isArray(json)) {
                            saveAllState(json, undefined);
                        } else if (json && Array.isArray(json.dbCards)) {
                            saveAllState(json.dbCards, json.decks || []);
                            if (typeof json.themeIndex === 'number') handleSelectTheme(json.themeIndex);
                            if (typeof json.genNumber === 'number') handleSelectGen(json.genNumber);
                        }
                    } catch (err) {
                        console.error("Error parsing JSON backup.");
                    }
                };
                reader.readAsText(file);
            };

            const handleClearDatabase = () => {
                saveAllState([], []);
                setShowClearConfirm(false);
            };

            const handleUpdateCard = (updatedCard) => {
                const cardKey = `${updatedCard.set}-${updatedCard.number}`;
                setDbCards(prev => {
                    const newCards = prev.map(c => `${c.set}-${c.number}` === cardKey ? updatedCard : c);
                    localStorage.setItem('pokeKioskDB', JSON.stringify(newCards));
                    return newCards;
                });
            };

            const selectedCard = useMemo(() => {
                if (!selectedCardKey) return null;
                return dbCards.find(c => `${c.set}-${c.number}` === selectedCardKey) || null;
            }, [dbCards, selectedCardKey]);

            const uniqueSets = useMemo(() => {
                const sets = {};
                dbCards.forEach(c => {
                    if (!sets[c.set]) sets[c.set] = c.officialSetId;
                });
                return Object.keys(sets).map(k => ({ label: k, id: sets[k] })).sort((a,b) => a.label.localeCompare(b.label));
            }, [dbCards]);

            // Map of how many copies of each card key are currently assigned across all decks
            const deckCardCountsMap = useMemo(() => {
                const map = {};
                decks.forEach(d => {
                    d.cards.forEach(c => {
                        const k = `${c.set}-${c.number}`;
                        map[k] = (map[k] || 0) + c.count;
                    });
                });
                return map;
            }, [decks]);

            /* STREAMING_CHUNK:Implementing comma-separated multi-parameter search, *#* rating search, and deck-card slider filtering... */
            const filteredCards = useMemo(() => {
                return dbCards.filter(card => {
                    const cardKey = `${card.set}-${card.number}`;
                    const inDeckCount = deckCardCountsMap[cardKey] || 0;

                    // Slider logic:
                    // When includeDeckCards is FALSE (Hide cards used in decks):
                    // hide cards that have 0 remaining copies in DB (or are used in decks with no available copies)
                    if (!includeDeckCards && card.count <= 0) return false;

                    // Multi-parameter search with commas (e.g. Altaria, "80", *2*)
                    let matchesSearch = true;
                    if (searchTerm.trim()) {
                        const clauses = searchTerm
                            .split(',')
                            .map(s => s.trim())
                            .filter(Boolean);

                        matchesSearch = clauses.every(clause => {
                            const lowerClause = clause.toLowerCase();

                            // 1. Check for Rating search in asterisks: e.g. *2*
                            const exactStarMatch = lowerClause.match(/^\*([0-5])\*$/);
                            if (exactStarMatch) {
                                const targetRating = parseInt(exactStarMatch[1], 10);
                                return (card.rating || 0) === targetRating;
                            }

                            // 2. Check if clause is a quoted Deep Search: e.g. "80" or "draw"
                            const isDeepSearch = lowerClause.startsWith('"') && lowerClause.endsWith('"') && lowerClause.length > 2;
                            if (isDeepSearch) {
                                const cleanTerm = lowerClause.slice(1, -1).trim();
                                if (!cleanTerm) return true;
                                const inName = card.name.toLowerCase().includes(cleanTerm);
                                const inHp = card.hp && String(card.hp).toLowerCase().includes(cleanTerm);
                                const inAttacks = card.attacks && card.attacks.some(a =>
                                    (a.name && a.name.toLowerCase().includes(cleanTerm)) ||
                                    (a.text && a.text.toLowerCase().includes(cleanTerm)) ||
                                    (a.damage && String(a.damage).toLowerCase().includes(cleanTerm))
                                );
                                const inAbilities = card.abilities && card.abilities.some(a =>
                                    (a.name && a.name.toLowerCase().includes(cleanTerm)) ||
                                    (a.text && a.text.toLowerCase().includes(cleanTerm))
                                );
                                const inRules = card.rules && card.rules.some(r => r.toLowerCase().includes(cleanTerm));
                                const inSubtypes = card.subtypes && card.subtypes.some(s => s.toLowerCase().includes(cleanTerm));
                                return Boolean(inName || inHp || inAttacks || inAbilities || inRules || inSubtypes);
                            }

                            // 3. Support inline *#* rating inside a single clause or standard name/set match
                            const inlineStarMatch = lowerClause.match(/\*([0-5])\*/);
                            let remainingText = lowerClause;
                            if (inlineStarMatch) {
                                const targetRating = parseInt(inlineStarMatch[1], 10);
                                if ((card.rating || 0) !== targetRating) return false;
                                remainingText = lowerClause.replace(/\*[0-5]\*/g, '').trim();
                                if (!remainingText) return true;
                            }

                            return card.name.toLowerCase().includes(remainingText);
                        });
                    }

                    const matchesCategory = categoryFilter === 'All' || (card.category && card.category.includes(categoryFilter));
                    
                    let matchesType = true;
                    if (categoryFilter === 'Pokémon' && typeFilter !== 'All') {
                        matchesType = card.types && Array.isArray(card.types) && card.types.some(t => t.toLowerCase() === typeFilter.toLowerCase());
                    }
                    
                    let matchesSpecial = true;
                    if (categoryFilter === 'Pokémon' && specialFilter !== 'All') {
                        const hasSubtype = card.subtypes && card.subtypes.some(sub => sub.toUpperCase() === specialFilter.toUpperCase());
                        const regex = new RegExp(`(^|[-\\s])${specialFilter}([-\\s]|$)`, 'i');
                        const hasInName = regex.test(card.name);
                        matchesSpecial = hasSubtype || hasInName;
                    }
                    
                    let matchesTrainer = true;
                    if (categoryFilter === 'Trainer' && trainerFilter !== 'All') {
                        matchesTrainer = card.subtypes && card.subtypes.some(sub => sub.toLowerCase().includes(trainerFilter.toLowerCase()));
                    }

                    let matchesEnergy = true;
                    if (categoryFilter === 'Energy' && energyFilter !== 'All') {
                        const basicEnergyNames = ['grass energy', 'fire energy', 'water energy', 'lightning energy', 'psychic energy', 'fighting energy', 'darkness energy', 'metal energy', 'fairy energy'];
                        const isSpecial = (card.subtypes && card.subtypes.some(sub => sub.toLowerCase().includes('special'))) || 
                                          !basicEnergyNames.includes(card.name.toLowerCase().trim());
                        
                        if (energyFilter === 'Special') matchesEnergy = isSpecial;
                        if (energyFilter === 'Basic') matchesEnergy = !isSpecial;
                    }

                    let matchesSet = true;
                    if (setFilter !== 'All') {
                        matchesSet = card.set === setFilter;
                    }

                    return matchesSearch && matchesCategory && matchesType && matchesSpecial && matchesTrainer && matchesEnergy && matchesSet;
                });
            }, [dbCards, deckCardCountsMap, includeDeckCards, searchTerm, categoryFilter, typeFilter, specialFilter, trainerFilter, energyFilter, setFilter]);

            const totalAvailableCards = dbCards.reduce((acc, card) => acc + card.count, 0);
            const totalDeckCards = decks.reduce((acc, d) => acc + d.cards.reduce((s, c) => s + c.count, 0), 0);
            const uniqueAvailableCards = dbCards.filter(c => c.count > 0).length;
            
            const enrichmentProgress = useMemo(() => {
                if (dbCards.length === 0) return { percent: 100, isComplete: true };
                const enriched = dbCards.filter(c => c.enriched).length;
                return { 
                    percent: Math.round((enriched / dbCards.length) * 100), 
                    isComplete: enriched === dbCards.length 
                };
            }, [dbCards]);

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    
                    {/* Top Header & Filter Controls (ORAS PokéNav Plus / DexNav Styled) */}
                    <div className="flex-none theme-header z-20">
                        <div className="oras-top-strip"></div>
                        <div className="max-w-7xl mx-auto px-3 sm:px-6 py-3 flex flex-col lg:flex-row justify-between items-center gap-3">
                            {/* Left Brand + 3D Type Coin + Generation Box */}
                            <div className="flex items-center justify-between w-full lg:w-auto gap-3">
                                <div className="flex items-center gap-3 min-w-0">
                                    <img 
                                        src={LOGO_URL} 
                                        alt="Logo" 
                                        className="w-11 h-11 object-contain drop-shadow-md hover:scale-105 transition-transform flex-shrink-0" 
                                        style={{ width: '44px', height: '44px', minWidth: '44px', minHeight: '44px', flexShrink: 0 }}
                                        onError={(e) => { e.target.style.display = 'none'; }}
                                    />
                                    <div className="min-w-0">
                                        <div className="flex items-center gap-2">
                                            <h1 className="text-base sm:text-xl font-extrabold text-white tracking-tight leading-tight truncate gen-title-font">
                                                Deckbuilder Pokedex
                                            </h1>
                                        </div>
                                        <div className="flex flex-wrap items-center gap-2 mt-0.5">
                                            <p className="text-[11px] sm:text-xs text-slate-300 font-medium">
                                                <span className="font-bold text-emerald-400">{totalAvailableCards}</span> in DB • <span className="font-bold" style={{ color: 'var(--theme-text-accent)' }}>{totalDeckCards}</span> in Decks • {uniqueAvailableCards} Unique
                                            </p>
                                            {!enrichmentProgress.isComplete && (
                                                <div className="flex items-center gap-1.5 bg-blue-900/60 px-2 py-0.5 rounded-full border border-blue-500 animate-pulse">
                                                    <div className="w-2.5 h-2.5 border-2 border-blue-400/30 border-t-blue-400 rounded-full animate-spin"></div>
                                                    <span className="text-[10px] text-blue-200 font-semibold tracking-wide">Sync {enrichmentProgress.percent}%</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* 3D Type Coin + Generation Number Box */}
                                <TypeCoinAndGenBox 
                                    themeIndex={themeIndex} 
                                    onFlipCoin={handleFlipCoin} 
                                    onSelectTheme={handleSelectTheme}
                                    genNumber={genNumber}
                                    onCycleGen={handleCycleGen}
                                    onSelectGen={handleSelectGen}
                                />
                            </div>
                            
                            {/* Right Action Buttons */}
                            <div className="flex flex-wrap items-center gap-1.5 sm:gap-2 w-full lg:w-auto justify-end">
                                <button onClick={handleExportJSON} className="px-2.5 py-1.5 oras-subpanel hover:bg-slate-700 text-xs font-bold transition-colors text-slate-200">
                                    Export JSON
                                </button>
                                <label className="px-2.5 py-1.5 oras-subpanel hover:bg-slate-700 text-xs font-bold transition-colors cursor-pointer text-slate-200">
                                    Load JSON
                                    <input type="file" accept=".json" className="hidden" style={{ display: 'none' }} onChange={handleImportJSON} />
                                </label>
                                <button onClick={() => setShowClearConfirm(true)} className="flex items-center gap-1 px-2.5 py-1.5 bg-red-900 hover:bg-red-800 rounded-lg text-xs font-bold text-red-100 transition-colors border border-red-700">
                                    <Icons.Trash /> Clear DB
                                </button>
                                <button onClick={() => setShowImport(true)} className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold theme-btn-primary">
                                    <Icons.Upload /> Import Text
                                </button>
                                <button 
                                    onClick={() => setIsDeckWindowOpen(!isDeckWindowOpen)} 
                                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-extrabold border transition-all ${
                                        isDeckWindowOpen 
                                            ? 'bg-white text-slate-900 border-white shadow-lg' 
                                            : 'oras-subpanel text-white hover:bg-slate-700'
                                    }`}
                                >
                                    <Icons.Deck />
                                    <span>Decks ({decks.length})</span>
                                </button>
                            </div>
                        </div>

                        {/* Search, Multi-Parameter Input & Deck Card Slider Bar */}
                        <div className="max-w-7xl mx-auto px-3 sm:px-6 pb-3.5 flex flex-col gap-2.5">
                            <div className="flex flex-col md:flex-row gap-2.5 items-stretch md:items-center">
                                <div className="relative flex-grow">
                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                        <Icons.Search />
                                    </div>
                                    <input
                                        type="text"
                                        className="block w-full pl-11 pr-10 py-2.5 oras-subpanel text-white placeholder-slate-400 focus:outline-none text-sm"
                                        placeholder='DexNav Search: e.g. Altaria, "80", *3* (use commas, "quotes", or *1*-*5*)'
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                    {searchTerm && (
                                        <button onClick={() => setSearchTerm('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white">
                                            <Icons.X />
                                        </button>
                                    )}
                                </div>

                                <div className="flex items-center justify-between md:justify-end gap-2.5 overflow-x-auto no-scrollbar">
                                    {/* Category Tabs */}
                                    <div className="flex oras-subpanel p-1">
                                        {['All', 'Pokémon', 'Trainer', 'Energy'].map(cat => (
                                            <button 
                                                key={cat}
                                                onClick={() => {
                                                    setCategoryFilter(cat);
                                                    setTypeFilter('All');
                                                    setTrainerFilter('All');
                                                    setEnergyFilter('All');
                                                }}
                                                className={`px-3 sm:px-3.5 py-1.5 rounded-md font-bold text-xs whitespace-nowrap transition-all ${categoryFilter === cat ? 'theme-btn-primary' : 'text-slate-300 hover:text-white'}`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Slider to Include or Hide Cards Used in Decks */}
                                    <div 
                                        onClick={() => setIncludeDeckCards(!includeDeckCards)}
                                        className="flex items-center gap-2 px-3 py-1.5 oras-subpanel cursor-pointer select-none flex-shrink-0"
                                        title="Toggle slider to include or hide cards that have been moved into decks"
                                    >
                                        <div 
                                            className="oras-slider-track"
                                            style={{
                                                backgroundColor: includeDeckCards ? 'var(--theme-accent)' : '#1e293b',
                                                borderColor: includeDeckCards ? 'var(--theme-text-accent)' : '#475569'
                                            }}
                                        >
                                            <div 
                                                className="oras-slider-thumb"
                                                style={{
                                                    transform: includeDeckCards ? 'translateX(20px)' : 'translateX(2px)'
                                                }}
                                            />
                                        </div>
                                        <div className="flex flex-col text-left leading-tight">
                                            <span className="text-[11px] font-extrabold text-white whitespace-nowrap">
                                                Include Deck Cards
                                            </span>
                                            <span className="text-[10px] text-slate-300 whitespace-nowrap">
                                                {includeDeckCards ? `Showing (${totalDeckCards} in decks)` : 'Hiding depleted'}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Conditional Sub-Filters */}
                            {categoryFilter === 'Pokémon' && (
                                <div className="flex flex-col gap-2 animate-slide-up">
                                    <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mr-1 flex-shrink-0">Type:</span>
                                        <button 
                                            onClick={() => setTypeFilter('All')} 
                                            className={`px-3 py-1 flex-shrink-0 rounded-full text-xs font-bold border transition-colors ${typeFilter === 'All' ? 'theme-pill-active' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                                        >All</button>
                                        {POKEMON_TYPES.map(pt => (
                                            <button 
                                                key={pt.value}
                                                onClick={() => setTypeFilter(pt.value)}
                                                className={`px-3 py-1 flex-shrink-0 rounded-full text-xs font-bold border transition-colors ${typeFilter === pt.value ? 'theme-pill-active' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                                            >{pt.label}</button>
                                        ))}
                                    </div>
                                    <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mr-1 flex-shrink-0">Special:</span>
                                        <button 
                                            onClick={() => setSpecialFilter('All')} 
                                            className={`px-3 py-1 flex-shrink-0 rounded-full text-xs font-bold border transition-colors ${specialFilter === 'All' ? 'theme-pill-active' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                                        >All</button>
                                        {SPECIAL_TYPES.map(st => (
                                            <button 
                                                key={st}
                                                onClick={() => setSpecialFilter(st)}
                                                className={`px-3 py-1 flex-shrink-0 rounded-full text-xs font-bold border transition-colors ${specialFilter === st ? 'theme-pill-active' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                                            >{st}</button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {categoryFilter === 'Trainer' && (
                                <div className="flex items-center gap-1.5 overflow-x-auto pb-1 animate-slide-up">
                                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mr-1 flex-shrink-0">Class:</span>
                                    <button 
                                        onClick={() => setTrainerFilter('All')} 
                                        className={`px-3 py-1 flex-shrink-0 rounded-full text-xs font-bold border transition-colors ${trainerFilter === 'All' ? 'theme-pill-active' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                                    >All</button>
                                    {TRAINER_TYPES.map(tt => (
                                        <button 
                                            key={tt}
                                            onClick={() => setTrainerFilter(tt)}
                                            className={`px-3 py-1 flex-shrink-0 rounded-full text-xs font-bold border transition-colors ${trainerFilter === tt ? 'theme-pill-active' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                                        >{tt}</button>
                                    ))}
                                </div>
                            )}

                            {categoryFilter === 'Energy' && (
                                <div className="flex items-center gap-1.5 overflow-x-auto pb-1 animate-slide-up">
                                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mr-1 flex-shrink-0">Type:</span>
                                    {['All', 'Basic', 'Special'].map(et => (
                                        <button 
                                            key={et}
                                            onClick={() => setEnergyFilter(et)}
                                            className={`px-3 py-1 flex-shrink-0 rounded-full text-xs font-bold border transition-colors ${energyFilter === et ? 'theme-pill-active' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`}
                                        >{et}</button>
                                    ))}
                                </div>
                            )}

                            {/* Set Icon Filters */}
                            {uniqueSets.length > 0 && (
                                <div className="flex items-center gap-2 overflow-x-auto pb-2 pt-2 border-t border-slate-700/50">
                                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mr-1 flex-shrink-0">Set:</span>
                                    <button 
                                        onClick={() => setSetFilter('All')} 
                                        className={`px-3.5 py-1 flex-shrink-0 rounded-lg text-xs font-bold border transition-all ${setFilter === 'All' ? 'theme-pill-active' : 'bg-slate-900 border-slate-700 text-slate-400 hover:bg-slate-800'}`}
                                    >
                                        All Sets
                                    </button>
                                    {uniqueSets.map(s => (
                                        <button 
                                            key={s.label}
                                            onClick={() => setSetFilter(s.label)}
                                            className={`flex items-center flex-shrink-0 gap-1.5 px-3 py-1 rounded-lg text-xs font-bold border transition-all ${setFilter === s.label ? 'theme-pill-active' : 'bg-slate-800/70 border-slate-700 text-slate-300 hover:bg-slate-700'}`}
                                            title={s.label}
                                        >
                                            <img 
                                                src={`https://images.pokemontcg.io/${s.id}/symbol.png`} 
                                                alt={s.label} 
                                                className="h-4 w-4 flex-shrink-0 object-contain filter invert opacity-90" 
                                                style={{ width: '16px', height: '16px' }}
                                                onError={(e) => { e.target.style.display = 'none'; }} 
                                            />
                                            <span>{s.label}</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Main Body Workspace: Card View (Left/Center) + Collapsible Deck Window (Right) */}
                    <div className="flex-grow flex overflow-hidden relative">
                        
                        {/* Card View (Main Grid) */}
                        <div className="flex-grow overflow-y-auto p-3 sm:p-6" style={{ WebkitOverflowScrolling: 'touch' }}>
                            <div className="max-w-7xl mx-auto h-full">
                                {filteredCards.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-300 space-y-4 py-16">
                                        <Icons.Filter />
                                        <p className="text-base sm:text-lg font-semibold text-center">
                                            {dbCards.length === 0 
                                                ? "No cards in database. Tap 'Import Text' to start." 
                                                : "No cards in Card View match your current DexNav filters."}
                                        </p>
                                    </div>
                                ) : (
                                    <div className="cards-grid-layout pb-16 animate-slide-up">
                                        {filteredCards.map(card => {
                                            const cardKey = `${card.set}-${card.number}`;
                                            const inDeckCount = deckCardCountsMap[cardKey] || 0;
                                            return (
                                                <div 
                                                    key={card.id} 
                                                    onClick={() => setSelectedCardKey(cardKey)}
                                                    className={`theme-card relative p-2.5 flex flex-col cursor-pointer text-left h-full ${card.count <= 0 ? 'opacity-65' : ''}`}
                                                >
                                                    {/* Available Quantity Badge & In-Deck Indicator */}
                                                    <div className="absolute top-2 right-2 z-10 flex flex-col items-end gap-1">
                                                        <div 
                                                            className="text-white text-xs font-black px-2.5 py-0.5 rounded-full shadow-lg border border-white/40"
                                                            style={{ backgroundColor: card.count > 0 ? 'var(--theme-accent)' : '#d97706' }}
                                                        >
                                                            {card.count}x
                                                        </div>
                                                        {inDeckCount > 0 && (
                                                            <div className="bg-blue-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full shadow border border-blue-300">
                                                                {inDeckCount} in Deck
                                                            </div>
                                                        )}
                                                    </div>

                                                    {/* Quick Move to Active Deck Button */}
                                                    {card.count > 0 && decks.length > 0 && (
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleMoveToDeck(card, activeDeckId || decks[0].id, 1);
                                                            }}
                                                            className="absolute top-2 left-2 z-10 bg-slate-900 hover:bg-emerald-600 text-white text-[11px] font-extrabold px-2 py-1 rounded-lg border border-slate-500 shadow-md flex items-center gap-1 transition-colors"
                                                            title={`Move 1 copy from DB to ${decks.find(d => d.id === (activeDeckId || decks[0]?.id))?.name || 'Deck'}`}
                                                        >
                                                            <Icons.Plus /> Deck
                                                        </button>
                                                    )}
                                                    
                                                    <LazyImage src={card.imageUrl} alt={card.name} className="w-full card-aspect-ratio rounded-lg bg-slate-900" />
                                                    
                                                    <div className="mt-2.5 px-1 flex-grow flex flex-col justify-end">
                                                        <div className="flex items-start justify-between gap-1">
                                                            <p className="text-white font-bold text-sm leading-tight line-clamp-2">{card.name}</p>
                                                            {card.prices?.primary && (
                                                                <span className="text-xs font-extrabold text-emerald-400 flex-shrink-0">
                                                                    ${card.prices.primary.toFixed(2)}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <div className="flex justify-between items-center mt-1.5">
                                                            <div className="flex flex-col">
                                                                <p className="text-slate-300 text-xs">{card.set} #{card.number}</p>
                                                                <div className="flex gap-0.5 mt-1" onClick={e => e.stopPropagation()}>
                                                                    {Array.from({length: 5}).map((_, i) => {
                                                                        const star = i + 1;
                                                                        return (
                                                                            <button
                                                                                key={i}
                                                                                onClick={() => handleUpdateCard({...card, rating: card.rating === star ? 0 : star})}
                                                                                className="focus:outline-none"
                                                                            >
                                                                                <Icons.Pokeball 
                                                                                    className={`w-3.5 h-3.5 ${star <= (card.rating || 0) ? 'text-red-500 fill-red-500 drop-shadow-[0_0_4px_rgba(239,68,68,0.5)]' : 'text-slate-500 hover:text-slate-300'}`} 
                                                                                />
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                            <span className="text-[10px] uppercase tracking-wider text-slate-300 oras-subpanel px-1.5 py-0.5">
                                                                {card.category ? card.category.substring(0,3) : 'CRD'}
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Collapsible Right-Side Deck Window */}
                        <DeckWindow
                            isOpen={isDeckWindowOpen}
                            onToggle={() => setIsDeckWindowOpen(!isDeckWindowOpen)}
                            decks={decks}
                            activeDeckId={activeDeckId}
                            onSelectDeck={setActiveDeckId}
                            onCreateDeck={handleCreateDeck}
                            onUpdateDeckMeta={handleUpdateDeckMeta}
                            onDeleteDeck={handleDeleteDeck}
                            onMoveOneToDeck={(card, dId) => handleMoveToDeck(card, dId, 1)}
                            onRemoveFromDeck={handleRemoveFromDeck}
                            onOpenCardFullView={(c) => setSelectedCardKey(`${c.set}-${c.number}`)}
                        />
                    </div>

                    {/* Full View Modal */}
                    {selectedCard && (
                        <CardModal 
                            card={selectedCard} 
                            decks={decks}
                            activeDeckId={activeDeckId}
                            onClose={() => setSelectedCardKey(null)} 
                            onUpdateCard={handleUpdateCard}
                            onMoveToDeck={handleMoveToDeck}
                            onRemoveFromDeck={handleRemoveFromDeck}
                        />
                    )}

                    {/* Import Text Modal */}
                    {showImport && <ImportModal onClose={() => setShowImport(false)} onImport={handleImport} />}
                    
                    {/* Clear Database Confirmation Modal */}
                    {showClearConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md animate-fade-in">
                            <div className="oras-modal-panel w-full max-w-sm overflow-hidden relative flex flex-col">
                                <div className="p-6 border-b border-slate-700">
                                    <h3 className="text-xl font-bold text-red-400 flex items-center gap-2"><Icons.Trash /> Clear Database & Decks</h3>
                                </div>
                                <div className="p-6">
                                    <p className="text-slate-200 text-sm">Are you sure you want to delete all cards and decks from your local database? This cannot be undone unless you have exported a JSON backup.</p>
                                </div>
                                <div className="p-4 border-t border-slate-700 flex justify-end gap-3">
                                    <button onClick={() => setShowClearConfirm(false)} className="px-4 py-2 rounded-lg font-bold text-slate-300 hover:bg-slate-700 transition">Cancel</button>
                                    <button onClick={handleClearDatabase} className="px-4 py-2 rounded-lg font-bold bg-red-600 hover:bg-red-500 text-white transition shadow-lg">Yes, Clear All</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
